/* Layout: full-bleed map stage on the left, a sticky info dossier on the right; stacks on phones.
   Colour comes from the flag: Flanders gold, Wallonia red, Brussels iris-blue, on an ink ground. */
:root {
  --bg: #f3f4f7;
  --surface: #ffffff;
  --surface-2: #eceef3;
  --line: #d9dce5;
  --fg: #12141a;
  --muted: #5d6273;
  --sea: #e3e8f2;
  --flanders: #d9a400;
  --flanders-soft: #f6e3a1;

  --wallonia-soft: #f5c2c4;

  --stroke: #ffffff;
  --shadow: 0 1px 2px rgb(18 20 26 / .06), 0 8px 24px rgb(18 20 26 / .06);
  --font-display: "Bricolage Grotesque", "Inter", system-ui, sans-serif;
  --font-body: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f1115; --surface: #171a21; --surface-2: #1f232c; --line: #2a2f3a;
    --fg: #eef0f5; --muted: #949aab; --sea: #141820;
    --flanders: #f2c230; --flanders-soft: #4a3d12;
    --wallonia: #f0555c; --wallonia-soft: #4d1d21;
    --brussels: #5b8dff; --brussels-soft: #1c2c52;
    --stroke: #0f1115;
    --shadow: 0 1px 2px rgb(0 0 0 / .3), 0 12px 32px rgb(0 0 0 / .35);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f1115; --surface: #171a21; --surface-2: #1f232c; --line: #2a2f3a;
  --fg: #eef0f5; --muted: #949aab; --sea: #141820;
  --flanders: #f2c230; --flanders-soft: #4a3d12;
  --wallonia: #f0555c; --wallonia-soft: #4d1d21;
  --brussels: #5b8dff; --brussels-soft: #1c2c52;
  --stroke: #0f1115;
  --shadow: 0 1px 2px rgb(0 0 0 / .3), 0 12px 32px rgb(0 0 0 / .35);
  color-scheme: dark;
}

* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--fg);
  font: 15px/1.55 var(--font-body);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 20px 32px;
}
.wrap { max-width: 1280px; margin: 0 auto; display: grid; gap: 20px; }

header { display: flex; flex-wrap: wrap; align-items: end; justify-content: space-between; gap: 16px; }
.brand { display: flex; align-items: center; gap: 14px; min-width: 0; }
.flag { display: flex; width: 36px; height: 26px; border-radius: 5px; overflow: hidden; flex: none; box-shadow: 0 0 0 1px var(--line); }
.flag i { flex: 1; }
.flag i:nth-child(1) { background: #111; }
.flag i:nth-child(2) { background: #fdda24; }
.flag i:nth-child(3) { background: #ef3340; }
h1 { font: 800 clamp(1.6rem, 3.2vw, 2.4rem)/1.05 var(--font-display); letter-spacing: -.02em; margin: 0; text-wrap: balance; }
.sub { color: var(--muted); margin: 4px 0 0; font-size: .92rem; }

.seg { display: inline-flex; background: var(--surface-2); border: 1px solid var(--line); border-radius: 999px; padding: 4px; gap: 2px; }
.seg button {
  font: 600 .85rem var(--font-body); color: var(--muted); background: none; border: 0;
  padding: 8px 16px; border-radius: 999px; cursor: pointer; transition: background .2s, color .2s;
}
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--fg); box-shadow: var(--shadow); }
.seg button:focus-visible, .chip:focus-visible, .copy:focus-visible { outline: 2px solid var(--brussels); outline-offset: 2px; }

.main { display: grid; grid-template-columns: minmax(0, 1.55fr) minmax(0, 1fr); gap: 20px; align-items: start; }
@media (max-width: 900px) { .main { grid-template-columns: minmax(0, 1fr); } }

.stage {
  position: relative; background: var(--sea); border: 1px solid var(--line); border-radius: 20px;
  overflow: hidden; min-width: 0;
  background-image: radial-gradient(circle at 1px 1px, color-mix(in srgb, var(--muted) 22%, transparent) 1px, transparent 0);
  background-size: 22px 22px;
}
.stage svg { display: block; width: 100%; height: auto; }
.prov {
  stroke: var(--stroke); stroke-width: 1.6; stroke-linejoin: round; cursor: pointer;
  transition: fill .25s ease, opacity .25s ease, transform .25s ease;
  outline: none;
}
.prov.flanders { fill: var(--flanders); }
.prov.wallonia { fill: var(--wallonia); }
.prov.brussels { fill: var(--brussels); }
svg.has-sel .prov:not(.sel) { opacity: .38; }
svg.has-sel .prov.sel { opacity: 1; }
.prov:hover, .prov:focus-visible { opacity: 1 !important; filter: brightness(1.08) saturate(1.1); }
.prov:focus-visible { stroke: var(--fg); stroke-width: 2.4; }
svg.regions .prov { stroke-width: .6; stroke: color-mix(in srgb, var(--stroke) 45%, transparent); }
.lbl { font: 700 13px var(--font-display); fill: var(--fg); paint-order: stroke; stroke: var(--sea); stroke-width: 4px; stroke-linejoin: round; pointer-events: none; letter-spacing: .01em; }
.lbl.big { font-size: 22px; }
.city circle { fill: var(--fg); stroke: var(--sea); stroke-width: 2; }
.city text { font: 500 11px var(--font-body); fill: var(--fg); paint-order: stroke; stroke: var(--sea); stroke-width: 3.5px; stroke-linejoin: round; }
.city { pointer-events: none; }
.edge { font: 600 11px var(--font-mono); fill: var(--muted); letter-spacing: .18em; pointer-events: none; }

.tip {
  position: absolute; pointer-events: none; background: var(--surface); color: var(--fg);
  border: 1px solid var(--line); border-radius: 10px; padding: 8px 12px; box-shadow: var(--shadow);
  font-size: .82rem; white-space: nowrap; transform: translate(-50%, calc(-100% - 14px)); opacity: 0; transition: opacity .15s;
}
.tip.on { opacity: 1; }
.tip b { font-family: var(--font-display); font-size: .95rem; }
.tip span { color: var(--muted); margin-left: 6px; }

.legend { position: absolute; left: 14px; bottom: 14px; display: flex; flex-wrap: wrap; gap: 6px; }
.legend span {
  display: inline-flex; align-items: center; gap: 6px; font-size: .75rem; font-weight: 600;
  background: color-mix(in srgb, var(--surface) 85%, transparent); backdrop-filter: blur(6px);
  border: 1px solid var(--line); border-radius: 999px; padding: 4px 10px;
}
.legend i { width: 9px; height: 9px; border-radius: 50%; }

/* Dossier panel */
.panel {
  background: var(--surface); border: 1px solid var(--line); border-radius: 20px; box-shadow: var(--shadow);
  padding: 22px; display: grid; gap: 18px; min-width: 0; position: sticky; top: calc(env(safe-area-inset-top, 0px) + 16px);
}
@media (max-width: 900px) { .panel { position: static; } }
.panel-top { display: flex; justify-content: space-between; align-items: start; gap: 12px; }
.badge {
  display: inline-flex; align-items: center; gap: 6px; font: 600 .72rem var(--font-mono); text-transform: uppercase; letter-spacing: .1em;
  padding: 4px 10px; border-radius: 999px; background: var(--soft); color: var(--fg);
}
.badge i { width: 8px; height: 8px; border-radius: 50%; background: var(--hue); }
.panel h2 { font: 800 clamp(1.7rem, 3vw, 2.3rem)/1.05 var(--font-display); letter-spacing: -.02em; margin: 10px 0 4px; text-wrap: balance; }
.names { color: var(--muted); font-size: .85rem; margin: 0; }
.names em { font-style: normal; font-family: var(--font-mono); font-size: .7rem; color: var(--muted); opacity: .8; margin-right: 4px; }
.copy {
  flex: none; font: 600 .78rem var(--font-body); color: var(--muted); background: var(--surface-2); border: 1px solid var(--line);
  border-radius: 999px; padding: 6px 12px; cursor: pointer;
}
.copy:hover { color: var(--fg); }
.stats { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 1px; background: var(--line); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; }
.stat { background: var(--surface); padding: 12px 14px; min-width: 0; }
.stat dt { font: 500 .68rem var(--font-mono); text-transform: uppercase; letter-spacing: .1em; color: var(--muted); }
.stat dd { margin: 2px 0 0; font: 700 1.1rem/1.25 var(--font-display); font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
.stat dd small { font: 500 .75rem var(--font-body); color: var(--muted); }
.lede { margin: 0; max-width: 65ch; }
.sec h3 { font: 600 .7rem var(--font-mono); text-transform: uppercase; letter-spacing: .12em; color: var(--muted); margin: 0 0 8px; }
.sec ul { margin: 0; padding: 0; list-style: none; display: grid; gap: 8px; }
.sec li { display: grid; grid-template-columns: 8px 1fr; gap: 10px; align-items: baseline; }
.sec li::before { content: ""; width: 6px; height: 6px; border-radius: 2px; background: var(--hue); transform: translateY(-1px); }
.fact { background: var(--soft); border-radius: 14px; padding: 12px 14px; font-size: .9rem; }
.fact b { font-family: var(--font-display); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip {
  font: 500 .8rem var(--font-body); color: var(--fg); background: var(--surface-2); border: 1px solid var(--line);
  border-radius: 999px; padding: 5px 11px; cursor: pointer; display: inline-flex; align-items: center; gap: 6px;
}
.chip i { width: 7px; height: 7px; border-radius: 50%; }
.chip:hover { border-color: var(--muted); }
.chip[aria-current="true"] { background: var(--fg); color: var(--bg); border-color: var(--fg); }

.panel.swap > * { animation: rise .35s ease both; }
@keyframes rise { from { opacity: .0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

footer { color: var(--muted); font-size: .78rem; text-align: center; }
footer a { color: inherit; }
@media (prefers-reduced-motion: reduce) {
  * { transition: none !important; animation: none !important; }
}
@media (max-width: 520px) {
  .lbl { font-size: 24px; stroke-width: 6px; } .lbl.big { font-size: 40px; }
  .edge { display: none; }
  .city { display: none; }
  .legend { position: static; padding: 0 12px 12px; }
}
</style>

const order = Object.keys(GEO.shapes).sort((a, b) => (a === "brussels") - (b === "brussels"));
for (const key of order) {
  const p = PROVINCES[key];
  const path = el("path", { d: GEO.shapes[key].d, class: `prov ${p.region}`, tabindex: 0, role: "button", "aria-label": p.name, "fill-rule": "evenodd" });
  path.dataset.key = key;
  shapes[key] = path;
  gShapes.append(path);
}

const gLabels = el("g");
svg.append(gLabels);
const gCities = el("g");
svg.append(gCities);
for (const [k, [x, y]] of Object.entries(GEO.cities)) {
  const g = el("g", { class: "city" });
  g.append(el("circle", { cx: x, cy: y, r: k === "brussels" ? 4.5 : 3.2 }));
  const right = !["arlon", "liege"].includes(k);
  g.append(el("text", { x: x + (right ? 7 : -7), y: y + 4, "text-anchor": right ? "start" : "end" }, CITIES[k]));
  gCities.append(g);
}

function drawLabels() {
  gLabels.replaceChildren();
  if (mode === "province") {
    for (const key of Object.keys(PROVINCES)) {
      if (key === "brussels") continue;
      const pos = LABELS[key] || [GEO.shapes[key].cx, GEO.shapes[key].cy];
      gLabels.append(el("text", { class: "lbl", x: pos[0], y: pos[1], "text-anchor": "middle" }, PROVINCES[key].name));
    }
  } else {
    for (const [r, pos] of Object.entries(REGION_LABELS)) {
      if (!pos) continue;
      gLabels.append(el("text", { class: "lbl big", x: pos[0], y: pos[1], "text-anchor": "middle" }, REGIONS[r].name));
    }
  }
}

// per-province shade within its region so neighbours separate
const SHADES = { "antwerp": 0, "east-flanders": 18, "west-flanders": 6, "flemish-brabant": 26, "limburg": 12,
  "hainaut": 0, "liege": 16, "namur": 26, "luxembourg": 8, "walloon-brabant": 34, "brussels": 0 };
function paint() {
  for (const [key, path] of Object.entries(shapes)) {
    const r = PROVINCES[key].region;
    const s = mode === "province" ? SHADES[key] : 0;
    path.style.fill = `color-mix(in srgb, var(--${r}) ${100 - s}%, var(--bg))`;
  }
}

const fmt = n => n >= 1e6 ? (n / 1e6).toFixed(2).replace(/0$/, "") + "M" : Math.round(n / 1000) + "k";
const num = n => n.toLocaleString("en-US");

function regionOf(key) { return PROVINCES[key].region; }
function currentTarget(key) { return mode === "province" ? key : regionOf(key); }

function setSelected(id, push = true) {
  selected = id;
  svg.classList.toggle("has-sel", !!id);
  for (const [key, path] of Object.entries(shapes)) {
    const on = id && (mode === "province" ? key === id : regionOf(key) === id);
    path.classList.toggle("sel", !!on);
    path.setAttribute("aria-pressed", on ? "true" : "false");
  }
  render();
  if (push) {
    const h = id ? "#" + id : "";
    if (location.hash !== h) history.replaceState(null, "", h || location.pathname + location.search);
  }
}

function hueVars(region) {
  const R = REGIONS[region];
  return `--hue: var(${R.hue}); --soft: var(${R.soft});`;
}

function namesHTML(local) {
  return `<p class="names"><em>NL</em>${local.nl} &nbsp; <em>FR</em>${local.fr} &nbsp; <em>DE</em>${local.de}</p>`;
}

function chipsHTML() {
  const items = mode === "province" ? Object.entries(PROVINCES).map(([k, p]) => [k, p.name, p.region]) : Object.entries(REGIONS).map(([k, r]) => [k, r.name, k]);
  return `<div class="sec"><h3>${mode === "province" ? "All provinces" : "All regions"}</h3><div class="chips">${items.map(([k, n, r]) =>
    `<button class="chip" data-go="${k}" aria-current="${k === selected}"><i style="background:var(--${r})"></i>${n}</button>`).join("")}</div></div>`;
}

function render() {
  let html;
  if (!selected) {
    html = `
      <div><span class="badge" style="--soft: var(--surface-2); --hue: var(--fg)"><i></i>Kingdom of Belgium</span>
      <h2>Pick a ${mode === "province" ? "province" : "region"}</h2>
      ${namesHTML({ nl: "België", fr: "Belgique", de: "Belgien" })}</div>
      <dl class="stats">
        <div class="stat"><dt>Capital</dt><dd>Brussels</dd></div>
        <div class="stat"><dt>Population</dt><dd>11.8M</dd></div>
        <div class="stat"><dt>Area</dt><dd>30,689 <small>km²</small></dd></div>
        <div class="stat"><dt>Languages</dt><dd>Dutch, French, German</dd></div>
      </dl>
      <p class="lede">Belgium is a federal state split two ways: into three <b>regions</b> (Flanders, Wallonia, Brussels) that handle territory and the economy, and three language <b>communities</b> (Flemish, French, German-speaking). Flanders and Wallonia are each divided into five provinces.</p>
      ${chipsHTML()}`;
  } else if (mode === "province") {
    const p = PROVINCES[selected], R = REGIONS[p.region];
    html = `
      <div class="panel-top"><div><span class="badge" style="${hueVars(p.region)}"><i></i>${p.region === "brussels" ? "Capital region" : "Province · " + R.name}</span>
      <h2>${p.name}</h2>${namesHTML(p.local)}</div>
      <button class="copy" id="copy">Copy link</button></div>
      <dl class="stats">
        <div class="stat"><dt>Capital</dt><dd>${p.capital}</dd></div>
        <div class="stat"><dt>Largest city</dt><dd>${p.city}</dd></div>
        <div class="stat"><dt>Population</dt><dd>≈ ${fmt(p.pop)}</dd></div>
        <div class="stat"><dt>Area</dt><dd>${num(p.area)} <small>km²</small></dd></div>
        <div class="stat"><dt>Density</dt><dd>${num(Math.round(p.pop / p.area))} <small>/km²</small></dd></div>
        <div class="stat"><dt>Language</dt><dd>${p.lang}</dd></div>
      </dl>
      <p class="lede">${p.lede}</p>
      <div class="sec" style="${hueVars(p.region)}"><h3>Highlights</h3><ul>${p.highlights.map(h => `<li>${h}</li>`).join("")}</ul></div>
      <div class="fact" style="${hueVars(p.region)}"><b>Did you know?</b> ${p.fact}</div>
      ${chipsHTML()}`;
  } else {
    const R = REGIONS[selected];
    html = `
      <div class="panel-top"><div><span class="badge" style="${hueVars(selected)}"><i></i>${R.kind}</span>
      <h2>${R.name}</h2>${namesHTML(R.local)}</div>
      <button class="copy" id="copy">Copy link</button></div>
      <dl class="stats">${R.stats.map(([k, v]) => `<div class="stat"><dt>${k}</dt><dd>${v}</dd></div>`).join("")}</dl>
      <p class="lede">${R.lede}</p>
      <div class="sec" style="${hueVars(selected)}"><h3>Highlights</h3><ul>${R.highlights.map(h => `<li>${h}</li>`).join("")}</ul></div>
      <div class="fact" style="${hueVars(selected)}"><b>${R.fact[0]}</b> ${R.fact[1]}</div>
      ${chipsHTML()}`;
  }
  panel.innerHTML = html;
  panel.classList.remove("swap"); void panel.offsetWidth; panel.classList.add("swap");
  panel.querySelectorAll("[data-go]").forEach(b => b.addEventListener("click", () => setSelected(b.dataset.go === selected ? null : b.dataset.go)));
  const copy = panel.querySelector("#copy");
  if (copy) copy.addEventListener("click", () => {
    const url = location.href.split("#")[0] + "#" + selected;
    const done = () => { copy.textContent = "Copied"; setTimeout(() => copy.textContent = "Copy link", 1400); };
    try { navigator.clipboard.writeText(url).then(done, () => { copy.textContent = url; }); } catch { copy.textContent = url; }
  });
}

function setMode(m, keep) {
  mode = m;
  document.getElementById("mode-prov").setAttribute("aria-pressed", m === "province");
  document.getElementById("mode-reg").setAttribute("aria-pressed", m === "region");
  svg.classList.toggle("regions", m === "region");
  drawLabels(); paint();
  setSelected(keep ?? null);
}
document.getElementById("mode-prov").addEventListener("click", () => setMode("province", selected && mode === "region" ? null : selected));
document.getElementById("mode-reg").addEventListener("click", () => setMode("region", selected && mode === "province" ? regionOf(selected) : selected));

// interaction
svg.addEventListener("click", e => {
  const k = e.target.dataset?.key;
  if (!k) { setSelected(null); return; }
  const t = currentTarget(k);
  setSelected(selected === t ? null : t);
});
svg.addEventListener("keydown", e => {
  const k = e.target.dataset?.key;
  if (k && (e.key === "Enter" || e.key === " ")) { e.preventDefault(); const t = currentTarget(k); setSelected(selected === t ? null : t); }
  if (e.key === "Escape") setSelected(null);
});
svg.addEventListener("pointermove", e => {
  const k = e.target.dataset?.key;
  if (!k || e.pointerType === "touch") { tip.classList.remove("on"); return; }
  const r = stage.getBoundingClientRect();
  const name = mode === "province" ? PROVINCES[k].name : REGIONS[regionOf(k)].name;
  const sub = mode === "province" ? (k === "brussels" ? "Region" : REGIONS[regionOf(k)].name) : "Region";
  tip.innerHTML = `<b>${name}</b><span>${sub}</span>`;
  tip.style.left = (e.clientX - r.left) + "px";
  tip.style.top = (e.clientY - r.top) + "px";
  tip.classList.add("on");
});
svg.addEventListener("pointerleave", () => tip.classList.remove("on"));

function fromHash() {
  const h = location.hash.slice(1);
  if (PROVINCES[h] && !(h === "brussels" && mode === "region")) { if (mode !== "province") setMode("province", h); else setSelected(h, false); }
  else if (REGIONS[h]) { if (mode !== "region") setMode("region", h); else setSelected(h, false); }
}
window.addEventListener("hashchange", fromHash);

drawLabels(); paint();
setSelected(null, false);
fromHash();
</script>
