<meta charset="utf-8">
<title>DLS Manager</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: landscape-first manager shell. Fixed top bar, one screen at a time below it.
   Single deliberate dark look (the game's own world), so no light theme. */
:root {
  color-scheme: dark;
  --bg: #0b0e0d;
  --panel: #151a19;
  --panel-2: #1b2120;
  --line: #29312f;
  --fg: #eef2f1;
  --muted: #95a29f;
  --accent: #4cc86a;
  --accent-dim: #2f7d43;
  --accent-ink: #062c13;
  --win: #4cc86a;
  --draw: #c9a93a;
  --loss: #e0605a;
  --pitch-a: #1d4a2b;
  --pitch-b: #205331;
  --font: "Manrope", system-ui, -apple-system, "Segoe UI", sans-serif;
  --r: 14px;
}
* { box-sizing: border-box; }
html, body { background: var(--bg); color: var(--fg); margin: 0; }
* { -webkit-tap-highlight-color: transparent; }
:focus:not(:focus-visible) { outline: none; }
body {
  font-family: var(--font); font-size: 14px; line-height: 1.4;
  padding-left: max(12px, env(safe-area-inset-left, 0px));
  padding-right: max(12px, env(safe-area-inset-right, 0px));
  padding-block: 10px 24px;
  font-variant-numeric: tabular-nums;
}
/* team intro over the match cutscene (transparent page) */
html.intro, html.intro body { background: transparent !important; }
.pause-wrap { position: fixed; inset: 0; display: grid; place-items: center; background: rgba(6,9,8,.72); animation: fade .25s both; }
.flash-wrap { position: fixed; inset: 0; display: grid; place-items: center; pointer-events: none; animation: flash 1.4s ease-in-out both; }
@keyframes flash { 0% { opacity: 0; transform: scale(.7); } 25% { opacity: 1; transform: scale(1); } 75% { opacity: 1; transform: scale(1.04); } 100% { opacity: 0; transform: scale(1.15); } }
.pause-card { width: min(560px, 92vw); display: grid; gap: 18px; background: var(--panel); border-radius: 18px; padding: 22px; border: 1px solid var(--line); }
.pause-btns { display: grid; gap: 10px; }
#note { position: fixed; top: 10px; right: 12px; z-index: 60; pointer-events: none; opacity: 0; }
#note.on { animation: noteIn .35s cubic-bezier(.2,.9,.3,1.2) both; }
#note.off { animation: noteOut .3s ease-in both; }
@keyframes noteIn { from { opacity: 0; transform: translateX(40px); } to { opacity: 1; transform: none; } }
@keyframes noteOut { from { opacity: 1; transform: none; } to { opacity: 0; transform: translateX(40px); } }
.nt { display: flex; align-items: center; gap: 10px; min-width: 150px; padding: 8px 14px 8px 10px; border-radius: 12px; background: rgba(0,0,0,.62); color: #fff; backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px); }
.nt.nt-big { padding: 10px 16px 10px 12px; }
.nt.nt-big b { font-size: 1.15rem; letter-spacing: .02em; }
.nt-ic { display: inline-grid; place-items: center; width: 26px; height: 26px; font-size: 1.1rem; }
.nt-ic svg { width: 22px; height: 22px; fill: none; stroke: #fff; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.nt-txt { display: grid; gap: 2px; line-height: 1.15; }
.nt-txt b { font-size: .98rem; color: #fff; }
.nt-sub { display: flex; align-items: center; gap: 6px; font-size: .82rem; color: #fff; opacity: .85; letter-spacing: normal; font-weight: 500; }
.nt-card { display: block; width: 14px; height: 19px; border-radius: 2px; }
.nt-card.red { background: #e5383b; } .nt-card.yellow { background: #f5c518; }
.nt-plus { display: grid; place-items: center; width: 20px; height: 20px; border-radius: 4px; background: #e5383b; color: #fff; font-size: 1rem; }
.subs-card { width: min(860px, 96vw); max-height: 94vh; overflow: auto; gap: 12px; padding: 16px; }
.subs-head { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.subs-head h2 { margin: 0; font-size: 1.15rem; flex: 1; }
.subs-left { font-weight: 700; color: var(--accent, #3ddc84); }
.subs-tac { display: flex; gap: 12px; flex-wrap: wrap; }
.subs-tac label { display: grid; gap: 4px; font-size: .8rem; font-weight: 600; color: var(--muted, #9aa); }
.subs-msg { margin: 0; min-height: 1.2em; font-size: .9rem; }
.subs-cols { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.subs-cols > div { display: grid; gap: 4px; align-content: start; }
.sub-row { display: grid; grid-template-columns: 44px 1fr auto; gap: 8px; align-items: center; text-align: left; padding: 8px 10px; border-radius: 10px; border: 1px solid var(--line); background: transparent; color: inherit; font: inherit; min-height: 44px; }
.sub-row .nm { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.sub-row.sel { border-color: var(--accent, #3ddc84); background: rgba(61,220,132,.15); }
.sub-row.off { opacity: .45; }
@media (max-height: 520px) { .sub-row { min-height: 36px; padding: 5px 8px; } .subs-card { padding: 12px; gap: 8px; } }
.pause-btns .btn { justify-content: center; padding: 14px; font-size: 1rem; }
#hud { display: none; position: fixed; top: 8px; left: 62px; z-index: 50; pointer-events: none; }
.sb { display: flex; align-items: stretch; height: 34px; border-radius: 10px; overflow: hidden; background: rgba(11,14,13,.86); border: 1px solid rgba(255,255,255,.14); font-weight: 800; color: #fff; box-shadow: 0 2px 10px rgba(0,0,0,.35); }
.sb-t { display: flex; align-items: center; gap: 6px; padding: 0 9px; font-size: .85rem; letter-spacing: .04em; }
.sb-s { display: flex; align-items: center; padding: 0 12px; background: var(--accent); color: #071a0d; font-size: 1rem; font-variant-numeric: tabular-nums; }
.sb-c { display: flex; align-items: center; padding: 0 10px; border-left: 1px solid rgba(255,255,255,.14); font-variant-numeric: tabular-nums; font-size: .9rem; }
.sb { position: relative; }
.sb-add { display: flex; align-items: center; justify-content: center; width: 0; overflow: hidden; background: #2fbf5a; color: #062a12; font-weight: 900; font-size: .85rem; transition: width .45s cubic-bezier(.2,.8,.2,1), padding .45s; }
.sb-add.on { width: 38px; }
.lu-wrap { position: fixed; inset: 0; display: grid; grid-template-columns: 1fr 1fr; gap: 4vw; align-items: center; padding: 4vh 6vw; pointer-events: none; }
.lu-side { display: grid; gap: 8px; background: rgba(8,12,10,.78); border-radius: 14px; padding: 10px; }
.intro-wrap { position: fixed; inset: 0; display: grid; align-content: end; padding: 0 0 7vh; pointer-events: none; }
.intro-bar { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 14px; margin: 0 auto; width: min(760px, 94vw);
  background: linear-gradient(90deg, rgba(8,12,10,.0), rgba(8,12,10,.82) 18%, rgba(8,12,10,.82) 82%, rgba(8,12,10,0)); padding: 14px 18px; border-radius: 14px; }
.intro-team { display: flex; align-items: center; gap: 10px; font-weight: 800; font-size: 1.15rem; color: #fff; }
.intro-bar { animation: wipe .55s cubic-bezier(.7,0,.2,1) both; }
.intro-team.h { justify-content: flex-end; animation: inL .7s .35s cubic-bezier(.2,.8,.2,1) both; }
.intro-team.a { animation: inR .7s .35s cubic-bezier(.2,.8,.2,1) both; }
.intro-vs { font-weight: 900; font-size: 1.4rem; color: var(--accent); animation: pop .5s .8s cubic-bezier(.3,1.6,.5,1) both; }
.intro-sub { text-align: center; color: #d8e2dc; font-weight: 600; margin-top: 8px; animation: up .6s 1.1s ease-out both; text-shadow: 0 1px 4px #000; }
@keyframes wipe { from { clip-path: inset(0 50% 0 50% round 14px); opacity: .4; } to { clip-path: inset(0 0 0 0 round 14px); opacity: 1; } }
@keyframes up { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }
@keyframes outDown { to { opacity: 0; transform: translateY(40px); } }
.intro-wrap.out, .lu-wrap.out { animation: outDown .5s ease-in both; }
.lu-wrap .lu-side:first-child { animation: inL .7s cubic-bezier(.2,.8,.2,1) both; }
.lu-wrap .lu-side:last-child { animation: inR .7s .15s cubic-bezier(.2,.8,.2,1) both; }
@keyframes inL { from { opacity: 0; transform: translateX(-60px); } to { opacity: 1; transform: none; } }
@keyframes inR { from { opacity: 0; transform: translateX(60px); } to { opacity: 1; transform: none; } }
@keyframes pop { from { opacity: 0; transform: scale(.4); } to { opacity: 1; transform: none; } }
@keyframes fade { from { opacity: 0; } to { opacity: 1; } }
button { font: inherit; color: inherit; }
.app { max-width: 1120px; margin: 0 auto; display: grid; grid-template-columns: minmax(0, 1fr); gap: 12px; }
.screen { display: grid; grid-template-columns: minmax(0, 1fr); gap: 12px; }
.hidden { display: none !important; }
.muted { color: var(--muted); }
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); }
.btn {
  appearance: none; border: 1px solid var(--line); background: var(--panel-2); border-radius: 12px;
  padding: 10px 16px; font-weight: 700; cursor: pointer; display: inline-flex; align-items: center; gap: 8px;
}
.btn:hover { border-color: var(--accent-dim); }
.btn:focus-visible, .tile:focus-visible, .row:focus-visible, .chip-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.primary:hover { filter: brightness(1.08); }
.btn[disabled] { opacity: .45; cursor: not-allowed; }
.btn.ghost { background: transparent; }
.btn svg { width: 18px; height: 18px; stroke: currentColor; fill: none; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
.chip-btn {
  appearance: none; border: 1px solid var(--line); background: var(--panel); border-radius: 999px;
  padding: 6px 12px; font-weight: 600; cursor: pointer; white-space: nowrap;
}
.chip-btn[aria-pressed="true"] { border-color: var(--accent); color: var(--accent); background: #13241a; }
h1, h2, h3 { margin: 0; letter-spacing: -0.01em; text-wrap: balance; }
h2 { font-size: 1.15rem; }
h3 { font-size: .95rem; }
.label { font-size: .72rem; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }

/* top bar */
.topbar { display: flex; align-items: center; gap: 12px; padding: 8px 12px; min-width: 0; }
.icon-btn { appearance: none; border: 0; background: transparent; cursor: pointer; padding: 6px; border-radius: 10px; display: grid; place-items: center; }
.icon-btn:hover { background: var(--panel-2); }
.icon-btn svg { width: 22px; height: 22px; stroke: var(--fg); fill: none; stroke-width: 2; stroke-linecap: round; }
.club-id { display: flex; align-items: center; gap: 10px; min-width: 0; flex: 1 1 auto; }
.club-id > div { min-width: 0; }
.club-id .lg { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.club-id .nm { font-weight: 800; font-size: 1.05rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.club-id .lg { color: var(--muted); font-size: .8rem; }
.grow { flex: 0 1 0; }
.chips { flex: none; }
.chips { display: flex; align-items: center; gap: 14px; font-weight: 700; font-size: .9rem; white-space: nowrap; }
.coin { width: 14px; height: 14px; border-radius: 50%; background: radial-gradient(circle at 35% 35%, #f5d77a, #c9952a); display: inline-block; vertical-align: -2px; margin-right: 5px; }
.week-tag { color: var(--muted); font-weight: 600; }
.clock { font-weight: 600; color: var(--muted); font-variant-numeric: tabular-nums; }
.clock b { color: var(--fg); }
.cont { padding: 8px 14px; }
.inbox-btn { position: relative; }
.inbox-btn svg { fill: none; stroke: currentColor; stroke-width: 2; stroke-linejoin: round; }
.badge-n { position: absolute; top: -2px; right: -4px; min-width: 18px; height: 18px; padding: 0 5px; border-radius: 9px; background: var(--loss); color: #fff; font-size: .7rem; font-weight: 800; display: grid; place-items: center; }
/* inbox */
.inbox { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.6fr); gap: 12px; align-items: start; }
.msg-list { display: grid; max-height: 70vh; overflow-y: auto; padding: 4px; }
.msg-item { appearance: none; border: 0; background: transparent; color: inherit; font: inherit; text-align: left; display: grid; grid-template-columns: 4px 1fr auto; grid-template-areas: "c f d" "c s s"; column-gap: 10px; row-gap: 2px; padding: 10px; border-radius: 10px; cursor: pointer; }
.msg-item i { grid-area: c; border-radius: 2px; }
.msg-item .mi-from { grid-area: f; font-size: .75rem; color: var(--muted); font-weight: 700; }
.msg-item .mi-date { grid-area: d; font-size: .72rem; color: var(--muted); }
.msg-item .mi-sub { grid-area: s; font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.msg-item.unread .mi-sub { font-weight: 800; }
.msg-item.unread .mi-from::before { content: ""; display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--accent); margin-right: 6px; vertical-align: 1px; }
.msg-item.sel, .msg-item:hover { background: var(--panel-2); }
.msg-detail { padding: 18px; display: grid; gap: 10px; align-content: start; min-height: 200px; }
.msg-detail.empty { place-items: center; }
.md-back { display: none; justify-self: start; }
.msg-detail h3 { margin: 4px 0 0; font-size: 1.2rem; }
.msg-detail p { margin: 0; line-height: 1.5; max-width: 65ch; }
/* training */
.tr-setup { padding: 14px; display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
.grow-bar { width: 80px; height: 6px; border-radius: 3px; background: var(--panel-2); overflow: hidden; }
.grow-bar i { display: block; height: 100%; background: var(--accent); }
.ovr.pot { background: transparent; border: 2px solid var(--accent); color: var(--fg); }
button.link { appearance: none; background: none; border: 0; padding: 0; font: inherit; font-weight: 700; color: inherit; cursor: pointer; text-align: left; }
@media (max-width: 700px) { .tr-setup { grid-template-columns: 1fr; } }
/* social */
.feed { display: grid; gap: 10px; max-width: 720px; }
.sc-post { display: grid; grid-template-columns: 40px 1fr; gap: 10px; padding: 12px 14px; }
.sc-post.new { border-left: 3px solid #4f8ff7; }
.sc-av { width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; overflow: hidden; background: var(--panel-2); }
.sc-av.ini { font-weight: 800; font-size: .8rem; }
.sc-body { min-width: 0; display: grid; gap: 4px; }
.sc-head { display: flex; align-items: baseline; gap: 6px; flex-wrap: wrap; }
.sc-tick { display: inline-grid; place-items: center; width: 15px; height: 15px; border-radius: 50%; background: #4f8ff7; color: #fff; font-size: .62rem; font-weight: 900; }
.sc-h { color: var(--muted); font-size: .8rem; }
.sc-text { line-height: 1.45; }
.sc-meta { display: flex; gap: 18px; color: var(--muted); font-size: .8rem; }
.mood-row { display: flex; justify-content: center; gap: 14px; font-size: .82rem; color: var(--muted); }
.mood-row b { color: var(--fg); }
/* press conference */
.press { display: grid; grid-template-columns: 230px minmax(0, 1fr); gap: 12px; }
.press-side { padding: 16px; display: grid; gap: 8px; align-content: start; justify-items: center; text-align: center; }
.ps-kind { justify-self: stretch; text-align: left; font-size: .72rem; font-weight: 800; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); padding-bottom: 10px; border-bottom: 1px solid var(--line); }
.ps-badge { padding: 10px 0 4px; }
.ps-name { font-weight: 800; font-size: 1.15rem; }
.ps-edit { padding: 6px 12px; font-size: .8rem; }
.ps-match { justify-self: stretch; display: flex; gap: 10px; align-items: center; text-align: left; border-top: 1px solid var(--line); padding-top: 12px; margin-top: 4px; font-size: .9rem; }
.ps-match .muted { font-size: .75rem; }
.press-main { display: grid; gap: 0; min-width: 0; border-radius: var(--r); overflow: hidden; border: 1px solid var(--line); background: var(--panel); }
.stage { position: relative; height: clamp(170px, 38vh, 330px); overflow: hidden; background: #0d1211; }
.stage.small { height: 260px; border-radius: 12px; }
.backdrop { position: absolute; inset: -10px; display: grid; grid-template-columns: repeat(9, 1fr); align-items: center; justify-items: center; gap: 6px 0; filter: grayscale(1) brightness(1.4); opacity: .16; }
.backdrop svg, .backdrop img { display: block; }
.spot { position: absolute; inset: 0; background: radial-gradient(60% 75% at 50% 35%, rgba(76,200,106,.16), transparent 60%), linear-gradient(180deg, transparent 50%, rgba(0,0,0,.55)); }
.mgr-wrap { position: absolute; left: 50%; bottom: 14%; height: 80%; aspect-ratio: 1; transform: translateX(-50%); }
.mgr-svg { display: block; width: 100%; height: 100%; overflow: visible; }
.desk { position: absolute; left: 0; right: 0; bottom: 0; height: 20%; background: linear-gradient(180deg, #121816, #090c0b); border-top: 3px solid #2a3331; }
.desk-props { position: absolute; left: 50%; bottom: 20%; transform: translateX(-50%); height: 17%; width: auto; overflow: visible; }
.mgr-torso { animation: mgrBreathe 4.2s ease-in-out infinite; transform-origin: 120px 240px; }
.mgr-head { animation: mgrIdle 7s ease-in-out infinite; transform-origin: 120px 140px; }
.mgr-eyes { animation: mgrBlink 5.5s infinite; transform-origin: 120px 93px; }
.mgr-mouth-open { opacity: 0; transform-origin: 120px 123px; }
.talking .mgr-mouth { opacity: 0; }
.talking .mgr-mouth-open { opacity: 1; animation: mgrTalk .18s ease-in-out infinite alternate; }
.talking .mgr-head { animation: mgrNod 1.3s ease-in-out infinite; }
@keyframes mgrBreathe { 50% { transform: translateY(2px) scaleY(.99); } }
@keyframes mgrIdle { 0%, 100% { transform: rotate(0); } 30% { transform: rotate(-2deg); } 65% { transform: rotate(1.5deg) translateY(1px); } }
@keyframes mgrBlink { 0%, 95%, 100% { transform: scaleY(1); } 97% { transform: scaleY(.1); } }
@keyframes mgrTalk { from { transform: scaleY(.35); } to { transform: scaleY(1.1); } }
@keyframes mgrNod { 0%, 100% { transform: rotate(0); } 25% { transform: rotate(-3deg) translateY(1px); } 60% { transform: rotate(2deg); } }
@keyframes mgrGesture { 0%, 100% { transform: rotate(0); } 50% { transform: rotate(-9deg) translateY(-4px); } }
@media (prefers-reduced-motion: reduce) { .mgr-torso, .mgr-head, .mgr-eyes, .talking .mgr-mouth-open, .talking .mgr-head { animation: none; } }
.caption { position: absolute; left: 50%; bottom: 4%; z-index: 2; transform: translateX(-50%); max-width: 80%; padding: 8px 14px; border-radius: 10px; background: rgba(0,0,0,.7); font-weight: 600; text-align: center; animation: capIn .25s both; }
@keyframes capIn { from { opacity: 0; } to { opacity: 1; } }
.qbox { display: grid; grid-template-columns: 44px 1fr auto; gap: 12px; align-items: center; padding: 12px 14px; border-top: 1px solid var(--line); }
.q-mic { width: 44px; height: 44px; border-radius: 10px; border: 1px solid var(--line); display: grid; place-items: center; background: var(--panel-2); }
.q-mic svg { width: 22px; height: 22px; fill: none; stroke: var(--accent); stroke-width: 2; stroke-linecap: round; }
.q-who { font-size: .72rem; font-weight: 800; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
.qbox p { margin: 3px 0 0; font-size: 1.05rem; font-weight: 600; line-height: 1.35; }
.q-n { color: var(--muted); font-weight: 700; font-size: .85rem; }
.resp { grid-column: 1 / -1; padding: 12px 14px; display: grid; gap: 10px; }
.resp-h { font-size: .74rem; font-weight: 800; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
.resp-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px 14px; }
.resp-btn { appearance: none; font: inherit; color: var(--fg); text-align: left; display: flex; align-items: center; gap: 10px; justify-content: space-between; padding: 10px 14px; min-height: 44px; border-radius: 10px; border: 1px solid var(--line); background: var(--panel-2); cursor: pointer; }
.resp-btn:hover:not(:disabled) { border-color: var(--accent); background: rgba(76,200,106,.08); }
.resp-btn:disabled { opacity: .5; }
.resp-tone { flex: none; font-size: .66rem; font-weight: 800; letter-spacing: .06em; text-transform: uppercase; color: var(--accent); }
.resp-sum { display: flex; gap: 20px; flex-wrap: wrap; font-weight: 600; }
/* manager look */
.mg { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.1fr); gap: 12px; align-items: start; }
.mg-prev { padding: 12px; display: grid; gap: 10px; }
.mg-form { padding: 14px; display: grid; gap: 12px; }
.mg-group { display: grid; gap: 6px; }
.mg-form input { font: inherit; color: var(--fg); background: var(--panel-2); border: 1px solid var(--line); border-radius: 9px; padding: 9px 12px; min-height: 40px; }
.mg-form input:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
.mg-opts { display: flex; flex-wrap: wrap; gap: 6px; }
.mg-opt { appearance: none; font: inherit; font-size: .85rem; font-weight: 600; color: var(--fg); padding: 7px 12px; min-height: 36px; border-radius: 9px; border: 1px solid var(--line); background: var(--panel-2); cursor: pointer; }
.mg-opt.sw { width: 36px; padding: 0; border-radius: 50%; }
.mg-opt[aria-pressed="true"] { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent); }
@media (max-width: 760px), (max-height: 500px) {
  .press { grid-template-columns: 1fr; }
  .press-side { display: none; }
  .stage { height: 44vh; min-height: 150px; }
  .mg { grid-template-columns: 1fr; }
}
@media (max-width: 560px) { .resp-grid { grid-template-columns: 1fr; } }
/* calendar */
.cal-nav { display: flex; align-items: center; gap: 8px; }

<div class="app" id="app">

<script>
(function () {
  "use strict";
  var SAVE_KEY = "dlsmgr-save-v1";
  var D = null;                 // game data (data.json)
  var S = null;                 // save state
  var ui = { screen: "home", tableLeague: null, statsLeague: null, fixturesWeek: null, report: null, player: null, sel: null, filter: { q: "", pos: "", league: "" }, pick: null };
  var byId = {}, clubPlayers = {};
  var app = document.getElementById("app");

  // ------------------------------------------------------------ helpers
  function el(html) { var t = document.createElement("template"); t.innerHTML = html.trim(); return t.content; }
  function esc(s) { return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); }
  function club(id) { return D.clubs[id]; }
  // league logo (leagues/<id>.png); leagues without one show nothing
  var LEAGUE_LOGOS = { slovenia_2snl: 1 };
  function leagueLogo(lid, h) { return LEAGUE_LOGOS[lid] ? '<img class="lg-logo" src="leagues/' + lid + '.png" alt="" style="height:' + h + 'px">' : ""; }
  function leagueOf(cid) { return D.leagues.find(function (l) { return l.id === club(cid).league; }); }
  function money(v) { if (!v) return "–"; return v >= 1e6 ? "€" + (v / 1e6).toFixed(v >= 1e7 ? 0 : 1) + "M" : "€" + Math.round(v / 1e3) + "K"; }
  function ordinal(n) { var s = ["th", "st", "nd", "rd"], v = n % 100; return n + "<sup>" + (s[(v - 20) % 10] || s[v] || s[0]) + "</sup>"; }
  function ovrColor(o) { var t = Math.max(0, Math.min(1, (o - 45) / 45)); return "hsl(" + (10 + t * 120) + ",62%," + (48 + t * 6) + "%)"; }

  function badge(cid, size) {
    var c = club(cid), p = c.colors.primary, s = c.colors.secondary, z = size || 34;
    if (c.badge) return '<img src="' + esc(c.badge) + '" width="' + z + '" height="' + z + '" alt="" style="object-fit:contain;flex:none" loading="lazy">';
    var light = /^#(F|E|D)[0-9A-F]{5}$/i.test(p);

      '<path d="M17 1 32 6v12c0 9-6.5 15.5-15 19C8.5 33.5 2 27 2 18V6Z" fill="' + esc(p) + '" stroke="' + esc(s) + '" stroke-width="2.2"/>' +
      '<path d="M17 4v31" stroke="' + esc(s) + '" stroke-width="3" opacity=".55"/>' +
      '<text x="17" y="22" text-anchor="middle" font-family="Manrope,system-ui,sans-serif" font-weight="800" font-size="8.5" fill="' + (light ? "#111" : "#fff") + '" stroke="' + (light ? "#fff" : "#000") + '" stroke-width=".5" paint-order="stroke">' + esc(c.short) + "</text></svg>";
  }

  // ------------------------------------------------------------ formations
  var FORMATIONS = {
    "4-3-3":   [["GK",50,92],["LB",14,72],["CB",37,76],["CB",63,76],["RB",86,72],["CM",28,50],["DM",50,58],["CM",72,50],["LW",18,24],["ST",50,16],["RW",82,24]],
    "4-2-3-1": [["GK",50,92],["LB",14,72],["CB",37,76],["CB",63,76],["RB",86,72],["DM",36,56],["DM",64,56],["LW",16,34],["AM",50,36],["RW",84,34],["ST",50,14]],
    "4-4-2":   [["GK",50,92],["LB",14,72],["CB",37,76],["CB",63,76],["RB",86,72],["LM",14,44],["CM",38,50],["CM",62,50],["RM",86,44],["ST",38,16],["ST",62,16]],
    "3-5-2":   [["GK",50,92],["CB",28,76],["CB",50,78],["CB",72,76],["LM",10,46],["DM",50,58],["CM",32,44],["CM",68,44],["RM",90,46],["ST",38,16],["ST",62,16]],
    "5-3-2":   [["GK",50,92],["LB",8,64],["CB",28,76],["CB",50,78],["CB",72,76],["RB",92,64],["CM",28,46],["DM",50,54],["CM",72,46],["ST",38,16],["ST",62,16]]
  };
  // how well a player's position fits a slot (0 = natural, negative = penalty)
  var NEAR = {
    GK: {}, CB: { RB: -4, LB: -4, DM: -5 }, LB: { LM: -3, CB: -5, RB: -6, LW: -8 }, RB: { RM: -3, CB: -5, LB: -6, RW: -8 },
    DM: { CM: -2, CB: -5, AM: -8 }, CM: { DM: -2, AM: -3, LM: -5, RM: -5 }, AM: { CM: -3, SS: -2, LW: -5, RW: -5, ST: -6 },
    LM: { LW: -2, LB: -5, CM: -5 }, RM: { RW: -2, RB: -5, CM: -5 }, LW: { LM: -2, RW: -4, AM: -5, ST: -6 },
    RW: { RM: -2, LW: -4, AM: -5, ST: -6 }, ST: { SS: -1, AM: -6, LW: -7, RW: -7 }

  // how well a player suits a slot: 0 in his position or one of his FC alternatives (p.alt)
  function fit(playerPos, slot, alt) {
    if (playerPos === slot || (alt && alt.indexOf(slot) >= 0)) return 0;
    if (playerPos === "SS" && slot === "ST") return -1;

  function autoXI(cid, formation) {
    var slots = FORMATIONS[formation], pool = clubPlayers[cid].slice(), xi = new Array(slots.length);
    var order = slots.map(function (s, i) { return i; }).sort(function (a, b) { return (slots[a][0] === "GK" ? -1 : 0) - (slots[b][0] === "GK" ? -1 : 0); });

      var best = null, score = -1e9;
      pool.forEach(function (p) { var v = p.ovr + fit(p.pos, slots[i][0], p.alt); if (v > score) { score = v; best = p; } });

  }
  function lineupOf(cid) {

    if (!L) { L = { formation: "4-3-3", xi: autoXI(cid, "4-3-3") }; if (cid === S.clubId) S.lineups[cid] = L; }
    return L;
  }

  // ------------------------------------------------------------ season setup
  function roundRobin(ids) {
    var n = ids.length, arr = ids.slice(), rounds = [];
    for (var r = 0; r < n - 1; r++) {
      var games = [];

        var h = arr[i], a = arr[n - 1 - i];

      arr.splice(1, 0, arr.pop());
    }
    return rounds;
  }
  function newSeason(clubId, seed) {
    var st = { v: 1, clubId: clubId, week: 0, seed: seed, schedule: {}, results: {}, lineups: {}, pstats: {}, news: [] };
    var r = rng(seed);
    D.leagues.forEach(function (lg) {
      var ids = lg.clubs.slice().sort(function () { return r() - 0.5; });
      var base = roundRobin(ids), rounds = [];

      st.results[lg.id] = [];

  }
  function save() {
    var j = JSON.stringify(S);
    try { localStorage.setItem(SAVE_KEY, j); } catch (e) {}
    try { if (window.DLSManager && window.DLSManager.saveState) window.DLSManager.saveState(j); } catch (e) {}
  }
  function load() {
    var raw = null;
    try { raw = localStorage.getItem(SAVE_KEY); } catch (e) {}
    try { if (!raw && window.DLSManager && window.DLSManager.loadState) raw = window.DLSManager.loadState() || null; } catch (e) {}
    try { var s = JSON.parse(raw || "null"); return s && s.v === 1 ? s : null; } catch (e) { return null; }
  }
  function myLeague() { return leagueOf(S.clubId); }
  function seasonOver() { return S.week >= S.schedule[myLeague().id].length; }
  function nextFixture() {
    if (seasonOver()) return null;
    var g = S.schedule[myLeague().id][S.week].find(function (m) { return m[0] === S.clubId || m[1] === S.clubId; });
    return g ? { home: g[0], away: g[1], week: S.week } : null;
  }

  // ------------------------------------------------------------ pre-match

      title = NOTE_TXT[kind];
      if (!title || !fx) return;
      var opp = fx.home === S.clubId ? fx.away : fx.home, cid = a === b ? S.clubId : opp;
      var p = clubPlayers[cid] ? clubPlayers[cid].find(function (q) { return q.dls === id; }) : null;
      // goals (and own goals / hat-tricks) name the scorer by surname only
      var who = p ? (kind >= 3 ? p.name.split(" ").slice(-1)[0] : p.name) : club(cid).name;
      sub = '<span class="nt-sub">' + badge(cid, 18) + esc(who) + "</span>";
      ic = kind === 0 ? '<i class="nt-card red"></i>' : kind === 1 ? '<i class="nt-card yellow"></i>' : kind === 2 ? '<b class="nt-plus">+</b>' : "⚽";
      if (kind === 3 || kind === 5) { ms = 3400; cls = " nt-big"; }
    }
    var el = document.getElementById("note");
    if (!el) { el = document.createElement("div"); el.id = "note"; el.setAttribute("role", "status"); document.body.appendChild(el); }
    el.className = "";
    el.innerHTML = '<div class="nt' + cls + '"><span class="nt-ic">' + ic + '</span><span class="nt-txt"><b>' + esc(title) + "</b>" + sub + "</span></div>";
    void el.offsetWidth;
    el.className = "on";
    clearTimeout(noteTimer);
    noteTimer = setTimeout(function () { el.className = "off"; }, ms);
  };
  window.dlsHudOff = function () {
    window.inMatch = false;
    var h = document.getElementById("hud");
    if (h) h.style.display = "none";
    document.documentElement.classList.remove("intro");
  };
  window.dlsIntroEnd = function () {
    if (window.inMatch) { app.innerHTML = ""; return; }
    document.documentElement.classList.remove("intro");
    render();
  };

  window.dlsKickoffFailed = function () {
    if (ui.screen !== "kickoff") return;
    S.pending = null; save();
    ui.screen = "prematch"; render();
    modal('<h2>The match didn\'t start</h2><p class="muted" style="margin:0">Please use Export save in the menu and send it over, so the log shows where kick-off stopped.</p><button class="btn primary" data-act="closemodal">OK</button>');
  };

  // ------------------------------------------------------------ events
  document.addEventListener("click", function (ev) {
    var t = ev.target.closest("[data-tfocus],[data-tint],[data-msg],[data-mact],[data-calm],[data-soc],[data-pans],[data-mgr],[data-go],[data-act],[data-player],[data-slot],[data-bench],[data-table],[data-stats],[data-report],[data-pick],[data-pickleague],[data-back-player]");
    if (!t) return;
    if (t.hasAttribute("data-pickleague")) { ui.pickLeague = t.getAttribute("data-pickleague"); ui.pick = D.leagues.find(function (l) { return l.id === ui.pickLeague; }).clubs[0]; return renderNewGame(); }
    if (t.hasAttribute("data-pick")) { ui.pick = t.getAttribute("data-pick"); return updateNewGamePick(); }
    if (t.hasAttribute("data-msg")) {
      var mm = S.inbox.find(function (m) { return m.id === +t.getAttribute("data-msg"); });
      if (mm) { mm.read = true; ui.msg = mm.id; save(); }
      ui.screen = "inbox"; return render();
    }
    if (t.hasAttribute("data-mact")) {
      var ma = (S.inbox.find(function (m) { return m.id === +t.getAttribute("data-mact"); }) || {}).action;
      if (!ma) return;
      if (ma.go) { ui.screen = ma.go; return render(); }
      if (ma.player != null) { ui.prev = "inbox"; ui.player = ma.player; ui.screen = "player"; return render(); }
      if (ma.report) { var rk = ma.report.split(":"), rr = (S.results[rk[0]][+rk[1]] || []).find(function (x) { return x.h === rk[2]; }); if (rr) { ui.report = rr; ui.screen = "report"; } return render(); }
      if (ma.press) {
        if (!S.press || S.press.id !== ma.press || S.press.done) return modal('<h2>Press conference</h2><p class="muted" style="margin:0">' + (S.press && S.press.id === ma.press && S.press.done === "attended" ? "You've already spoken to the press." : "That press conference has passed; your assistant took it.") + '</p><button class="btn primary" data-act="closemodal">OK</button>');
        ui.pressState = { id: S.press.id, qs: pressQuestions(S.press), i: 0, ans: [] }; ui.screen = "press"; return render();
      }
      if (ma.act === "play") { if (matchDayToday()) { ui.screen = "prematch"; return render(); } return; }
      return;
    }
    if (t.hasAttribute("data-tfocus")) { (S.training = S.training || { focus: "balanced", intensity: 1 }).focus = t.getAttribute("data-tfocus"); save(); return render(); }
    if (t.hasAttribute("data-tint")) { (S.training = S.training || { focus: "balanced", intensity: 1 }).intensity = +t.getAttribute("data-tint"); save(); return render(); }
    if (t.hasAttribute("data-soc")) { ui.socFilter = t.getAttribute("data-soc"); return render(); }
    if (t.hasAttribute("data-pans")) {
      var ps = ui.pressState, qq = ps && ps.qs[ps.i];
      if (!qq || ps.talk != null) return;
      var ans = qq.a[+t.getAttribute("data-pans")];
      ps.ans.push(ans); ps.talk = ans.text;
      render();
      setTimeout(function () {   // the manager answers, then the next question
        ps.talk = null; ps.i++;
        if (ps.i >= ps.qs.length) pressFinish(S.press, ps.ans);
        if (ui.screen === "press") render();
      }, Math.min(3200, 900 + ans.text.length * 32));
      return;
    }
    if (t.hasAttribute("data-mgr")) {
      var kv = t.getAttribute("data-mgr").split(":"), mm = mgr();
      mm[kv[0]] = typeof mm[kv[0]] === "number" ? +kv[1] : kv[1];
      save(); ui.mgrTalk = true; render();
      clearTimeout(ui.mgrT); ui.mgrT = setTimeout(function () { ui.mgrTalk = false; if (ui.screen === "manager") render(); }, 900);
      return;
    }
    if (t.hasAttribute("data-calm")) { ui.calMonth = Math.max(0, Math.min(11, ui.calMonth + +t.getAttribute("data-calm"))); return render(); }
    var go = t.getAttribute("data-go"), act = t.getAttribute("data-act");
    if (go === "inbox" && ui.screen !== "inbox") ui.msg = null;
    if (go === "calendar") ui.calMonth = null;
    if (go) { closeDrawer(); ui.screen = go; ui.sel = null; return render(); }
    if (t.hasAttribute("data-back-player")) { ui.screen = ui.prev || "squad"; return render(); }
    if (t.hasAttribute("data-player")) { ui.prev = ui.screen === "player" ? ui.prev : ui.screen; ui.player = +t.getAttribute("data-player"); ui.screen = "player"; return render(); }
    if (t.hasAttribute("data-table")) { ui.tableLeague = t.getAttribute("data-table"); return render(); }
    if (t.hasAttribute("data-stats")) { ui.statsLeague = t.getAttribute("data-stats"); return render(); }
    if (t.hasAttribute("data-report")) {
      var k = t.getAttribute("data-report").split(":");
      ui.report = S.results[k[0]][+k[1]].find(function (x) { return x.h === k[2]; }); ui.screen = "report"; return render();
    }
    if (t.hasAttribute("data-slot") || t.hasAttribute("data-bench")) return tacticsTap(t);
    if (act === "drawer") return openDrawer();
    if (act === "continue") return advance();
    if (act === "msgback") { ui.msg = null; return render(); }
    if (act === "readall") { S.inbox.forEach(function (m) { m.read = true; }); save(); return render(); }
    if (act === "closedrawer") return closeDrawer();
    if (act === "exportsave") { closeDrawer(); if (window.DLSManager && window.DLSManager.exportSave) window.DLSManager.exportSave(); return; }
    if (act === "sim") {
      if (!matchDayToday()) return;
      var mine = playWeek();
      if (mine) { ui.report = mine; ui.screen = "report"; } else ui.screen = "home";
      return render();
    }
    if (act === "play") {
      if (!matchDayToday()) return;
      ui.screen = "prematch"; return render();
    }
    if (act === "kickoff") {
      var fx = nextFixture();
      if (!fx) return;
      var userHome = fx.home === S.clubId, opp = userHome ? fx.away : fx.home;
      if (window.DLSManager && window.DLSManager.kickOff) {
        S.pending = { week: fx.week, home: fx.home, away: fx.away, userHome: userHome, oppTid: window.DLSManager.clubTid(opp),
                      before: window.DLSManager.lastMatch() };
        save();
        var sheets = { home: dlsSheet(fx.home), away: dlsSheet(fx.away), difficulty: DIFFS[S.difficulty || "hard"] };
        ui.screen = "kickoff"; render();  // stays up while the game loads the match underneath
        setTimeout(function () {
          var err = window.DLSManager.kickOff(opp, userHome, JSON.stringify(sheets));
          if (err) { ui.screen = "prematch"; render(); modal('<h2>Could not start the match</h2><p class="muted" style="margin:0">' + esc(err) + '</p><button class="btn primary" data-act="closemodal">OK</button>'); }
        }, 60);
        return;
      }
      return modal('<h2>Kick-off</h2><p class="muted" style="margin:0">Inside the game this starts the real DLS19 match with these two line-ups. In the web preview use Quick Sim.</p><button class="btn primary" data-act="closemodal">OK</button>');
    }
    if (act === "closemodal") return closeModal();
    if (act === "loadcareer") {
      ui.title = false; ui.screen = "home";
      // keep the game's team in step with the career (e.g. after a recovery reset it)
      if (window.DLSManager && window.DLSManager.currentClub && window.DLSManager.currentClub() !== S.clubId) window.DLSManager.becomeClub(S.clubId);
      return render();
    }
    if (act === "newcareer") {
      if (S && !t.hasAttribute("data-sure")) {
        return modal('<h2>Start a new career?</h2><p class="muted" style="margin:0">Your current career with ' + esc(club(S.clubId).name) + ' is replaced when you start the new one.</p>' +
          '<div style="display:flex;gap:8px"><button class="btn primary" data-act="newcareer" data-sure="1">Choose a club</button><button class="btn ghost" data-act="closemodal">Cancel</button></div>');
      }
      closeModal(); ui.title = false; S = null; return render();
    }
    if (act === "totitle") { S = load(); if (S && !D.clubs[S.clubId]) S = null; applyDev(); ui.title = true; return render(); }
    if (act === "saveresult") {
      closeModal();
      var mineR = playWeek({ hg: +t.getAttribute("data-hg"), ag: +t.getAttribute("data-ag") });
      S.pending = null; save();
      if (window.DLSManager && window.DLSManager.clearFixture) window.DLSManager.clearFixture();
      if (mineR) { ui.report = mineR; ui.screen = "report"; } else ui.screen = "home";
      return render();
    }
    if (act === "autopick") { var L = lineupOf(S.clubId); L.xi = autoXI(S.clubId, L.formation); ui.sel = null; save(); return render(); }
    if (act === "settings") {
      closeDrawer();
      var cur = S.difficulty || "hard";
      return modal('<h2>Settings</h2><label class="label" for="diffsel">Match difficulty</label><select id="diffsel">' +
        [["easy", "Easy"], ["normal", "Normal"], ["hard", "Hard"], ["veryhard", "Very hard"], ["elite", "Elite (DLS's hardest)"]].map(function (d) { return '<option value="' + d[0] + '"' + (d[0] === cur ? " selected" : "") + ">" + d[1] + "</option>"; }).join("") +
        '</select><p class="muted" style="margin:0">Assists are off in matches. Your career is saved on this device automatically.</p><button class="btn" data-act="askreset">Start a new career…</button><button class="btn ghost" data-act="closemodal">Close</button>');
    }
    if (act === "askreset") { closeModal(); return modal('<h2>Start a new career?</h2><p class="muted" style="margin:0">This deletes the current season, results and stats.</p><div style="display:flex;gap:8px"><button class="btn primary" data-act="reset">Delete and start over</button><button class="btn ghost" data-act="closemodal">Keep playing</button></div>'); }
    if (act === "reset") { closeModal(); S = null; try { localStorage.removeItem(SAVE_KEY); } catch (e) {} ui.screen = "home"; return render(); }
    if (act === "start") {
      S = newSeason(ui.pick || "fuzinar", (Date.now() % 2147483647) >>> 0); applyDev(); lineupOf(S.clubId); save(); ui.screen = "home"; ui.title = false;
      // inside the game: make the Dream FC this club (the game restarts to apply it)
      if (window.DLSManager && window.DLSManager.becomeClub && window.DLSManager.currentClub() !== S.clubId) {
        window.DLSManager.becomeClub(S.clubId);
      }
      return render();
    }
  });
  document.addEventListener("keydown", function (ev) {
    if ((ev.key === "Enter" || ev.key === " ") && ev.target.matches("tr.row, .row-b")) { ev.preventDefault(); ev.target.click(); }
    if (ev.key === "Escape") { closeModal(); closeDrawer(); }
  });
  document.addEventListener("change", function (ev) {
    if (ev.target.id === "fsel") { var L = lineupOf(S.clubId); L.formation = ev.target.value; L.xi = autoXI(S.clubId, L.formation); ui.sel = null; save(); render(); }
    if (ev.target.id === "tpos") { ui.filter.pos = ev.target.value; render(); }
    if (ev.target.id === "tlg") { ui.filter.league = ev.target.value; render(); }
  });
  var typing = null;
  document.addEventListener("input", function (ev) {
    if (ev.target.id === "tq") {
      ui.filter.q = ev.target.value; clearTimeout(typing);
      typing = setTimeout(function () { render(); var i = document.getElementById("tq"); if (i) { i.focus(); i.setSelectionRange(i.value.length, i.value.length); } }, 250);
    }
  });
  function tacticsTap(t) {
    var L = lineupOf(S.clubId);
    var cur = t.hasAttribute("data-slot") ? { kind: "slot", i: +t.getAttribute("data-slot") } : { kind: "bench", id: +t.getAttribute("data-bench") };
    if (!ui.sel) { ui.sel = cur; return render(); }
    var a = ui.sel, b = cur;
    if (a.kind === "slot" && b.kind === "slot" && a.i !== b.i) { var tmp = L.xi[a.i]; L.xi[a.i] = L.xi[b.i]; L.xi[b.i] = tmp; }
    else if (a.kind === "slot" && b.kind === "bench") L.xi[a.i] = b.id;
    else if (a.kind === "bench" && b.kind === "slot") L.xi[b.i] = a.id;
    else { ui.sel = cur; return render(); }
    ui.sel = null; save(); render();
  }

  // ------------------------------------------------------------ boot
  // inside the game the data ships as data.js (window.DLS_DATA): file:// pages cannot fetch JSON
  var loadData = window.DLS_DATA ? Promise.resolve(window.DLS_DATA)
    : fetch("data.json").then(function (r) { if (!r.ok) throw new Error("HTTP " + r.status); return r.json(); });
  loadData.then(function (data) {
    D = data;
    calInit();
    D.players.forEach(function (p) { byId[p.id] = p; (clubPlayers[p.club] = clubPlayers[p.club] || []).push(p); });
    S = load();
    if (S && !D.clubs[S.clubId]) S = null;
    applyDev();
    ui.title = true;  // always open on the start screen
    render();
  }).catch(function (e) {
    app.innerHTML = '<div class="panel" style="padding:18px">Could not load the squad data (' + esc(e.message) + "). Reload to try again.</div>";
  });
})();
</script>
