<meta charset="utf-8">
<title>DLS Manager</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: landscape-first manager shell. Fixed top bar, one screen at a time below it.
   Single deliberate dark look (the game's own world), so no light theme. */
:root {
  color-scheme: dark;
  --bg: #0b0e0d;
  --panel: #151a19;
  --panel-2: #1b2120;
  --line: #29312f;
  --fg: #eef2f1;
  --muted: #95a29f;
  --accent: #4cc86a;
  --accent-dim: #2f7d43;
  --accent-ink: #062c13;
  --win: #4cc86a;
  --draw: #c9a93a;
  --loss: #e0605a;
  --pitch-a: #1d4a2b;
  --pitch-b: #205331;
  --font: "Manrope", system-ui, -apple-system, "Segoe UI", sans-serif;
  --r: 14px;
}
* { box-sizing: border-box; }
html, body { background: var(--bg); color: var(--fg); margin: 0; }
* { -webkit-tap-highlight-color: transparent; }
:focus:not(:focus-visible) { outline: none; }
body {
  font-family: var(--font); font-size: 14px; line-height: 1.4;
  padding-left: max(12px, env(safe-area-inset-left, 0px));
  padding-right: max(12px, env(safe-area-inset-right, 0px));
  padding-block: 10px 24px;
  font-variant-numeric: tabular-nums;
}
/* team intro over the match cutscene (transparent page) */
html.intro, html.intro body { background: transparent !important; }
.pause-wrap { position: fixed; inset: 0; display: grid; place-items: center; background: rgba(6,9,8,.72); animation: fade .25s both; }
.flash-wrap { position: fixed; inset: 0; display: grid; place-items: center; pointer-events: none; animation: flash 1.4s ease-in-out both; }
@keyframes flash { 0% { opacity: 0; transform: scale(.7); } 25% { opacity: 1; transform: scale(1); } 75% { opacity: 1; transform: scale(1.04); } 100% { opacity: 0; transform: scale(1.15); } }
.pause-card { width: min(560px, 92vw); display: grid; gap: 18px; background: var(--panel); border-radius: 18px; padding: 22px; border: 1px solid var(--line); }
.pause-btns { display: grid; gap: 10px; }
.pause-btns .btn { justify-content: center; padding: 14px; font-size: 1rem; }
#hud { display: none; position: fixed; top: 8px; left: 62px; z-index: 50; pointer-events: none; }
.sb { display: flex; align-items: stretch; height: 34px; border-radius: 10px; overflow: hidden; background: rgba(11,14,13,.86); border: 1px solid rgba(255,255,255,.14); font-weight: 800; color: #fff; box-shadow: 0 2px 10px rgba(0,0,0,.35); }
.sb-t { display: flex; align-items: center; gap: 6px; padding: 0 9px; font-size: .85rem; letter-spacing: .04em; }
.sb-s { display: flex; align-items: center; padding: 0 12px; background: var(--accent); color: #071a0d; font-size: 1rem; font-variant-numeric: tabular-nums; }
.sb-c { display: flex; align-items: center; padding: 0 10px; border-left: 1px solid rgba(255,255,255,.14); font-variant-numeric: tabular-nums; font-size: .9rem; }
.lu-wrap { position: fixed; inset: 0; display: grid; grid-template-columns: 1fr 1fr; gap: 4vw; align-items: center; padding: 4vh 6vw; pointer-events: none; }
.lu-side { display: grid; gap: 8px; background: rgba(8,12,10,.78); border-radius: 14px; padding: 10px; }
.intro-wrap { position: fixed; inset: 0; display: grid; align-content: end; padding: 0 0 7vh; pointer-events: none; }
.intro-bar { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 14px; margin: 0 auto; width: min(760px, 94vw);
  background: linear-gradient(90deg, rgba(8,12,10,.0), rgba(8,12,10,.82) 18%, rgba(8,12,10,.82) 82%, rgba(8,12,10,0)); padding: 14px 18px; border-radius: 14px; }
.intro-team { display: flex; align-items: center; gap: 10px; font-weight: 800; font-size: 1.15rem; color: #fff; }
.intro-bar { animation: wipe .55s cubic-bezier(.7,0,.2,1) both; }
.intro-team.h { justify-content: flex-end; animation: inL .7s .35s cubic-bezier(.2,.8,.2,1) both; }
.intro-team.a { animation: inR .7s .35s cubic-bezier(.2,.8,.2,1) both; }
.intro-vs { font-weight: 900; font-size: 1.4rem; color: var(--accent); animation: pop .5s .8s cubic-bezier(.3,1.6,.5,1) both; }
.intro-sub { text-align: center; color: #d8e2dc; font-weight: 600; margin-top: 8px; animation: up .6s 1.1s ease-out both; text-shadow: 0 1px 4px #000; }
@keyframes wipe { from { clip-path: inset(0 50% 0 50% round 14px); opacity: .4; } to { clip-path: inset(0 0 0 0 round 14px); opacity: 1; } }
@keyframes up { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }
@keyframes outDown { to { opacity: 0; transform: translateY(40px); } }
.intro-wrap.out, .lu-wrap.out { animation: outDown .5s ease-in both; }
.lu-wrap .lu-side:first-child { animation: inL .7s cubic-bezier(.2,.8,.2,1) both; }
.lu-wrap .lu-side:last-child { animation: inR .7s .15s cubic-bezier(.2,.8,.2,1) both; }
@keyframes inL { from { opacity: 0; transform: translateX(-60px); } to { opacity: 1; transform: none; } }
@keyframes inR { from { opacity: 0; transform: translateX(60px); } to { opacity: 1; transform: none; } }
@keyframes pop { from { opacity: 0; transform: scale(.4); } to { opacity: 1; transform: none; } }
@keyframes fade { from { opacity: 0; } to { opacity: 1; } }
button { font: inherit; color: inherit; }
.app { max-width: 1120px; margin: 0 auto; display: grid; grid-template-columns: minmax(0, 1fr); gap: 12px; }
.screen { display: grid; grid-template-columns: minmax(0, 1fr); gap: 12px; }
.hidden { display: none !important; }
.muted { color: var(--muted); }
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); }
.btn {
  appearance: none; border: 1px solid var(--line); background: var(--panel-2); border-radius: 12px;
  padding: 10px 16px; font-weight: 700; cursor: pointer; display: inline-flex; align-items: center; gap: 8px;
}
.btn:hover { border-color: var(--accent-dim); }
.btn:focus-visible, .tile:focus-visible, .row:focus-visible, .chip-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.primary:hover { filter: brightness(1.08); }
.btn[disabled] { opacity: .45; cursor: not-allowed; }
.btn.ghost { background: transparent; }
.btn svg { width: 18px; height: 18px; stroke: currentColor; fill: none; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
.chip-btn {
  appearance: none; border: 1px solid var(--line); background: var(--panel); border-radius: 999px;
  padding: 6px 12px; font-weight: 600; cursor: pointer; white-space: nowrap;
}
.chip-btn[aria-pressed="true"] { border-color: var(--accent); color: var(--accent); background: #13241a; }
h1, h2, h3 { margin: 0; letter-spacing: -0.01em; text-wrap: balance; }
h2 { font-size: 1.15rem; }
h3 { font-size: .95rem; }
.label { font-size: .72rem; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }

/* top bar */
.topbar { display: flex; align-items: center; gap: 12px; padding: 8px 12px; min-width: 0; }
.icon-btn { appearance: none; border: 0; background: transparent; cursor: pointer; padding: 6px; border-radius: 10px; display: grid; place-items: center; }
.icon-btn:hover { background: var(--panel-2); }
.icon-btn svg { width: 22px; height: 22px; stroke: var(--fg); fill: none; stroke-width: 2; stroke-linecap: round; }
.club-id { display: flex; align-items: center; gap: 10px; min-width: 0; flex: 1 1 auto; }
.club-id > div { min-width: 0; }
.club-id .lg { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.club-id .nm { font-weight: 800; font-size: 1.05rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.club-id .lg { color: var(--muted); font-size: .8rem; }
.grow { flex: 0 1 0; }
.chips { flex: none; }
.chips { display: flex; align-items: center; gap: 14px; font-weight: 700; font-size: .9rem; white-space: nowrap; }
.coin { width: 14px; height: 14px; border-radius: 50%; background: radial-gradient(circle at 35% 35%, #f5d77a, #c9952a); display: inline-block; vertical-align: -2px; margin-right: 5px; }
.week-tag { color: var(--muted); font-weight: 600; }

/* drawer */
.drawer-bg { position: fixed; inset: 0; background: rgba(0,0,0,.5); z-index: 20; }
.drawer {
  position: fixed; top: 0; bottom: 0; left: 0; width: min(280px, 80vw); z-index: 21;
  background: var(--panel); border-right: 1px solid var(--line);
  padding: calc(16px + env(safe-area-inset-top, 0px)) 12px calc(16px + env(safe-area-inset-bottom, 0px)) max(12px, env(safe-area-inset-left, 0px));
  display: grid; gap: 4px; align-content: start; overflow-y: auto;
}
.drawer button { appearance: none; border: 0; background: transparent; text-align: left; padding: 10px 12px; border-radius: 10px; font-weight: 700; cursor: pointer; }
.drawer button:hover, .drawer button[aria-current="true"] { background: var(--panel-2); color: var(--accent); }

/* home */
.home-grid { display: grid; grid-template-columns: minmax(0, 2.2fr) minmax(0, 1fr); gap: 12px; }
.match-hero {
  position: relative; overflow: hidden; border-radius: var(--r); border: 1px solid var(--line); border-left: 3px solid var(--accent);
  background:
    radial-gradient(120% 70% at 50% -10%, rgba(255,255,255,.16), transparent 60%),
    linear-gradient(180deg, #283034 0%, #1a2024 45%, #183322 72%, #1e4a2c 100%);
  padding: 14px 18px; display: grid; gap: 10px; min-width: 0;
}
.match-hero::after { content: ""; position: absolute; inset: 64% 0 0 0; background: repeating-linear-gradient(90deg, rgba(255,255,255,.04) 0 40px, transparent 40px 80px); pointer-events: none; }
.match-hero > * { position: relative; z-index: 1; }
.eyebrow { color: var(--accent); font-weight: 800; font-size: 1.1rem; }
.versus { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 8px; }
.side { display: grid; justify-items: center; gap: 6px; text-align: center; font-weight: 700; min-width: 0; }
.side .tag { font-size: .75rem; color: #cfd8d6; font-weight: 600; }
.vs { font-weight: 800; font-size: 1.4rem; }
.hero-actions { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
.pos-card { padding: 14px; display: grid; gap: 6px; align-content: start; text-align: center; min-width: 0; }
.big { font-weight: 800; font-size: 2.8rem; line-height: 1; color: var(--accent); letter-spacing: -0.03em; }
.big sup { font-size: .45em; vertical-align: .8em; }
.form { display: flex; justify-content: center; gap: 8px; }
.dot { width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; font-size: .68rem; font-weight: 800; color: #0b0e0d; background: #5a6262; }
.dot.W { background: var(--win); } .dot.D { background: var(--draw); } .dot.L { background: var(--loss); }
.tiles { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
.tile {
  appearance: none; background: linear-gradient(160deg, var(--panel-2), var(--panel)); border: 1px solid var(--line);
  border-radius: var(--r); padding: 14px 8px 12px; display: grid; justify-items: center; gap: 6px; font-weight: 700; cursor: pointer;
}
.tile:hover { border-color: var(--accent-dim); }
.tile svg { width: 26px; height: 26px; stroke: var(--fg); fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.tile .sub { font-size: .72rem; color: var(--muted); font-weight: 600; }
.news { display: flex; align-items: center; gap: 12px; padding: 10px 14px; min-width: 0; cursor: pointer; }
.news .k { color: var(--accent); font-weight: 700; font-size: .75rem; }
.news .t { font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

/* generic screen */
.screen-head { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.screen-head h2 { margin-right: auto; }
.tabs { display: flex; gap: 6px; flex-wrap: wrap; }
.table-wrap { overflow-x: auto; border-radius: var(--r); border: 1px solid var(--line); background: var(--panel); }
table { width: 100%; border-collapse: collapse; font-size: .88rem; }
th, td { padding: 8px 10px; text-align: left; white-space: nowrap; }
th { color: var(--muted); font-weight: 700; font-size: .72rem; letter-spacing: .05em; text-transform: uppercase; border-bottom: 1px solid var(--line); position: sticky; top: 0; background: var(--panel); }
td.num, th.num { text-align: right; }
tbody tr { border-top: 1px solid #1f2625; }
tbody tr.row { cursor: pointer; }
tbody tr.row:hover { background: #1a201f; }
tr.me td { background: #13241a; }
tr.zone-top td:first-child { box-shadow: inset 3px 0 0 var(--win); }
tr.zone-bottom td:first-child { box-shadow: inset 3px 0 0 var(--loss); }
.ovr { display: inline-grid; place-items: center; min-width: 34px; padding: 2px 6px; border-radius: 8px; font-weight: 800; color: #071a0d; }
.pos-pill { display: inline-block; min-width: 30px; text-align: center; padding: 1px 6px; border-radius: 6px; font-size: .72rem; font-weight: 800; background: #24302d; }
.pos-GK { background: #6b5a1f; } .pos-DF { background: #1f4a6b; } .pos-MF { background: #24603a; } .pos-FW { background: #6b2a2a; }
.club-cell { display: inline-flex; align-items: center; gap: 8px; }
input[type="search"], select {
  font: inherit; color: var(--fg); background: var(--panel-2); border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px;
}

/* player profile */
.profile { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.3fr); gap: 12px; }
.profile-head { padding: 16px; display: grid; gap: 10px; align-content: start; }
.shirt { font-size: 2.4rem; font-weight: 800; color: var(--accent); line-height: 1; }
.facts { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px 14px; }
.fact .label { display: block; }
.fact b { font-weight: 700; }
.attrs { padding: 16px; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px 18px; align-content: start; }
.attr { display: grid; grid-template-columns: 1fr auto; gap: 4px 10px; align-items: center; font-weight: 600; }
.bar { grid-column: 1 / -1; height: 6px; border-radius: 4px; background: #232b29; overflow: hidden; }
.bar i { display: block; height: 100%; border-radius: 4px; }
.season-line { display: flex; gap: 18px; flex-wrap: wrap; padding: 12px 16px; }
.season-line div { display: grid; }
.season-line b { font-size: 1.2rem; }

/* tactics */
.tactics { display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr); gap: 12px; }
.pitch {
  position: relative; aspect-ratio: 68 / 60; max-width: 100%; border-radius: var(--r); border: 1px solid var(--line); overflow: hidden;
  background: repeating-linear-gradient(0deg, var(--pitch-a) 0 10%, var(--pitch-b) 10% 20%);
}
.pitch::before { content: ""; position: absolute; left: 25%; right: 25%; bottom: 0; height: 18%; border: 2px solid rgba(255,255,255,.25); border-bottom: 0; }
.pitch::after { content: ""; position: absolute; left: 0; right: 0; top: 0; height: 0; border-top: 2px solid rgba(255,255,255,.25); }
.slot {
  position: absolute; transform: translate(-50%, -50%); display: grid; justify-items: center; gap: 2px; width: 84px;
  appearance: none; border: 0; background: transparent; cursor: pointer; padding: 0;
}
.slot .disc { width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; font-weight: 800; font-size: .8rem; border: 2px solid #fff; }
.slot .nm { font-size: .7rem; font-weight: 700; background: rgba(0,0,0,.55); padding: 1px 6px; border-radius: 6px; max-width: 84px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.slot.sel .disc { outline: 3px solid var(--accent); outline-offset: 2px; }
.lg-logo { vertical-align: -2px; margin-right: 5px; }
.pitch.mini { max-width: 360px; width: 100%; justify-self: center; }
.pitch.mini .slot { pointer-events: none; }
.slot .fit { font-size: .62rem; font-weight: 800; color: var(--draw); }
.bench { padding: 10px; display: grid; gap: 4px; align-content: start; max-height: 520px; overflow-y: auto; }
.bench .row-b { display: grid; grid-template-columns: auto 1fr auto; gap: 8px; align-items: center; padding: 6px 8px; border-radius: 10px; cursor: pointer; border: 1px solid transparent; }
.bench .row-b:hover { background: var(--panel-2); }
.bench .row-b.sel { border-color: var(--accent); }

/* match report */
.score-card { padding: 16px; display: grid; gap: 12px; }
.scoreline { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 10px; text-align: center; }
.score { font-size: 2.6rem; font-weight: 800; letter-spacing: .02em; }
.events { display: grid; grid-template-columns: 1fr 1fr; gap: 4px 20px; font-size: .86rem; }
.events .h { text-align: right; }
.stat-row { display: grid; grid-template-columns: 48px 1fr 48px; gap: 10px; align-items: center; font-weight: 700; }
.stat-row .mid { display: grid; gap: 4px; text-align: center; font-size: .78rem; color: var(--muted); font-weight: 600; }
.split { display: flex; height: 6px; border-radius: 4px; overflow: hidden; background: #232b29; }
.split i:first-child { background: var(--accent); }
.split i:last-child { background: #8a9895; }
.two-col { display: grid; grid-template-columns: minmax(0,1fr) minmax(0,1fr); gap: 12px; }
.rating { font-weight: 800; }
.note { padding: 12px 14px; border-left: 3px solid var(--draw); background: #1d1b12; border-radius: 10px; font-size: .88rem; }

/* new game */
.club-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 10px; }
.club-card { appearance: none; text-align: left; display: flex; gap: 10px; align-items: center; padding: 10px 12px; border-radius: 12px; border: 1px solid var(--line); background: var(--panel); cursor: pointer; }
.club-card[aria-pressed="true"] { border-color: var(--accent); background: #13241a; }
.club-card .meta { font-size: .75rem; color: var(--muted); }
.modal-bg { position: fixed; inset: 0; background: rgba(0,0,0,.6); z-index: 30; display: grid; place-items: center; padding: 16px; }
.modal { max-width: 440px; padding: 18px; display: grid; gap: 12px; }

@media (max-width: 760px) {
  .home-grid, .profile, .tactics, .two-col { grid-template-columns: 1fr; }
  .tiles { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .chips .hide-sm { display: none; }
  .attrs { grid-template-columns: 1fr; }
}
@media (prefers-reduced-motion: no-preference) {
  .screen { animation: fade .18s ease-out; }
  @keyframes fade { from { opacity: .4; transform: translateY(4px); } to { opacity: 1; transform: none; } }
}
</style>

<div class="app" id="app">

</div>

<script>
(function () {
  "use strict";
  var SAVE_KEY = "dlsmgr-save-v1";
  var D = null;                 // game data (data.json)
  var S = null;                 // save state
  var ui = { screen: "home", tableLeague: null, statsLeague: null, fixturesWeek: null, report: null, player: null, sel: null, filter: { q: "", pos: "", league: "" }, pick: null };
  var byId = {}, clubPlayers = {};
  var app = document.getElementById("app");

  // ------------------------------------------------------------ helpers
  function el(html) { var t = document.createElement("template"); t.innerHTML = html.trim(); return t.content; }
  function esc(s) { return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); }
  function club(id) { return D.clubs[id]; }
  // league logo (leagues/<id>.png); leagues without one show nothing
  var LEAGUE_LOGOS = { slovenia_2snl: 1 };
  function leagueLogo(lid, h) { return LEAGUE_LOGOS[lid] ? '<img class="lg-logo" src="leagues/' + lid + '.png" alt="" style="height:' + h + 'px">' : ""; }
  function leagueOf(cid) { return D.leagues.find(function (l) { return l.id === club(cid).league; }); }
  function money(v) { if (!v) return "–"; return v >= 1e6 ? "€" + (v / 1e6).toFixed(v >= 1e7 ? 0 : 1) + "M" : "€" + Math.round(v / 1e3) + "K"; }
  function ordinal(n) { var s = ["th", "st", "nd", "rd"], v = n % 100; return n + "<sup>" + (s[(v - 20) % 10] || s[v] || s[0]) + "</sup>"; }
  function ovrColor(o) { var t = Math.max(0, Math.min(1, (o - 45) / 45)); return "hsl(" + (10 + t * 120) + ",62%," + (48 + t * 6) + "%)"; }
  function group(pos) { return pos === "GK" ? "GK" : ["CB", "LB", "RB"].indexOf(pos) >= 0 ? "DF" : ["DM", "CM", "AM", "LM", "RM"].indexOf(pos) >= 0 ? "MF" : "FW"; }
  function dateOf(week) { var d = new Date(D.startDate + "T12:00:00Z"); d.setUTCDate(d.getUTCDate() + 7 * week); return d.toLocaleDateString("en-GB", { weekday: "short", day: "numeric", month: "short", year: "numeric", timeZone: "UTC" }); }
  function rng(seed) { var a = seed >>> 0; return function () { a |= 0; a = a + 0x6D2B79F5 | 0; var t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
  function poisson(lam, r) { var L = Math.exp(-lam), k = 0, p = 1; do { k++; p *= r(); } while (p > L); return k - 1; }
  function pickW(items, weights, r) { var s = 0, i; for (i = 0; i < weights.length; i++) s += weights[i]; var x = r() * s; for (i = 0; i < items.length; i++) { x -= weights[i]; if (x <= 0) return items[i]; } return items[items.length - 1]; }

  function badge(cid, size) {

      '<div class="events"><div class="h">' + side("h") + "</div><div>" + side("a") + "</div></div></section>" +
      '<section class="panel" style="padding:14px;display:grid;gap:10px">' + rows.map(function (x) {
        var a = st[x[1]][0], b = st[x[1]][1], tot = (a + b) || 1;
        return '<div class="stat-row"><span>' + a + '</span><div class="mid">' + x[0] + '<div class="split"><i style="width:' + (a / tot * 100) + '%"></i><i style="width:' + (b / tot * 100) + '%"></i></div></div><span style="text-align:right">' + b + "</span></div>";
      }).join("") + "</section>" +
      '<div class="two-col">' + ratingTable(r.h, r.xi.h) + ratingTable(r.a, r.xi.a) + "</div>" +
      (mine ? "" : "");
  }

  function renderNewGame() {
    var lid = ui.pickLeague || "slovenia_2snl";
    var pick = ui.pick || "fuzinar";
    var lg = D.leagues.find(function (l) { return l.id === lid; });
    app.innerHTML = '<header class="panel topbar"><div class="club-id"><div><div class="nm">DLS Manager</div><div class="lg">New career · ' + D.season + '</div></div></div><button class="btn ghost" data-act="totitle">Back</button></header>' +
      '<main class="screen" style="display:grid;gap:12px"><div class="screen-head"><h2>Choose your club</h2><div class="tabs">' +
      D.leagues.map(function (l) { return '<button class="chip-btn" data-pickleague="' + l.id + '" aria-pressed="' + (l.id === lid) + '">' + leagueLogo(l.id, 14) + esc(l.name) + "</button>"; }).join("") + "</div></div>" +
      '<div class="club-grid">' + lg.clubs.map(function (cid) {
        var ps = clubPlayers[cid], avg = Math.round(ps.slice().sort(function (a, b) { return b.ovr - a.ovr; }).slice(0, 15).reduce(function (s, p) { return s + p.ovr; }, 0) / 15);
        return '<button class="club-card" data-pick="' + cid + '" aria-pressed="' + (cid === pick) + '">' + badge(cid, 30) + '<div><b>' + esc(club(cid).name) + '</b><div class="meta">' + esc(club(cid).city) + " · ★ " + avg + "</div></div></button>";
      }).join("") + "</div>" +
      '<div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap"><button class="btn primary" data-act="start">Start career with ' + esc(club(pick).name) + '</button><span class="muted">' + esc(club(pick).stadium) + " · " + clubPlayers[pick].length + " players</span></div></main>";
  }

  // Picking a club only changes the highlight and the start line; re-rendering the whole
  // screen reloaded every badge and made the in-game WebView flash black.
  function updateNewGamePick() {
    var pick = ui.pick;
    Array.prototype.forEach.call(document.querySelectorAll("[data-pick]"), function (b) {
      b.setAttribute("aria-pressed", String(b.getAttribute("data-pick") === pick));
    });
    var start = document.querySelector('[data-act="start"]');
    if (start) {
      start.textContent = "Start career with " + club(pick).name;
      start.nextElementSibling.textContent = club(pick).stadium + " · " + clubPlayers[pick].length + " players";
    }
  }

  // Opening screen: load / new career / export save
  function renderTitle() {
    var saved = S && D.clubs[S.clubId] ? S : null;
    var inGame = !!(window.DLSManager && window.DLSManager.exportSave);
    app.innerHTML = '<main class="screen" style="min-height:100vh;display:grid;place-items:center">' +
      '<section class="panel" style="width:min(460px,100%);padding:28px;display:grid;gap:14px">' +
      '<div><div style="font-size:30px;font-weight:800;letter-spacing:-.02em">DLS Manager</div><div class="muted">Season ' + esc(D.season) + "</div></div>" +
      (saved ? '<button class="btn primary" data-act="loadcareer" style="display:flex;gap:12px;align-items:center;justify-content:flex-start;text-align:left">' + badge(saved.clubId, 34) +
        '<span><b>Load career</b><br><span style="font-weight:500;opacity:.85">' + esc(club(saved.clubId).name) + " · matchweek " + (saved.week + 1) + "</span></span></button>" : "") +
      '<button class="btn' + (saved ? "" : " primary") + '" data-act="newcareer">New career</button>' +
      (inGame ? '<button class="btn ghost" data-act="exportsave">Export save</button>' : "") +
      "</section></main>";
  }

  function modal(html) {
    var m = el('<div class="modal-bg" id="modal"><section class="panel modal">' + html + "</section></div>");
    document.body.appendChild(m);
  }
  function closeModal() { var m = document.getElementById("modal"); if (m) m.remove(); }
  function openDrawer() {
    var items = [["home", "Home"], ["squad", "Squad"], ["tactics", "Tactics"], ["fixtures", "Fixtures"], ["table", "League tables"], ["stats", "Stats"], ["transfers", "Transfers"], ["training", "Training"]];
    var d = el('<div id="drawer"><div class="drawer-bg" data-act="closedrawer"></div><nav class="drawer" aria-label="Main menu"><div class="label" style="padding:4px 12px 10px">' + esc(club(S.clubId).name) + "</div>" +
      items.map(function (x) { return '<button data-go="' + x[0] + '" aria-current="' + (ui.screen === x[0]) + '">' + x[1] + "</button>"; }).join("") +
      (window.DLSManager && window.DLSManager.exportSave ? '<button data-act="exportsave" style="margin-top:12px;opacity:.8">Export save</button>' : "") +
      "</nav></div>");
    document.body.appendChild(d);
  }
  function closeDrawer() { var d = document.getElementById("drawer"); if (d) d.remove(); }

  // ------------------------------------------------------------ back from a DLS match
  // Overlay.show() calls this when the menus come back. If DLS's last match is the fixture we
  // sent (player team = DLS team 258) and it is new, its score is saved to the season.
  window.dlsOnShow = function () {
    if (window.inMatch) window.dlsHudOff();
    if (!S || !S.pending || !window.DLSManager || !window.DLSManager.lastMatch) return;
    var now = window.DLSManager.lastMatch();
    if (!now || now === S.pending.before) return;
    var f = now.split(",").map(Number), P = S.pending;
    [0, 1].forEach(function (i) { if (f[i] === -3 || f[i] === -4) f[i] = 258; });  // DLS's aliases for the player team
    var want = P.userHome ? [258, P.oppTid] : [P.oppTid, 258];
    if (f[0] !== want[0] || f[1] !== want[1]) return;
    // the score goes straight into the season (rest of the matchweek simulated), then the report
    var mineR = playWeek({ hg: f[2], ag: f[3] });
    S.pending = null; save();
    if (mineR) { ui.report = mineR; ui.screen = "report"; } else ui.screen = "home";
    ui.title = false; closeModal();
    render();
  };

  // Game events (Overlay.IntroTask): our transparent intro over DLS's build-up cutscene.
  window.dlsIntro = function (weather, timeOfDay) {
    var fx = S && S.pending ? S.pending : null;
    if (!fx) return;
    var w = ["Clear", "Rain", "Snow"][weather] || "Clear", t = timeOfDay >= 2 ? "Night" : timeOfDay === 1 ? "Evening" : "Day";
    document.documentElement.classList.add("intro");
    app.innerHTML = "";
    showAnimated('<div class="intro-wrap"><div class="intro-bar"><div class="intro-team h">' + esc(club(fx.home).name) + badge(fx.home, 44) +
      '</div><div class="intro-vs">VS</div><div class="intro-team a">' + badge(fx.away, 44) + esc(club(fx.away).name) + "</div></div>" +
      '<div class="intro-sub">' + leagueLogo(club(fx.home).league, 16) + esc(club(fx.home).stadium || "") + " · " + w + " · " + t + "</div></div>");
  };
  // insert overlay markup two frames later, so its animation starts once the layer is visible
  function showAnimated(html) {
    requestAnimationFrame(function () { requestAnimationFrame(function () { app.innerHTML = html; }); });
  }
  // slide the current overlay away; Java hides the layer after it
  window.dlsIntroOut = function () {
    var el = document.querySelector(".intro-wrap, .lu-wrap");
    if (el) el.classList.add("out");
  };
  // DLS's "Starting XI" graphic is switched off natively; ours shows both line-ups instead.
  window.dlsLineups = function () {
    var fx = S && S.pending ? S.pending : null;
    if (!fx) return;
    document.documentElement.classList.add("intro");
    function side(cid) {
      return '<div class="lu-side"><div class="intro-team" style="justify-content:center">' + badge(cid, 30) + esc(club(cid).name) +
        ' <span style="opacity:.7;font-weight:600">' + lineupOf(cid).formation + "</span></div>" + miniPitch(cid) + "</div>";
    }
    var cur = document.querySelector(".intro-wrap");
    if (cur) cur.classList.add("out");
    setTimeout(function () { app.innerHTML = '<div class="lu-wrap">' + side(fx.home) + side(fx.away) + "</div>"; }, cur ? 450 : 0);
  };
  // Our pause / half-time menu over the match (DLS's pause screen is still there underneath;
  // the buttons press DLS's own: 8 resume, 1 team management, 7 quit).
  window.dlsPause = function (hg, ag) {
    var fx = S && S.pending ? S.pending : null;
    if (!fx) return;
    document.documentElement.classList.add("intro");
    app.innerHTML = '<div class="pause-wrap"><div class="pause-card">' +
      '<div class="scoreline"><div class="side">' + badge(fx.home, 48) + esc(club(fx.home).name) + '</div><div class="score">' + hg + " – " + ag + '</div><div class="side">' + badge(fx.away, 48) + esc(club(fx.away).name) + "</div></div>" +
      '<div class="pause-btns"><button class="btn primary" data-pause="8">Resume</button>' +
      '<button class="btn" data-pause="1">Substitutions &amp; tactics</button>' +
      '<button class="btn ghost" data-pause="quit">Quit match</button></div></div></div>';
  };
  document.addEventListener("click", function (ev) {
    var b = ev.target.closest("[data-pause]");
    if (!b || !window.DLSManager || !window.DLSManager.pauseAction) return;
    var v = b.getAttribute("data-pause");
    if (v === "quit") {
      b.parentNode.innerHTML = '<p style="margin:0;text-align:center;font-weight:700">Quit the match? It counts as finished at the current score.</p>' +
        '<button class="btn primary" data-pause="7">Quit</button><button class="btn" data-pause="back">Back</button>';
      return;
    }
    if (v === "back") return window.dlsPause.apply(null, (document.querySelector(".pause-card .score").textContent.split(" – ").map(Number)));
    window.DLSManager.pauseAction(+v);
  });
  // replays: the league's logo flashes where DLS showed its own logo wipe
  window.dlsReplayFlash = function () {
    var lg = S ? club(S.clubId).league : null;
    document.documentElement.classList.add("intro");
    app.innerHTML = "";
    showAnimated('<div class="flash-wrap">' + (LEAGUE_LOGOS[lg] ? leagueLogo(lg, 120) : '<b style="font-size:2rem">' + esc(myLeague().name) + "</b>") + "</div>");
  };
  // ---- in-match HUD: our scoreboard (DLS's is switched off natively); Java's pause button
  // sits to its left. Updated by the game every time the score or clock changes.
  window.dlsHudMode = function () {
    var fx = S && S.pending ? S.pending : null;
    window.inMatch = true;
    document.documentElement.classList.add("intro");
    app.innerHTML = "";
    var h = document.getElementById("hud");
    if (!h) { h = document.createElement("div"); h.id = "hud"; document.body.appendChild(h); }
    h.innerHTML = fx ? '<div class="sb"><span class="sb-t">' + badge(fx.home, 22) + '<b>' + esc(club(fx.home).short || "") + '</b></span>' +
      '<span class="sb-s" id="sbs">0 – 0</span><span class="sb-t"><b>' + esc(club(fx.away).short || "") + "</b>" + badge(fx.away, 22) + '</span>' +
      '<span class="sb-c" id="sbc">00:00</span></div>' : "";
    h.style.display = "block";
  };
  window.dlsHud = function (hg, ag, mn, sc) {
    var a = document.getElementById("sbs"), c = document.getElementById("sbc");
    if (a) a.textContent = hg + " – " + ag;
    if (c) c.textContent = (mn < 10 ? "0" : "") + mn + ":" + (sc < 10 ? "0" : "") + sc;
  };
  window.dlsHudOff = function () {
    window.inMatch = false;
    var h = document.getElementById("hud");
    if (h) h.style.display = "none";
    document.documentElement.classList.remove("intro");
  };
  window.dlsIntroEnd = function () {
    if (window.inMatch) { app.innerHTML = ""; return; }
    document.documentElement.classList.remove("intro");
    render();
  };

  window.dlsKickoffFailed = function () {
    if (ui.screen !== "kickoff") return;
    S.pending = null; save();
    ui.screen = "prematch"; render();
    modal('<h2>The match didn\'t start</h2><p class="muted" style="margin:0">Please use Export save in the menu and send it over, so the log shows where kick-off stopped.</p><button class="btn primary" data-act="closemodal">OK</button>');
  };

  // ------------------------------------------------------------ events
  document.addEventListener("click", function (ev) {
    var t = ev.target.closest("[data-go],[data-act],[data-player],[data-slot],[data-bench],[data-table],[data-stats],[data-report],[data-pick],[data-pickleague],[data-back-player]");
    if (!t) return;
    if (t.hasAttribute("data-pickleague")) { ui.pickLeague = t.getAttribute("data-pickleague"); ui.pick = D.leagues.find(function (l) { return l.id === ui.pickLeague; }).clubs[0]; return renderNewGame(); }
    if (t.hasAttribute("data-pick")) { ui.pick = t.getAttribute("data-pick"); return updateNewGamePick(); }
    var go = t.getAttribute("data-go"), act = t.getAttribute("data-act");
    if (go) { closeDrawer(); ui.screen = go; ui.sel = null; return render(); }
    if (t.hasAttribute("data-back-player")) { ui.screen = ui.prev || "squad"; return render(); }
    if (t.hasAttribute("data-player")) { ui.prev = ui.screen === "player" ? ui.prev : ui.screen; ui.player = +t.getAttribute("data-player"); ui.screen = "player"; return render(); }
    if (t.hasAttribute("data-table")) { ui.tableLeague = t.getAttribute("data-table"); return render(); }
    if (t.hasAttribute("data-stats")) { ui.statsLeague = t.getAttribute("data-stats"); return render(); }
    if (t.hasAttribute("data-report")) {
      var k = t.getAttribute("data-report").split(":");
      ui.report = S.results[k[0]][+k[1]].find(function (x) { return x.h === k[2]; }); ui.screen = "report"; return render();
    }
    if (t.hasAttribute("data-slot") || t.hasAttribute("data-bench")) return tacticsTap(t);
    if (act === "drawer") return openDrawer();
    if (act === "closedrawer") return closeDrawer();
    if (act === "exportsave") { closeDrawer(); if (window.DLSManager && window.DLSManager.exportSave) window.DLSManager.exportSave(); return; }
    if (act === "sim") {
      var mine = playWeek();
      if (mine) { ui.report = mine; ui.screen = "report"; } else ui.screen = "home";
      return render();
    }
    if (act === "play") {
      if (!nextFixture()) return;
      ui.screen = "prematch"; return render();
    }
    if (act === "kickoff") {
      var fx = nextFixture();
      if (!fx) return;
      var userHome = fx.home === S.clubId, opp = userHome ? fx.away : fx.home;
      if (window.DLSManager && window.DLSManager.kickOff) {
        S.pending = { week: fx.week, home: fx.home, away: fx.away, userHome: userHome, oppTid: window.DLSManager.clubTid(opp),
                      before: window.DLSManager.lastMatch() };
        save();
        var sheets = { home: dlsSheet(fx.home), away: dlsSheet(fx.away), difficulty: DIFFS[S.difficulty || "hard"] };
        ui.screen = "kickoff"; render();  // stays up while the game loads the match underneath
        setTimeout(function () {
          var err = window.DLSManager.kickOff(opp, userHome, JSON.stringify(sheets));
          if (err) { ui.screen = "prematch"; render(); modal('<h2>Could not start the match</h2><p class="muted" style="margin:0">' + esc(err) + '</p><button class="btn primary" data-act="closemodal">OK</button>'); }
        }, 60);
        return;
      }
      return modal('<h2>Kick-off</h2><p class="muted" style="margin:0">Inside the game this starts the real DLS19 match with these two line-ups. In the web preview use Quick Sim.</p><button class="btn primary" data-act="closemodal">OK</button>');
    }
    if (act === "closemodal") return closeModal();
    if (act === "loadcareer") {
      ui.title = false; ui.screen = "home";
      // keep the game's team in step with the career (e.g. after a recovery reset it)
      if (window.DLSManager && window.DLSManager.currentClub && window.DLSManager.currentClub() !== S.clubId) window.DLSManager.becomeClub(S.clubId);
      return render();
    }
    if (act === "newcareer") {
      if (S && !t.hasAttribute("data-sure")) {
        return modal('<h2>Start a new career?</h2><p class="muted" style="margin:0">Your current career with ' + esc(club(S.clubId).name) + ' is replaced when you start the new one.</p>' +
          '<div style="display:flex;gap:8px"><button class="btn primary" data-act="newcareer" data-sure="1">Choose a club</button><button class="btn ghost" data-act="closemodal">Cancel</button></div>');
      }
      closeModal(); ui.title = false; S = null; return render();
    }
    if (act === "totitle") { S = load(); if (S && !D.clubs[S.clubId]) S = null; ui.title = true; return render(); }
    if (act === "saveresult") {
      closeModal();
      var mineR = playWeek({ hg: +t.getAttribute("data-hg"), ag: +t.getAttribute("data-ag") });
      S.pending = null; save();
      if (window.DLSManager && window.DLSManager.clearFixture) window.DLSManager.clearFixture();
      if (mineR) { ui.report = mineR; ui.screen = "report"; } else ui.screen = "home";
      return render();
    }
    if (act === "autopick") { var L = lineupOf(S.clubId); L.xi = autoXI(S.clubId, L.formation); ui.sel = null; save(); return render(); }
    if (act === "settings") {
      var cur = S.difficulty || "hard";
      return modal('<h2>Settings</h2><label class="label" for="diffsel">Match difficulty</label><select id="diffsel">' +
        [["easy", "Easy"], ["normal", "Normal"], ["hard", "Hard"], ["veryhard", "Very hard"], ["elite", "Elite (DLS's hardest)"]].map(function (d) { return '<option value="' + d[0] + '"' + (d[0] === cur ? " selected" : "") + ">" + d[1] + "</option>"; }).join("") +
        '</select><p class="muted" style="margin:0">Assists are off in matches. Your career is saved on this device automatically.</p><button class="btn" data-act="askreset">Start a new career…</button><button class="btn ghost" data-act="closemodal">Close</button>');
    }
    if (act === "askreset") { closeModal(); return modal('<h2>Start a new career?</h2><p class="muted" style="margin:0">This deletes the current season, results and stats.</p><div style="display:flex;gap:8px"><button class="btn primary" data-act="reset">Delete and start over</button><button class="btn ghost" data-act="closemodal">Keep playing</button></div>'); }
    if (act === "reset") { closeModal(); S = null; try { localStorage.removeItem(SAVE_KEY); } catch (e) {} ui.screen = "home"; return render(); }
    if (act === "start") {
      S = newSeason(ui.pick || "fuzinar", (Date.now() % 2147483647) >>> 0); lineupOf(S.clubId); save(); ui.screen = "home"; ui.title = false;
      // inside the game: make the Dream FC this club (the game restarts to apply it)
      if (window.DLSManager && window.DLSManager.becomeClub && window.DLSManager.currentClub() !== S.clubId) {
        window.DLSManager.becomeClub(S.clubId);
      }
      return render();
    }
  });
  document.addEventListener("keydown", function (ev) {
    if ((ev.key === "Enter" || ev.key === " ") && ev.target.matches("tr.row, .row-b")) { ev.preventDefault(); ev.target.click(); }
    if (ev.key === "Escape") { closeModal(); closeDrawer(); }
  });
  document.addEventListener("change", function (ev) {
    if (ev.target.id === "fsel") { var L = lineupOf(S.clubId); L.formation = ev.target.value; L.xi = autoXI(S.clubId, L.formation); ui.sel = null; save(); render(); }
    if (ev.target.id === "tpos") { ui.filter.pos = ev.target.value; render(); }
    if (ev.target.id === "tlg") { ui.filter.league = ev.target.value; render(); }
  });
  var typing = null;
  document.addEventListener("input", function (ev) {
    if (ev.target.id === "tq") {
      ui.filter.q = ev.target.value; clearTimeout(typing);
      typing = setTimeout(function () { render(); var i = document.getElementById("tq"); if (i) { i.focus(); i.setSelectionRange(i.value.length, i.value.length); } }, 250);
    }
  });
  function tacticsTap(t) {
    var L = lineupOf(S.clubId);
    var cur = t.hasAttribute("data-slot") ? { kind: "slot", i: +t.getAttribute("data-slot") } : { kind: "bench", id: +t.getAttribute("data-bench") };
    if (!ui.sel) { ui.sel = cur; return render(); }
    var a = ui.sel, b = cur;
    if (a.kind === "slot" && b.kind === "slot" && a.i !== b.i) { var tmp = L.xi[a.i]; L.xi[a.i] = L.xi[b.i]; L.xi[b.i] = tmp; }
    else if (a.kind === "slot" && b.kind === "bench") L.xi[a.i] = b.id;
    else if (a.kind === "bench" && b.kind === "slot") L.xi[b.i] = a.id;
    else { ui.sel = cur; return render(); }
    ui.sel = null; save(); render();
  }

  // ------------------------------------------------------------ boot
  // inside the game the data ships as data.js (window.DLS_DATA): file:// pages cannot fetch JSON
  var loadData = window.DLS_DATA ? Promise.resolve(window.DLS_DATA)
    : fetch("data.json").then(function (r) { if (!r.ok) throw new Error("HTTP " + r.status); return r.json(); });
  loadData.then(function (data) {
    D = data;
    D.players.forEach(function (p) { byId[p.id] = p; (clubPlayers[p.club] = clubPlayers[p.club] || []).push(p); });
    S = load();
    if (S && !D.clubs[S.clubId]) S = null;
    ui.title = true;  // always open on the start screen
    render();
  }).catch(function (e) {
    app.innerHTML = '<div class="panel" style="padding:18px">Could not load the squad data (' + esc(e.message) + "). Reload to try again.</div>";
  });
})();
</script>
