<title>The Caldera Council</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Marcellus&family=Marcellus+SC&family=Alegreya+Sans:ital,wght@0,400;0,500;0,700;1,400&display=swap">
<style>
/* Layout: the chamber fills the screen; a basalt tablet of dialogue sits at the bottom, the realm's ledger across the top. */
:root {
  --basalt: #14100e; --ash: #241d1a; --ash-2: #322824; --ember: #ff7a35; --gold: #d8a84a;
  --bone: #efe3cc; --dust: #a6978a; --pasture: #8cbc63; --blood: #d0574a;
  --display: "Marcellus", "Palatino Linotype", Palatino, Georgia, serif;
  --caps: "Marcellus SC", "Palatino Linotype", Georgia, serif;
  --body: "Alegreya Sans", "Gill Sans", "Segoe UI", system-ui, sans-serif;
  color-scheme: dark;
}
html, body { height: 100%; }
body { background: var(--basalt); color: var(--bone); font-family: var(--body); font-size: 16px; overflow: hidden; }
#stage { position: fixed; inset: 0; }
#stage canvas { display: block; width: 100%; height: 100%; }
.ui { position: fixed; left: 0; right: 0; pointer-events: none; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.ui > * { pointer-events: auto; }

/* the ledger */
#ledger { top: 0; padding-top: calc(env(safe-area-inset-top, 0px) + 10px); display: flex; justify-content: center; }
.stats { display: flex; gap: 6px; flex-wrap: wrap; justify-content: center; background: color-mix(in srgb, var(--basalt) 78%, transparent); border: 1px solid var(--ash-2); border-radius: 999px; padding: 6px 12px; backdrop-filter: blur(6px); }
.stat { display: flex; align-items: baseline; gap: 5px; padding: 0 6px; font-variant-numeric: tabular-nums; }
.stat b { font-family: var(--caps); font-weight: 400; font-size: 11px; letter-spacing: .08em; color: var(--dust); }
.stat span { font-size: 15px; font-weight: 700; }
.stat .d { font-size: 11px; font-weight: 500; }
.up { color: var(--pasture); } .down { color: var(--blood); }
.season { font-family: var(--caps); letter-spacing: .06em; color: var(--gold); font-size: 13px; padding-right: 8px; border-right: 1px solid var(--ash-2); }

/* the tablet */
#tablet { bottom: 0; padding-bottom: calc(env(safe-area-inset-bottom, 0px) + 12px); display: flex; justify-content: center; }
.slab { width: 100%; max-width: 680px; max-height: 58vh; display: flex; flex-direction: column; background: linear-gradient(180deg, color-mix(in srgb, var(--ash) 94%, transparent), color-mix(in srgb, var(--basalt) 96%, transparent)); border: 1px solid var(--ash-2); border-top: 2px solid color-mix(in srgb, var(--ember) 55%, var(--ash-2)); border-radius: 14px; box-shadow: 0 -12px 40px rgba(0,0,0,.5); overflow: hidden; }
.slab-head { display: flex; align-items: baseline; gap: 10px; padding: 14px 18px 4px; }
.slab-head h2 { font-family: var(--display); font-weight: 400; font-size: 22px; margin: 0; text-wrap: balance; }
.slab-head small { font-family: var(--caps); font-size: 12px; letter-spacing: .08em; color: var(--dust); }
.slab-body { padding: 4px 18px 10px; overflow-y: auto; min-height: 0; line-height: 1.5; }
.slab-body p { margin: .4em 0; max-width: 62ch; }
.speech { font-size: 17px; }
.speech .who { font-family: var(--caps); color: var(--gold); letter-spacing: .05em; }
.motion { font-family: var(--display); font-size: 19px; color: var(--bone); border-left: 2px solid var(--ember); padding-left: 10px; margin: 8px 0; }
.muted { color: var(--dust); }
.chat { display: flex; flex-direction: column; gap: 8px; }
.chat .me { align-self: flex-end; background: var(--ash-2); padding: 6px 10px; border-radius: 10px 10px 2px 10px; max-width: 85%; }
.chat .them { max-width: 92%; }
.slab-foot { display: flex; flex-wrap: wrap; gap: 8px; padding: 10px 18px 14px; border-top: 1px solid var(--ash-2); }
button { font: inherit; font-family: var(--caps); letter-spacing: .05em; font-size: 14px; color: var(--bone); background: var(--ash-2); border: 1px solid #4a3c35; border-radius: 9px; padding: 9px 14px; cursor: pointer; min-height: 40px; }
button:hover { border-color: var(--gold); }
button:focus-visible, input:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
button.primary { background: var(--ember); border-color: var(--ember); color: #1c0d05; }
button.primary:hover { filter: brightness(1.08); }
button.aye { background: #2f4a25; border-color: var(--pasture); }
button.nay { background: #4d2420; border-color: var(--blood); }
button:disabled { opacity: .45; cursor: default; }
.say { display: flex; gap: 8px; width: 100%; }
.say input { flex: 1; min-width: 0; font: inherit; color: var(--bone); background: var(--basalt); border: 1px solid #4a3c35; border-radius: 9px; padding: 9px 12px; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; margin: 8px 0; }
.grid button { text-align: left; font-family: var(--body); letter-spacing: 0; display: flex; flex-direction: column; gap: 2px; }
.grid button strong { font-family: var(--caps); font-weight: 400; letter-spacing: .04em; }
.grid button em { font-style: normal; font-size: 13px; color: var(--dust); }
.tally { display: grid; grid-template-columns: auto 1fr; gap: 4px 12px; font-size: 15px; margin: 8px 0; }
.tally .v { font-family: var(--caps); }
.v.aye { color: var(--pasture); } .v.nay { color: var(--blood); } .v.abstain { color: var(--dust); }
.chips { display: flex; gap: 6px; flex-wrap: wrap; }
.bar { height: 6px; background: var(--ash-2); border-radius: 3px; overflow: hidden; width: 100%; margin-top: 3px; }
.bar i { display: block; height: 100%; background: var(--gold); }
.thinking::after { content: "…"; animation: dots 1.2s steps(4) infinite; display: inline-block; width: 1.2em; overflow: hidden; vertical-align: bottom; }
@keyframes dots { from { width: 0; } to { width: 1.2em; } }
.title-card { text-align: center; padding: 18px 18px 6px; }
.title-card h1 { font-family: var(--display); font-weight: 400; font-size: clamp(30px, 8vw, 46px); margin: 0; letter-spacing: .02em; text-wrap: balance; }
.title-card .sub { font-family: var(--caps); color: var(--gold); letter-spacing: .14em; font-size: 12px; }
.voice { font-size: 13px; color: var(--dust); }
@media (prefers-reduced-motion: reduce) { .thinking::after { animation: none; width: 1.2em; } }
@media (min-width: 900px) { .slab { max-height: 46vh; } }
</style>

<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
<script>
"use strict";
// =====================================================================================================
// The people and the realms
// =====================================================================================================
const REALMS = {
  E: { name: "the Empire", short: "Empire", robe: 0x7a1f2b, trim: 0xd8a84a },
  L: { name: "Lucerna", short: "Lucerna", robe: 0x2d4f8a, trim: 0xe0c070 },
  V: { name: "Velithra", short: "Velithra", robe: 0xd98fae, trim: 0xf4e7ef },
  K: { name: "Karst Odun", short: "Karst Odun", robe: 0x5d6a74, trim: 0xb9c3c9 },
  D: { name: "Khar-Dumeth", short: "Khar-Dumeth", robe: 0x8a5a24, trim: 0x3b2a18 },
  T: { name: "Tor-Ilun", short: "Tor-Ilun", robe: 0xb4532c, trim: 0xe8b36a },
  M: { name: "Meridia", short: "Meridia", robe: 0x1f7a7a, trim: 0xe7f2ee },
  P: { name: "Vaccaria", short: "Vaccaria", robe: 0x3f6b2e, trim: 0xd8a84a },
};
const ORDER = ["E", "L", "V", "K", "D", "T", "M", "P"];   // order of precedence; Vaccaria last
const PEOPLE = {
  E: { who: "Aurex", full: "Emperor Aurex IV Valerran", head: "human", skin: 0xc79a78, crown: "laurel",
       persona: "Old, patient, dry, utterly sure of his authority. Speaks last and briefly. Keeps the client realms divided and paying; keeps the Legions fed.",
       aye: "The Throne finds merit in this. Let it be weighed with care, and voted with loyalty.",
       nay: "This council forgets whose fire warms it. The Throne does not favour this motion." },
  L: { who: "Marcellan", full: "King Marcellan Dorr of Lucerna", head: "human", skin: 0xe2b896, crown: "crown",
       persona: "Jovial, expansive, greedy; all warmth on the surface and hungry for Vaccaria's pastures underneath. Calls the Prince 'neighbour'.",
       aye: "Friends, friends! This is good for trade, good for roads, good for Lucerna. And for my neighbours, naturally.",
       nay: "I love a bold idea, but Lucerna's coffers are not a well for every bucket. I cannot support it." },
  V: { who: "Ilsaveth", full: "Queen Ilsaveth Anorai of Velithra", head: "cat", skin: 0xe9e4da, spots: true, crown: "circlet",
       persona: "Elegant, witty snow-leopard merchant queen; condescending and playful, always calculating; wants free trade and influence on every side.",
       aye: "How refreshing. A motion that even a merchant can love. Velithra approves.",
       nay: "Charming. Truly. But Velithra did not grow rich by agreeing with charming things." },
  K: { who: "Oduvar", full: "King Oduvar Brunnhak of Karst Odun", head: "badger", skin: 0x3a3634, crown: "iron",
       persona: "Taciturn badger-folk mountain king; honest, stubborn, few words; sells steel to the Legions and wants to be left alone.",
       aye: "Hm. It is sound. Karst Odun stands for it.",
       nay: "No. The mountains see no profit in this, and no honour." },
  D: { who: "Thrask", full: "King Thrask Ur-Vashen of Khar-Dumeth", head: "croc", skin: 0x5f7a3a, crown: "spikes",
       persona: "Loud, proud crocodile-folk warrior king; bullies and boasts but keeps his word to allies; hates the Imperial tax assessors and wants the client kings to stand together.",
       aye: "At last, a motion with teeth! Khar-Dumeth roars for it, and so should every king who is tired of being bled!",
       nay: "Another chain dressed as a gift. Khar-Dumeth will not bow to it, and neither should any of you!" },
  T: { who: "Vashka", full: "Queen Vashka of Tor-Ilun", head: "gecko", skin: 0x6fa59b, crown: "band",
       persona: "Dry, patient, unsentimental gecko-folk desert queen; bargains hard, wastes no words; wants fair copper prices and less Imperial meddling.",
       aye: "The desert does not waste water, and I do not waste words. Tor-Ilun votes for it.",
       nay: "Tor-Ilun has heard this song before. It ends with our copper in someone else's purse." },
  M: { who: "Halvana", full: "Governor Halvana Pryce of Meridia", head: "human", skin: 0x9a6a4a, crown: "cap",
       persona: "Correct, careful Imperial governor of the southern isles; loyal to the Throne but quietly favours her islanders; cares about sea lanes and grain trade.",
       aye: "Meridia finds this prudent, and in the Throne's interest. The isles support it.",
       nay: "With respect to the council, the isles see more risk here than reward." },
  P: { who: "You", full: "the Prince of Vaccaria", head: "cow", skin: 0xf2efe8, crown: "prince" },
};

// motions: who proposes, how each realm leans (-1 against .. +1 for), and what passing does to Vaccaria
const MOTIONS = [
  { id: "tribute_up", text: "Raise the Imperial tribute by a tenth", by: "E", lean: { E: .9, L: -.3, V: -.4, K: -.2, D: -.9, T: -.6, M: .3 },
    pass: { tribute: 4, favourIfAye: 6 }, note: "Tribute rises by 4 gold a season." },
  { id: "tribute_down", text: "Cut the tribute paid by the client kingdoms", by: "D", lean: { E: -.9, L: .4, V: .3, K: .3, D: .9, T: .6, M: -.2 },
    pass: { tribute: -4, favourIfAye: -6 }, note: "Tribute falls by 4 gold a season. The Throne remembers who voted for it." },
  { id: "levies", text: "Raise new auxiliary levies for the Khar border", by: "E", lean: { E: .8, L: -.2, V: -.5, K: .5, D: -.8, T: -.1, M: .2 },
    pass: { grain: -20, favourIfAye: 5 }, note: "Every realm sends levies: Vaccaria loses 20 grain feeding them." },
  { id: "road", text: "Build a road from Lucerna to Vaccaria at the Treasury's expense", by: "L", lean: { E: -.3, L: .9, V: -.1, K: .1, D: -.2, T: -.3, M: -.1 },
    pass: { income: 4, att: { L: 10 } }, note: "Trade flows: +4 gold a season. Lucerna's merchants, and nobles, come closer." },
  { id: "sealanes", text: "Guarantee open sea lanes to the southern isles", by: "M", lean: { E: .2, L: .1, V: .6, K: -.1, D: -.3, T: 0, M: .9 },
    pass: { gold: 10 }, note: "Grain sells abroad: +10 gold." },
  { id: "copper", text: "Fix the price of copper across the Empire", by: "T", lean: { E: -.2, L: -.1, V: -.6, K: .3, D: .2, T: .9, M: -.1 },
    pass: { gold: -8 }, note: "Tools and coin cost more: -8 gold." },
  { id: "steel", text: "Grant Karst Odun the sole contract to arm the Legions", by: "K", lean: { E: .1, L: -.4, V: -.3, K: .9, D: -.5, T: -.2, M: 0 },
    pass: {}, note: "No direct effect on Vaccaria, but Karst Odun grows richer." },
  { id: "harbours", text: "Open Velithra's harbours to every realm free of duty", by: "V", lean: { E: -.3, L: .3, V: .8, K: .2, D: .1, T: .2, M: -.4 },
    pass: { income: 3 }, note: "Cheaper trade: +3 gold a season." },
  { id: "grain_buy", text: "Buy Vaccarian grain for the Legions at a fixed price", by: "E", lean: { E: .6, L: .2, V: -.1, K: .1, D: -.3, T: 0, M: -.3 },
    pass: { grain: -25, gold: 30, favourIfAye: 4 }, note: "The Legions take 25 grain and pay 30 gold." },
];
const OWN_MOTIONS = [
  { id: "small_levies", text: "Exempt the small realms from the frontier levies", by: "P", cost: 10, lean: { E: -.6, L: .1, V: .2, K: -.1, D: .3, T: .3, M: 0 },
    pass: { grainIncome: 8, favour: -6 }, note: "+8 grain a season, but the Throne is displeased." },
  { id: "grain_board", text: "Grant Vaccaria a seat on the Imperial grain board", by: "P", cost: 10, lean: { E: -.1, L: -.3, V: 0, K: 0, D: 0, T: 0, M: -.4 },
    pass: { influence: 15, income: 5 }, note: "+15 influence and +5 gold a season." },
  { id: "kingdom", text: "Raise the Principality of Vaccaria to a Kingdom", by: "P", cost: 20, needs: 60, lean: { E: -.5, L: -.7, V: -.2, K: 0, D: .1, T: -.1, M: -.3 },
    pass: { crown: true }, note: "Vaccaria becomes a Kingdom." },
];
const ALL_MOTIONS = [...MOTIONS, ...OWN_MOTIONS];
const WORLD = `The Empire is ruled by Emperor Aurex IV Valerran from a palace carved into the caldera of a great volcano, where the Imperial Council of client realms meets around a basalt table, each representative seated on a cushion. Realms: the Empire; Lucerna (rich lowlands, Vaccaria's eastern neighbour, King Marcellan); Velithra (merchant north, Queen Ilsaveth); Karst Odun (mountain smiths, King Oduvar); Khar-Dumeth (warrior river kingdom, King Thrask); Tor-Ilun (copper deserts, Queen Vashka); Meridia (southern isles, Governor Halvana); and the small Principality of Vaccaria, a realm of cow-folk with green hills and rich granaries, whose young Prince is the player. No modern ideas, no mention of games or AI.`;

// =====================================================================================================
// The game state
// =====================================================================================================
const fresh = () => ({ season: 1, gold: 60, grain: 80, influence: 20, favour: 20, tribute: 12, income: 22, grainIncome: 25,
  att: { E: 5, L: 15, V: 0, K: 10, D: 15, T: 0, M: 5 }, promises: {}, theirPromise: {}, chronicle: [], motion: null, audiences: 2,
  kingdom: false, over: null, used: [] });
let G = fresh();
let prev = null;   // stats before the last change, for the little deltas

// saving: the viewer's own Claude storage when available, the browser otherwise
let store = null;
async function initStore() {
  try {
    const [db, user] = await Promise.all([window.claude?.use("db"), window.claude?.use("user")]);
    if (db && user) { const id = await user.id(); if (id) store = db.doc(`data/users/${id}/save`); }
  } catch (e) { store = null; }
}
async function save() {
  const data = JSON.stringify(G);
  try { localStorage.setItem("caldera-council", data); } catch (e) { }
  if (store) { try { await store.set({ game: data }); } catch (e) { } }
}
async function load() {
  if (store) { try { const s = await store.get(); if (s.exists && s.data().game) return JSON.parse(s.data().game); } catch (e) { } }
  try { const v = localStorage.getItem("caldera-council"); if (v) return JSON.parse(v); } catch (e) { }
  return null;
}

// Claude gives the court its voice when the page can ask
let sample = null, voices = true;
async function initVoices() { try { sample = await window.claude?.use("sample"); } catch (e) { sample = null; } }
const live = () => !!sample && voices;
function voiceOff(e) {
  if (e && (e.code === "not_granted" || e.code === "sampling_disabled" || e.code === "capability_disabled")) voices = false;
}
function personaText(k) {
  const p = PEOPLE[k];
  return `${p.full}. ${p.persona} Attitude to the Prince: ${G.att[k]} (-100 hostile .. 100 devoted).`;
}
function recentChronicle() {
  return G.chronicle.slice(-5).map((c) => `Season ${c.season}: "${c.text}" ${c.outcome}; Vaccaria voted ${c.prince}.`).join(" ") || "None yet.";
}

// =====================================================================================================
// The chamber (three.js, low poly)
// =====================================================================================================
const stage = document.getElementById("stage");
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
stage.appendChild(renderer.domElement);
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x120c0a);
scene.fog = new THREE.Fog(0x120c0a, 14, 34);
const camera = new THREE.PerspectiveCamera(45, 1, 0.1, 100);
const flat = (color, extra = {}) => new THREE.MeshStandardMaterial({ color, flatShading: true, roughness: .85, metalness: 0, ...extra });

scene.add(new THREE.HemisphereLight(0xffb27a, 0x1a0d08, .55));
const lavaLight = new THREE.PointLight(0xff5a1a, 60, 30, 1.6); lavaLight.position.set(0, -1, -9); scene.add(lavaLight);
const brazier = [];
const key = new THREE.DirectionalLight(0xffd2a6, .9); key.position.set(4, 10, 6); key.castShadow = true;
key.shadow.mapSize.set(1024, 1024); Object.assign(key.shadow.camera, { left: -8, right: 8, top: 8, bottom: -8 }); scene.add(key);
const spot = new THREE.SpotLight(0xffe2b0, 0, 12, .45, .6, 1); spot.position.set(0, 8, 0); scene.add(spot); scene.add(spot.target);

// the caldera: a ring of jagged basalt, a floor, and lava glowing through a great rent in the wall
(function chamber() {
  const floor = new THREE.Mesh(new THREE.CylinderGeometry(9, 9, .4, 10), flat(0x2b2220)); floor.position.y = -.2; floor.receiveShadow = true; scene.add(floor);
  const dais = new THREE.Mesh(new THREE.CylinderGeometry(5.6, 5.9, .25, 10), flat(0x3a2e29)); dais.position.y = .12; dais.receiveShadow = true; scene.add(dais);
  const wallG = new THREE.CylinderGeometry(13, 15, 16, 22, 4, true);
  const pos = wallG.attributes.position;
  for (let i = 0; i < pos.count; i++) {
    const x = pos.getX(i), z = pos.getZ(i), y = pos.getY(i), a = Math.atan2(z, x);
    const jag = 1 + (Math.sin(a * 7 + y) * .06 + Math.sin(a * 13) * .04);
    pos.setX(i, x * jag); pos.setZ(i, z * jag);
  }
  wallG.computeVertexNormals();
  const wall = new THREE.Mesh(wallG, flat(0x1d1513, { side: THREE.BackSide })); wall.position.y = 6; scene.add(wall);
  // lava river beyond the arches
  const lava = new THREE.Mesh(new THREE.CylinderGeometry(12, 12, .2, 22, 1, true, Math.PI * .35, Math.PI * .3), new THREE.MeshBasicMaterial({ color: 0xff6a1a, side: THREE.DoubleSide }));
  const lavaPool = new THREE.Mesh(new THREE.RingGeometry(9.2, 12.8, 22, 1), new THREE.MeshBasicMaterial({ color: 0xff5512 }));
  lavaPool.rotation.x = -Math.PI / 2; lavaPool.position.y = -.6; scene.add(lavaPool);
  // pillars
  for (let i = 0; i < 10; i++) {
    const a = i / 10 * Math.PI * 2 + .3;
    const col = new THREE.Mesh(new THREE.CylinderGeometry(.45, .55, 9, 6), flat(0x3d302a));
    col.position.set(Math.cos(a) * 8.4, 4.3, Math.sin(a) * 8.4); col.castShadow = true; scene.add(col);
    const cap = new THREE.Mesh(new THREE.BoxGeometry(1.4, .4, 1.4), flat(0x4a3a32)); cap.position.set(col.position.x, 8.9, col.position.z); scene.add(cap);
    if (i % 2 === 0) {
      const bowl = new THREE.Mesh(new THREE.CylinderGeometry(.45, .2, .5, 6), flat(0x5a4632)); bowl.position.set(Math.cos(a) * 7.4, 1.5, Math.sin(a) * 7.4); scene.add(bowl);
      const fire = new THREE.Mesh(new THREE.ConeGeometry(.3, .7, 5), new THREE.MeshBasicMaterial({ color: 0xffa040 })); fire.position.set(bowl.position.x, 2.05, bowl.position.z); scene.add(fire);
      const l = new THREE.PointLight(0xff8a3a, 6, 7, 2); l.position.set(bowl.position.x, 2.4, bowl.position.z); scene.add(l);
      brazier.push({ fire, l, seed: i });
    }
  }
  // the table: an octagon of basalt with a gold-inlaid map of the realms
  const table = new THREE.Mesh(new THREE.CylinderGeometry(2.6, 2.6, .28, 8), flat(0x2a211e)); table.position.y = .95; table.castShadow = true; table.receiveShadow = true; scene.add(table);
  const leg = new THREE.Mesh(new THREE.CylinderGeometry(.8, 1.2, .75, 8), flat(0x231b18)); leg.position.y = .5; scene.add(leg);
  const inlay = new THREE.Mesh(new THREE.CylinderGeometry(1.9, 1.9, .02, 8), flat(0x8a6a2a, { metalness: .6, roughness: .4 })); inlay.position.y = 1.1; scene.add(inlay);
  const map = new THREE.Mesh(new THREE.CylinderGeometry(1.75, 1.75, .03, 8), flat(0x3d5a2d)); map.position.y = 1.11; scene.add(map);
  const volcano = new THREE.Mesh(new THREE.ConeGeometry(.35, .35, 6), flat(0x4a2a1a)); volcano.position.y = 1.29; scene.add(volcano);
  const crater = new THREE.Mesh(new THREE.ConeGeometry(.12, .08, 6), new THREE.MeshBasicMaterial({ color: 0xff6a1a })); crater.position.y = 1.43; crater.rotation.x = Math.PI; scene.add(crater);
  // the Emperor's raised seat

      turns.push({ text: e.code === "rate_limited" ? "(The court needs a moment. Try again shortly.)" : live() ? "(They fall silent. Try again.)" : "(The court's free voices are unavailable; use the choices below.)" });
    }
    busy = false; draw();
  }
  function leave() { setFocus(null); seasonStart(); }
  draw();
}

// ---------- the council ------------------------------------------------------------------------------
// how a realm leans on the current motion: its interest, its friendship with you, your words and its promises
const swayed = {};
function leaning(k, princeStance) {
  const m = ALL_MOTIONS.find((x) => x.id === G.motion);
  let s = m.lean[k] ?? 0;
  s += swayed[k] || 0;
  if (princeStance) s += (princeStance === "aye" ? 1 : -1) * G.att[k] / 100 * .6;
  return s;
}
async function council() {
  const m = ALL_MOTIONS.find((x) => x.id === G.motion);
  for (const k in swayed) delete swayed[k];
  const others = ORDER.filter((k) => k !== "P" && k !== "E");
  const speakers = m.by !== "P" && m.by !== "E" ? [m.by, ...others.filter((k) => k !== m.by)] : others;
  let lines = null;
  setFocus("E");
  screen({ title: "The council", small: m.text, body: `<p class="thinking">The council takes its seats</p>` });
  if (live()) {
    const prompt = `${WORLD}\n\nThe council is in session. The motion: "${m.text}" (proposed by ${m.by === "P" ? "the Prince of Vaccaria" : PEOPLE[m.by].full}). Recent decrees: ${recentChronicle()}\nThe speakers, in order, with their character and their stance (each must argue the stance given):\n` +
      ["E", ...speakers].map((k) => `- ${PEOPLE[k].who}: ${personaText(k)} Stance: ${leaning(k) > .2 ? "for" : leaning(k) < -.2 ? "against" : "undecided, weighing both sides"}.`).join("\n") +
      `\n\nWrite the debate. Aurex opens briefly (put the motion, invite debate, give no verdict). Then each other speaker in order speaks 1 to 3 sentences in character, arguing their realm's interest, sometimes answering earlier speakers by name. Plain spoken words, no stage directions. Answer only as JSON: {"speeches": [{"who": "Aurex", "text": "..."}, ...]}`;
    try {
      const r = await sample.json(prompt, { modelTier: "quick" });
      if (Array.isArray(r.speeches)) lines = r.speeches.filter((s) => s && s.text);
    } catch (e) { voiceOff(e); lines = null; }
  }
  const byName = Object.fromEntries(ORDER.map((k) => [PEOPLE[k].who, k]));
  const script = (lines && lines.length >= 3)
    ? lines.map((s) => ({ k: byName[s.who] || null, text: String(s.text) })).filter((s) => s.k && s.k !== "P")
    : [{ k: "E", text: `The council will hear the motion: ${m.text}. Let each realm speak in its turn.` }, ...speakers.map((k) => ({ k, text: leaning(k) >= 0 ? PEOPLE[k].aye : PEOPLE[k].nay }))];
  let i = 0;
  const next = () => {
    if (i >= script.length) return princeFloor(m);
    const s = script[i++];
    setFocus(s.k);
    screen({ title: PEOPLE[s.k].who, small: REALMS[s.k].name, body: `<p class="speech">${esc(s.text)}</p>`,
      foot: `<button class="primary" id="n">Continue</button><span class="muted" style="align-self:center">${i} of ${script.length}</span>` });
    on("n", next);
  };
  next();
}
function princeFloor(m) {
  setFocus("E");
  screen({ title: "The floor is yours", small: "Aurex turns to you",
    body: `<p class="speech"><span class="who">Aurex:</span> The council recognises the Prince of Vaccaria.</p><p class="motion">${esc(m.text)}</p>`,
    foot: `${live() ? `<form class="say" id="sayf"><input id="say" maxlength="500" placeholder="Address the council…" autocomplete="off"><button class="primary">Speak</button></form>` : ""}
      <div class="chips"><button id="for">Speak for it</button><button id="against">Speak against it</button><button id="yield">Yield the floor</button></div>` });
  const f = document.getElementById("sayf");
  if (f) f.onsubmit = (e) => { e.preventDefault(); const v = document.getElementById("say").value.trim(); if (v) address(m, v); };
  on("for", () => rhetoric(m, "aye")); on("against", () => rhetoric(m, "nay")); on("yield", () => vote(m));
}
function rhetoric(m, stance) {
  // a plain speech moves those who like you
  for (const k of ORDER) if (k !== "P") swayed[k] = (swayed[k] || 0) + (stance === "aye" ? 1 : -1) * Math.max(0, G.att[k]) / 100 * .5;
  const text = stance === "aye" ? "Vaccaria speaks for this motion. It serves the Empire, and it serves the small realms who feed it." : "Vaccaria speaks against this motion. The small realms cannot carry this weight, and the Empire is stronger when they prosper.";
  setFocus("P");
  screen({ title: "You", small: "Vaccaria", body: `<p class="speech">${text}</p><p class="muted">Those who think well of you lean your way.</p>`, foot: `<button class="primary" id="n">Call the vote</button>` });
  on("n", () => vote(m));
}
async function address(m, text) {
  setFocus("P");
  screen({ title: "You", small: "Vaccaria", body: `<p class="speech">${esc(text)}</p><p class="muted thinking">The council weighs your words</p>` });
  const prompt = `${WORLD}\n\nThe council debates: "${m.text}". Present: ` + ORDER.filter((k) => k !== "P").map((k) => `${PEOPLE[k].who} (${personaText(k)} Leaning: ${leaning(k) > .2 ? "for" : leaning(k) < -.2 ? "against" : "undecided"})`).join("; ") +
    `.\n\nThe Prince of Vaccaria addresses the council:\n"${text}"\n\nJudge how persuasive this is to each member, given their interests and their attitude to the Prince. Then pick at most two members who answer him aloud, each in 1 or 2 sentences in character. Answer only as JSON: {"shifts": {"Aurex": number from -0.5 (pushed against the motion) to 0.5 (pushed for it), ... one for each member}, "answers": [{"who": "...", "text": "..."}]}`;
  let answers = [];
  try {
    const r = await sample.json(prompt, { modelTier: "quick", cache: false });
    const byName = Object.fromEntries(ORDER.map((k) => [PEOPLE[k].who, k]));
    for (const [n, v] of Object.entries(r.shifts || {})) if (byName[n] && byName[n] !== "P") swayed[byName[n]] = (swayed[byName[n]] || 0) + clamp(Number(v) || 0, -.5, .5);
    answers = (r.answers || []).filter((a) => byName[a.who] && byName[a.who] !== "P").slice(0, 2).map((a) => ({ k: byName[a.who], text: String(a.text) }));
  } catch (e) { voiceOff(e); }
  let i = 0;
  const next = () => {
    if (i >= answers.length) return vote(m);
    const a = answers[i++]; setFocus(a.k);
    screen({ title: PEOPLE[a.k].who, small: `${REALMS[a.k].name} answers you`, body: `<p class="speech">${esc(a.text)}</p>`, foot: `<button class="primary" id="n">${i < answers.length ? "Continue" : "Call the vote"}</button>` });
    on("n", next);
  };
  if (!answers.length) { screen({ title: "You", small: "Vaccaria", body: `<p class="speech">${esc(text)}</p><p class="muted">The council murmurs.</p>`, foot: `<button class="primary" id="n">Call the vote</button>` }); on("n", () => vote(m)); }
  else next();
}
function vote(m) {
  setFocus("E");
  const promised = Object.entries(G.promises).map(([k, v]) => `${PEOPLE[k].who} (${v})`).join(", ");
  screen({ title: "The vote", small: "Aurex calls the question", body: `<p class="motion">${esc(m.text)}</p><p class="muted">If it passes: ${m.note}</p>${promised ? `<p>You promised your vote to ${promised}.</p>` : ""}<p>How does Vaccaria vote?</p>`,
    foot: `<button class="aye" id="aye">Aye</button><button class="nay" id="nay">Nay</button><button id="abs">Abstain</button>` });
  on("aye", () => decide(m, "aye")); on("nay", () => decide(m, "nay")); on("abs", () => decide(m, "abstain"));
}
function decide(m, prince) {
  const votes = {};
  for (const k of ORDER) {
    if (k === "P") { votes[k] = prince; continue; }
    if (G.theirPromise[k]) { votes[k] = G.theirPromise[k]; continue; }
    const s = leaning(k, prince === "abstain" ? null : prince);
    votes[k] = s > .15 ? "aye" : s < -.15 ? "nay" : "abstain";
  }
  const ayes = ORDER.filter((k) => votes[k] === "aye").length, nays = ORDER.filter((k) => votes[k] === "nay").length;
  let outcome = ayes > nays ? "passed" : "rejected", veto = false;
  // the Throne may overrule a motion that threatens it, unless the Prince stands high in its favour
  if (outcome === "passed" && (m.lean.E ?? 0) <= -.5 && votes.E !== "aye" && G.favour < (m.id === "kingdom" ? 50 : 35)) { outcome = "rejected"; veto = true; }
  // consequences
  const before = { ...G };
  const ch = { gold: 0, grain: 0, influence: 0, favour: 0 };
  if (outcome === "passed") {
    const e = m.pass;
    if (e.tribute) G.tribute += e.tribute;
    if (e.income) G.income += e.income;
    if (e.grainIncome) G.grainIncome += e.grainIncome;
    ch.gold += e.gold || 0; ch.grain += e.grain || 0; ch.influence += e.influence || 0; ch.favour += e.favour || 0;
    if (e.favourIfAye) ch.favour += prince === "aye" ? e.favourIfAye : prince === "nay" ? -Math.round(e.favourIfAye / 2) : 0;
    for (const [k, v] of Object.entries(e.att || {})) G.att[k] = clamp(G.att[k] + v, -100, 100);
    if (e.crown) G.kingdom = true;
  }
  const winner = outcome === "passed" ? "aye" : "nay";
  if (prince === winner) ch.influence += m.by === "P" ? 10 : 4;
  ch.favour += votes.E === prince && prince !== "abstain" ? 3 : prince !== "abstain" && votes.E !== "abstain" ? -3 : 0;
  // friendships and promises
  const notes = [];
  for (const k of ORDER) {
    if (k === "P") continue;
    let d = 0;
    if (prince !== "abstain" && votes[k] !== "abstain") d = votes[k] === prince ? 4 : -3;
    if (k === m.by) d *= 2;
    if (G.promises[k]) {
      if (G.promises[k] === prince) { d += 6; }
      else { d -= 25; notes.push(`${PEOPLE[k].who} will not forget that you broke your word.`); for (const o of ORDER) if (o !== "P" && o !== k) G.att[o] = clamp(G.att[o] - 4, -100, 100); }
    }
    G.att[k] = clamp(G.att[k] + d, -100, 100);
  }
  // the season turns: income, tribute and the granaries
  ch.gold += G.income - G.tribute; ch.grain += G.grainIncome - 10;
  G.chronicle.push({ season: G.season, text: m.text, outcome, prince, veto });
  G.used.push(m.id);
  bump(ch); prev = before;
  ledger();
  G.season++; G.motion = null;
  for (const k in swayed) delete swayed[k];
  if (G.kingdom) G.over = "crowned";
  else if (G.gold < 0) G.over = "bankrupt";
  else if (G.grain < 0) G.over = "famine";
  else if (G.favour <= -50) G.over = "deposed";
  save();
  const rows = ORDER.map((k) => `<span>${k === "P" ? "You" : PEOPLE[k].who} <span class="muted">· ${REALMS[k].short}</span></span><span class="v ${votes[k]}">${votes[k]}${G.theirPromise[k] && k !== "P" ? " (as promised)" : ""}</span>`).join("");
  const verdict = veto ? "The Emperor raises his hand. The Throne will not have it: the motion is set aside." : outcome === "passed" ? "Aurex inclines his head. So it is decreed." : "The motion fails. Aurex moves on without a word.";
  setFocus(outcome === "passed" ? (m.by === "P" ? "P" : m.by) : "E");
  screen({ title: outcome === "passed" ? "The motion passes" : "The motion fails", small: `${ayes} aye · ${nays} nay`,
    body: `<p class="motion">${esc(m.text)}</p><div class="tally">${rows}</div><p>${verdict}</p>${notes.map((n) => `<p class="down">${n}</p>`).join("")}<p class="muted">The season turns: ${G.income} gold income, ${G.tribute} gold tribute, ${G.grainIncome} grain harvested, 10 grain eaten.</p>`,
    foot: `<button class="primary" id="n">${G.over ? "The end of your reign" : "The next season"}</button>` });
  on("n", () => G.over ? ending() : seasonStart());
}
function ending() {
  const text = {
    crowned: ["Long live the King of Vaccaria", "The Emperor lays the circlet on your horns himself. The principality is a kingdom, and you are its first King."],
    bankrupt: ["The treasury is empty", "Vaccaria cannot pay its tribute. Imperial assessors arrive to run your principality for you."],
    famine: ["The granaries are bare", "Your people go hungry, and the hills empty. Lucerna's nobles move in to 'help'."],
    deposed: ["The Throne has had enough", "Praetorians escort you from the caldera. A more obliging cousin will rule Vaccaria."],
  }[G.over];
  setFocus(G.over === "crowned" ? "P" : "E");
  screen({ title: text[0], small: `After ${G.season - 1} seasons`, body: `<p class="speech">${text[1]}</p><p class="muted">Decrees passed in your reign: ${G.chronicle.filter((c) => c.outcome === "passed").length}. Friends at the table: ${ORDER.filter((k) => k !== "P" && G.att[k] >= 25).map((k) => PEOPLE[k].who).join(", ") || "none"}.</p>`,
    foot: `<button class="primary" id="n">Begin a new reign</button>` });
  on("n", () => { G = fresh(); prev = null; ledger(); save(); seasonStart(true); });
}

// =====================================================================================================
ledger();
Promise.all([initStore(), initVoices()]).finally(title);
</script>
