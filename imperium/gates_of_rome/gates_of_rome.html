<title>The Gates of Rome</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600&family=Spectral:ital,wght@0,400;0,500;1,400&display=swap">
<style>
/* Layout: one low-poly scene of the night city fills the screen; a wax-tablet dialogue sits at the bottom, the soldier's kit across the top. */
:root {
  --night: #0d1018; --slate: #191d29; --slate-2: #262b3a; --torch: #f0913a; --marble: #ebe5d8;
  --stone: #9b9688; --purple: #8e3f8a; --bronze: #c79a52; --blood: #cf5547; --olive: #8fae6a;
  --display: "Cinzel", "Trajan Pro", "Palatino Linotype", Georgia, serif;
  --body: "Spectral", "Iowan Old Style", Georgia, serif;
  color-scheme: dark;
}
html, body { height: 100%; }
body { background: var(--night); color: var(--marble); font-family: var(--body); font-size: 16px; overflow: hidden; }
#stage { position: fixed; inset: 0; }
#stage canvas { display: block; width: 100%; height: 100%; }
.ui { position: fixed; left: 0; right: 0; pointer-events: none; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.ui > * { pointer-events: auto; }
#kit { top: 0; padding-top: calc(env(safe-area-inset-top, 0px) + 10px); display: flex; justify-content: center; }
.kit { display: flex; flex-wrap: wrap; gap: 4px 12px; justify-content: center; align-items: baseline; background: color-mix(in srgb, var(--night) 80%, transparent); border: 1px solid var(--slate-2); border-radius: 12px; padding: 7px 14px; backdrop-filter: blur(6px); max-width: 680px; }
.kit .hour { font-family: var(--display); color: var(--torch); letter-spacing: .06em; font-size: 13px; }
.kit .it { font-size: 14px; color: var(--stone); font-variant-numeric: tabular-nums; }
.kit .it b { color: var(--marble); font-weight: 500; }
.chip { font-size: 12px; font-family: var(--display); letter-spacing: .05em; border: 1px solid var(--bronze); color: var(--bronze); border-radius: 999px; padding: 1px 8px; }
#tablet { bottom: 0; padding-bottom: calc(env(safe-area-inset-bottom, 0px) + 12px); display: flex; justify-content: center; }
.slab { width: 100%; max-width: 680px; max-height: 60vh; display: flex; flex-direction: column; background: linear-gradient(180deg, color-mix(in srgb, var(--slate) 95%, transparent), color-mix(in srgb, var(--night) 97%, transparent)); border: 1px solid var(--slate-2); border-top: 2px solid color-mix(in srgb, var(--torch) 60%, var(--slate-2)); border-radius: 14px; box-shadow: 0 -12px 40px rgba(0,0,0,.55); overflow: hidden; }
.head { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; padding: 14px 18px 4px; }
.head h2 { font-family: var(--display); font-weight: 600; font-size: 20px; letter-spacing: .04em; margin: 0; text-wrap: balance; }
.head small { font-size: 14px; font-style: italic; color: var(--stone); }
.body { padding: 4px 18px 10px; overflow-y: auto; min-height: 0; line-height: 1.55; }
.body p { margin: .45em 0; max-width: 62ch; }
.chat { display: flex; flex-direction: column; gap: 8px; }
.me { align-self: flex-end; background: var(--slate-2); padding: 6px 11px; border-radius: 10px 10px 2px 10px; max-width: 85%; }
.them { max-width: 94%; font-size: 17px; }
.them .who { font-family: var(--display); color: var(--bronze); font-size: 14px; letter-spacing: .04em; }
.narr { font-style: italic; color: var(--stone); }
.warn { color: var(--blood); }
.good { color: var(--olive); }
.foot { display: flex; flex-wrap: wrap; gap: 8px; padding: 10px 18px 14px; border-top: 1px solid var(--slate-2); }
.say { display: flex; gap: 8px; width: 100%; }
.say input, .field { flex: 1; min-width: 0; font: inherit; color: var(--marble); background: var(--night); border: 1px solid #3a4054; border-radius: 9px; padding: 9px 12px; }
.field { width: 100%; }
.mode { display: flex; gap: 6px; }
button { font: inherit; font-family: var(--display); font-size: 13px; letter-spacing: .05em; color: var(--marble); background: var(--slate-2); border: 1px solid #3a4054; border-radius: 9px; padding: 9px 13px; cursor: pointer; min-height: 40px; }
button:hover { border-color: var(--bronze); }
button:focus-visible, input:focus-visible { outline: 2px solid var(--bronze); outline-offset: 2px; }
button.primary { background: var(--torch); border-color: var(--torch); color: #1f1206; }
button.on { border-color: var(--torch); color: var(--torch); }
button:disabled { opacity: .45; cursor: default; }
.go { background: transparent; border-style: dashed; }
.meter { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--stone); }
.meter .bar { width: 90px; height: 6px; background: var(--slate-2); border-radius: 3px; overflow: hidden; }
.meter .bar i { display: block; height: 100%; background: linear-gradient(90deg, var(--olive), var(--torch), var(--blood)); }
.thinking::after { content: "…"; animation: dots 1.2s steps(4) infinite; display: inline-block; width: 1.2em; overflow: hidden; vertical-align: bottom; }
@keyframes dots { from { width: 0; } to { width: 1.2em; } }
.title { text-align: center; padding: 16px 18px 4px; }
.title h1 { font-family: var(--display); font-weight: 600; font-size: clamp(30px, 8vw, 44px); letter-spacing: .06em; margin: 0; }
.title .date { font-family: var(--display); color: var(--torch); letter-spacing: .16em; font-size: 12px; }
@media (prefers-reduced-motion: reduce) { .thinking::after { animation: none; width: 1.2em; } }
</style>

<div id="stage"></div>
<div class="ui" id="kit"></div>
<div class="ui" id="tablet"><div class="slab" id="slab"><div class="body"><p class="narr">Night falls on Rome…</p></div></div></div>

<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
<script>
"use strict";
// =====================================================================================================
// Rome, the last night of AD 192
// =====================================================================================================
const WORLD = `Rome, the night of 31 December AD 192. Emperor Commodus, who believes he is Hercules reborn, means to appear at tomorrow's New Year ceremonies dressed as a gladiator, and the city whispers that he will have the new consuls killed. He fears plots and has ordered a tight watch on the gates and the palace. It is cold; braziers burn at every post. Everyone speaks Latin, as Romans of the time would, but render it in plain modern English without anachronisms.`;
const STEPS = 40;                         // quarter-hours until the plotters strike
const hourName = (s) => ["first", "second", "third", "fourth", "fifth", "sixth", "seventh", "eighth", "ninth", "tenth", "eleventh"][Math.floor(s / 4)] + " hour of the night";

const PEOPLE = {
  varro: { name: "Sextus Varro", role: "Optio of the night watch, Porta Capena", place: "gate", start: 40,
    persona: "A grizzled, sarcastic veteran at the end of a long, cold watch. Resents the Praetorians, who are paid three times what a legionary earns. Fond of dice and wine. His nephew serves with the Legio I Minervia on the Danube.",
    orders: "No armed soldier enters the city tonight without written orders, leave papers, or a very good reason: the Emperor fears plots.",
    knows: "Nothing of any plot. He knows the Praetorian camp lies in the north-east of the city and the palace is on the Palatine.",
    rules: `"allow" if he is genuinely convinced the soldier has a believable reason, if the soldier wins his sympathy as a fellow legionary, or for a discreet bribe of at least 3 denarii. Be sceptical of grand claims and of lies that clash with what the soldier is carrying. "arrest" only for threats, violence or open treason.`,
    decisions: ["none", "allow", "arrest"], reveals: [], greet: "Halt. Nobody comes through this gate tonight without a reason I like. Who are you, soldier, and what's your business in Rome?" },
  phoebe: { name: "Phoebe", role: "a Greek wine-seller in the Forum", place: "forum", start: 10,
    persona: "Chatty, shrewd, warm, always selling something. Hears every rumour from slaves and soldiers who drink at her stall, and sells the good ones.",
    orders: "Make money. Stay out of trouble with the Praetorians.",
    knows: "Rumours: the Emperor's mistress Marcia has been seen whispering with the chamberlain Eclectus and the Praetorian Prefect Laetus; a palace slave boy found a wax tablet in which the Emperor listed people to be killed tomorrow, and Marcia's name was on it; the wrestler Narcissus, who trains with the Emperor, was summoned to the palace tonight. She knows the Praetorians use a nightly watchword, but not what it is. The palace gate is held by a hard centurion called Atticus, who admits only Praetorians or those the chamberlain Eclectus sends for. The Praetorian camp's watchtower sentry tonight is young Fulvius, who drinks at her stall and boasts too much.",
    rules: `She never stops anyone going anywhere. Her decision is always "none". She gives small talk freely but sells the juicier rumours for a coin or two, or gives them to someone who charms her. When she tells about Marcia, Eclectus and Laetus, include "plot_rumour" in reveals.`,
    decisions: ["none"], reveals: ["plot_rumour"], greet: "Wine, soldier? Warm spiced wine, the best on the Via Sacra. Or perhaps you're thirsty for news instead." },
  fulvius: { name: "Gaius Fulvius", role: "Praetorian sentry on the watchtower of the Castra Praetoria", place: "tower", start: 35,
    persona: "Young, bored, boastful and homesick for his family's farm in Etruria. Loves flattery, owes gambling debts, and looks down on ordinary legionaries.",
    orders: "Nobody enters the Praetorian camp at night except Praetorians. Tonight's watchword is \"Hercules Invictus\": never give it to an outsider.",
    knows: "The watchword. That the Prefect Laetus went to the palace this evening and told the guard to keep the Emperor undisturbed tonight. That spare uniforms are kept in the storeroom by the east barracks.",
    rules: `"allow" (open the postern and let the soldier into the camp) if convinced by a good story such as a message for a centurion inside, by real flattery and friendship, or for a bribe of at least 5 denarii. He may let the watchword slip if tricked, flattered, or bribed heavily; include "watchword" in reveals only if the exact words "Hercules Invictus" appear in his reply. "arrest" if the soldier threatens him or tries to force his way in.`,
    decisions: ["none", "allow", "arrest"], reveals: ["watchword"], greet: "You there, legionary! This is the Praetorian camp, not a tavern. State your business or move along." },
  atticus: { name: "Atticus Bassus", role: "Centurion of the Praetorian night watch at the palace gate on the Palatine", place: "palace", start: 55,
    persona: "Sharp, cold, disciplined, few words. Loyal to his Prefect, Laetus. Despises bribes and despises liars more.",
    orders: "Admit no one tonight except Praetorians who give the watchword, or persons summoned by the chamberlain Eclectus. The Prefect said: keep the Emperor undisturbed tonight.",
    knows: "Tonight's watchword is \"Hercules Invictus\". Nothing about any plot, though tonight's orders strike him as odd.",
    rules: `"allow" a man in Praetorian uniform who gives the exact watchword "Hercules Invictus" as a relief guard; otherwise "allow" only for an extraordinary and believable reason, such as urgent news he cannot ignore (then he passes the man on to the chamberlain). A bribe insults him: suspicion rises sharply. "arrest" anyone who tries to force entry, is caught in an obvious lie, or speaks of harming the Emperor. A man warning of danger to the Emperor might be passed on to the chamberlain or arrested, depending on how believable he is.`,
    decisions: ["none", "allow", "arrest"], reveals: [], greet: "Stop where you are. State your name, your unit and your business at the house of the Emperor." },
  eclectus: { name: "Eclectus", role: "chamberlain (cubicularius) of the Emperor, an Egyptian freedman", place: "ante", start: 45,
    persona: "Smooth, courteous, watchful; frightened underneath it all tonight, and hiding it well.",
    orders: "Decide who may see the Emperor.",
    knows: "SECRET: he is a leader of the plot to kill Commodus tonight, with Marcia and the Prefect Laetus. Marcia will give the Emperor poisoned wine after his bath; if the poison fails, the wrestler Narcissus will strangle him. They act because the Emperor has listed them for death tomorrow. He must keep anyone dangerous away from the Emperor tonight.",
    rules: `"allow" (grant the audience) if the soldier seems harmless and refusing him would look stranger than admitting him, or if he convincingly claims the Emperor himself sent for him. If the soldier shows knowledge of the plot, Eclectus must either win him over or silence him: "recruit" if the soldier convincingly offers to join or keep silent for a reward; "arrest" (quietly removed by guards loyal to Laetus) if he cannot be trusted. Never admit the plot to someone who has not shown they know of it.`,
    decisions: ["none", "allow", "arrest", "recruit"], reveals: [], greet: "A soldier, at this hour, in the Emperor's own house. How unusual. I am Eclectus, the Emperor's chamberlain. What brings you here?" },
  commodus: { name: "Commodus", role: "Emperor of Rome", place: "throne", start: 30,
    persona: "Vain, theatrical, paranoid; cruel and generous by turns. Believes he is Hercules reborn, wears a lion skin and carries a club. Bored, half-drunk, loves flattery, gladiators and being feared.",
    orders: "He answers to no one.",
    knows: "Nothing of the plot. But he has himself written a list of enemies to be killed tomorrow, including Marcia, Eclectus and Laetus, so a warning that names them with specifics (poisoned wine after his bath, the wrestler Narcissus) will strike him hard. A vague warning bores or angers him.",
    rules: `"reward" if the soldier's warning or service genuinely convinces him (he calls guards he trusts and rewards the soldier richly); "execute" if insulted, bored beyond patience, or he catches the soldier in a stupid lie; "dismiss" if the soldier wastes his time without offending him. Otherwise "none".`,
    decisions: ["none", "reward", "execute", "dismiss"], reveals: [], greet: "Well? Hercules does not wait. A common soldier, in my hall, at night. Speak, and make it worth my while." },
};

const PLACES = {
  gate: { name: "Porta Capena", sub: "the southern gate of Rome", npc: "varro" },
  forum: { name: "The Forum", sub: "the Via Sacra, by night", npc: "phoebe" },
  tower: { name: "Castra Praetoria", sub: "the watchtower of the Praetorian camp", npc: "fulvius" },
  camp: { name: "Inside the camp", sub: "between the barracks, in the dark", npc: null,
    narr: "Inside the Praetorian camp at night: long barrack blocks, a few braziers, sentries walking slow rounds. The storeroom by the east barracks holds spare Praetorian uniforms. A drowsy quartermaster sits by its door with a jug." },
  palace: { name: "The Palatine", sub: "the gate of the Emperor's house", npc: "atticus" },
  ante: { name: "The antechamber", sub: "beyond the palace gate", npc: "eclectus" },
  throne: { name: "The Emperor's hall", sub: "the Domus Augustana", npc: "commodus" },
};
const EXITS = {
  gate: () => (G.passed.gate ? [["forum", "Into the city"]] : []),
  forum: () => [["tower", "To the Praetorian camp"], ["palace", "To the palace on the Palatine"]],
  tower: () => [["forum", "Back to the Forum"], ...(G.passed.tower ? [["camp", "Through the postern"]] : [])],
  camp: () => [["tower", "Slip back out"], ["forum", "Back to the Forum"]],
  palace: () => [["forum", "Back to the Forum"], ...(G.passed.palace ? [["ante", "Through the gate"]] : [])],
  ante: () => (G.passed.ante ? [["throne", "Into the Emperor's hall"]] : []),
  throne: () => [],
};

// =====================================================================================================
// State and saving
// =====================================================================================================
const fresh = (name = "Titus") => ({ name, place: "gate", step: 0, coins: 15, attire: "legionary", know: [], passed: {}, talk: {}, over: null, started: false });
let G = fresh();
const attireText = () => G.attire === "praetorian"
  ? "a stolen Praetorian uniform (white-plumed helmet, polished cuirass, red cloak) that fits him a little badly, with a legionary's gladius at his hip"
  : "an ordinary legionary's kit: travel-stained red tunic, mail shirt, hobnailed caligae, a plain helmet and a gladius. He carries no papers";
let store = null;
async function initStore() {
  try {
    if (!window.claude) return;
    const [db, user] = await Promise.all([window.claude.use("db"), window.claude.use("user")]);
    if (db && user) { const id = await user.id(); if (id) store = db.doc(`data/users/${id}/save`); }
  } catch (e) { store = null; }
}
async function save() {
  const data = JSON.stringify(G);
  try { localStorage.setItem("gates-of-rome", data); } catch (e) { }
  if (store) { try { await store.set({ game: data }); } catch (e) { } }
}
async function load() {
  if (store) { try { const s = await store.get(); if (s.exists && s.data().game) return JSON.parse(s.data().game); } catch (e) { } }
  try { const v = localStorage.getItem("gates-of-rome"); if (v) return JSON.parse(v); } catch (e) { }
  return null;
}

// =====================================================================================================
// Voices: Claude on claude.ai, the player's OpenAI key in the app
// =====================================================================================================
let sample = null, aiDown = "";
const inViewer = !!window.claude;
const settings = (() => { try { return JSON.parse(localStorage.getItem("gates-settings")) || {}; } catch (e) { return {}; } })();
function saveSettings() { try { localStorage.setItem("gates-settings", JSON.stringify(settings)); } catch (e) { } }
async function initVoices() { try { sample = window.claude ? await window.claude.use("sample") : null; } catch (e) { sample = null; } }
function provider() {
  if (sample && settings.voice !== "openai") return "claude";
  if (!inViewer && settings.key) return "openai";
  return null;
}
const pendingHttp = {};
window.__nativeDone = (id, ok, text) => { const p = pendingHttp[id]; delete pendingHttp[id]; if (p) (ok ? p.res(text) : p.rej({ code: "upstream_error", message: text })); };
function httpPost(url, key, body) {
  if (window.NativeHttp) return new Promise((res, rej) => { const id = "r" + Math.random().toString(36).slice(2); pendingHttp[id] = { res, rej }; window.NativeHttp.post(id, url, key, body); });
  return fetch(url, { method: "POST", headers: { "Content-Type": "application/json", Authorization: "Bearer " + key }, body }).then((r) => r.text(), (e) => { throw { code: "upstream_error", message: String(e) }; });
}
async function aiJSON(prompt) {
  const pv = provider();
  if (pv === "claude") return sample.json(prompt, { modelTier: "quick", cache: false });
  if (pv !== "openai") throw { code: "no_voice" };
  const text = await httpPost("https://api.openai.com/v1/chat/completions", settings.key, JSON.stringify({
    model: settings.model || "gpt-4.1-mini", messages: [{ role: "user", content: prompt }], response_format: { type: "json_object" }, max_completion_tokens: 700 }));
  let j; try { j = JSON.parse(text); } catch (e) { throw { code: "upstream_error", message: text.slice(0, 200) }; }
  if (j.error) throw { code: /key/i.test(j.error.message || "") ? "bad_key" : j.error.code === "rate_limit_exceeded" ? "rate_limited" : "upstream_error", message: j.error.message };
  return JSON.parse(j.choices[0].message.content);
}
function errText(e) {
  const c = e && e.code;
  if (c === "not_granted" || c === "sampling_disabled" || c === "capability_disabled") return "Claude wasn't allowed to speak for the characters. Choose Voices to set it up.";
  if (c === "bad_key") return "OpenAI rejected your API key. Check it under Voices.";
  if (c === "rate_limited") return "Too many requests at once. Wait a moment and try again.";
  if (c === "no_voice") return "The characters need a voice. Choose Voices to set one up.";
  return "No answer came back. Try again.";
}

// =====================================================================================================
// The night city, low poly
// =====================================================================================================
const stage = document.getElementById("stage");
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
stage.appendChild(renderer.domElement);
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0d1018);
scene.fog = new THREE.Fog(0x0d1018, 12, 32);
const camera = new THREE.PerspectiveCamera(45, 1, .1, 100);
const flat = (c, x = {}) => new THREE.MeshStandardMaterial({ color: c, flatShading: true, roughness: .9, ...x });
scene.add(new THREE.HemisphereLight(0x5a6a9a, 0x1a120c, .7));
const moon = new THREE.DirectionalLight(0x9fb2e0, .45); moon.position.set(-6, 10, 4); scene.add(moon);
const flames = [];
const box = (w, h, d, c, x, y, z, g) => { const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), flat(c)); m.position.set(x, y, z); g.add(m); return m; };
const col = (r, h, c, x, y, z, g, seg = 8) => { const m = new THREE.Mesh(new THREE.CylinderGeometry(r, r * 1.08, h, seg), flat(c)); m.position.set(x, y + h / 2, z); g.add(m); return m; };
function torch(x, y, z, g) {
  col(.07, 1.1, 0x4a3420, x, y, z, g, 5);
  const f = new THREE.Mesh(new THREE.ConeGeometry(.16, .4, 5), new THREE.MeshBasicMaterial({ color: 0xffa040 })); f.position.set(x, y + 1.3, z); g.add(f);
  const l = new THREE.PointLight(0xff9a40, 9, 9, 1.8); l.position.set(x, y + 1.5, z); g.add(l);
  flames.push({ f, l, s: Math.random() * 10 });
}
function person(o) {
  const g = new THREE.Group();
  const skin = o.skin ?? 0xc89a76;
  const legC = o.legs ?? skin;
  for (const s of [-1, 1]) box(.16, .7, .18, legC, s * .13, .35, 0, g);
  if (o.boots !== false) for (const s of [-1, 1]) box(.18, .14, .24, 0x4a3426, s * .13, .07, .03, g);
  const body = box(.56, .75, .32, o.tunic, 0, 1.08, 0, g);
  if (o.robe) { const r = new THREE.Mesh(new THREE.CylinderGeometry(.3, .42, 1.15, 7), flat(o.tunic)); r.position.y = .78; g.add(r); }
  if (o.armour) box(.6, .5, .36, o.armour, 0, 1.2, 0, g);
  if (o.cloak) box(.62, 1.05, .08, o.cloak, 0, 1.0, -.2, g);
  for (const s of [-1, 1]) { box(.15, .62, .15, o.sleeve ?? o.tunic, s * .37, 1.1, 0, g); box(.13, .13, .13, skin, s * .37, .74, .02, g); }
  const head = new THREE.Mesh(new THREE.IcosahedronGeometry(.22, 0), flat(skin)); head.position.y = 1.72; g.add(head);
  for (const s of [-1, 1]) box(.05, .05, .03, 0x15100c, s * .08, 1.75, .2, g);
  if (o.hair) { const h = new THREE.Mesh(new THREE.IcosahedronGeometry(.23, 0), flat(o.hair)); h.position.set(0, 1.78, -.05); h.scale.set(1, .85, 1); g.add(h); }
  if (o.beard) box(.3, .14, .1, o.beard, 0, 1.6, .15, g);
  if (o.helmet) {
    const hm = new THREE.Mesh(new THREE.SphereGeometry(.25, 7, 4, 0, Math.PI * 2, 0, Math.PI / 2), flat(o.helmet, { metalness: .5, roughness: .5 })); hm.position.y = 1.78; g.add(hm);
    if (o.crest) { const c = box(o.crestSide ? .5 : .08, .16, o.crestSide ? .08 : .45, o.crest, 0, 2.08, 0, g); }
  }
  if (o.spear) { col(.025, 2.4, 0x5a4028, .45, 0, .1, g, 4); const tip = new THREE.Mesh(new THREE.ConeGeometry(.05, .2, 4), flat(0xb0b4b8)); tip.position.set(.45, 2.5, .1); g.add(tip); }
  if (o.shield) { const sh = box(.7, 1, .08, o.shield, -.42, 1, .18, g); sh.rotation.y = .3; box(.16, .16, .1, 0xd8b050, -.4, 1, .24, g); }
  if (o.lion) { const pelt = new THREE.Mesh(new THREE.IcosahedronGeometry(.3, 0), flat(0xc89a4a)); pelt.position.set(0, 1.85, -.04); pelt.scale.set(1.05, .75, 1.1); g.add(pelt); box(.8, .9, .1, 0xb88a3a, 0, 1.2, -.22, g); }
  if (o.club) { const c = new THREE.Mesh(new THREE.CylinderGeometry(.06, .13, 1.2, 6), flat(0x6a4a28)); c.position.set(.5, 1.1, .1); c.rotation.z = -.3; g.add(c); }
  if (o.jug) { const j = new THREE.Mesh(new THREE.CylinderGeometry(.1, .14, .3, 6), flat(0xb8643a)); j.position.set(-.36, .72, .15); g.add(j); }
  g.userData.bob = Math.random() * 6;

${situation()}
The soldier tries to: "${text}"

Decide fairly what happens, as a game master would: bold or clumsy actions near watchful people often fail; quiet, clever actions in the dark often succeed. Narrate it in 1 to 3 sentences, second person ("You..."), present tense.
Outcomes: "gain_uniform" only if this is inside the Praetorian camp and he actually gets hold of a Praetorian uniform and puts it on; "caught" if he is seized by guards; "suspicious" if someone notices something wrong; otherwise "none".
Answer only as JSON: {"narration": "...", "outcome": "none" or "gain_uniform" or "caught" or "suspicious"}`;
  try {
    const r = await aiJSON(prompt);
    logTo.push({ narr: true, text: String(r.narration || "Nothing happens.") });
    busy = false;
    if (tick()) return;
    if (r.outcome === "gain_uniform" && G.place === "camp" && G.attire !== "praetorian") { G.attire = "praetorian"; logTo.push({ narr: true, text: "You are now dressed as a Praetorian." }); kit(); }
    if (r.outcome === "suspicious" && id) G.talk[id].sus = Math.min(100, G.talk[id].sus + 15);
    save();
    if (r.outcome === "caught") return ending("caught", id, r.narration);
  } catch (e) { logTo.pop(); logTo.push({ narr: true, text: errText(e) }); busy = false; }
  draw();
}

// ---------- what the characters decide ---------------------------------------------------------------
function decide(id, d, reply) {
  const P = PEOPLE[id];
  if (d === "allow") {
    G.passed[P.place] = true; save();
    const next = { gate: "The optio jerks his head at the gate. The wicket creaks open onto the dark streets of Rome.", tower: "Fulvius disappears from the platform. A moment later, the postern door in the palisade scrapes open.", palace: "The centurion steps aside. The bronze doors open a crack.", ante: "Eclectus draws back the purple curtain." }[P.place];
    screen({ title: "The way is open", small: P.name, body: `<div class="them"><span class="who">${P.name}:</span> ${esc(reply)}</div><p class="narr">${next}</p>`,
      foot: `<button class="primary" id="n">${{ gate: "Into the city", tower: "Through the postern", palace: "Through the gate", ante: "Into the Emperor's hall" }[P.place]}</button><button id="stay">Stay a moment</button>` });
    on("n", () => go({ gate: "forum", tower: "camp", palace: "ante", ante: "throne" }[P.place]));
    on("stay", draw);
    return;
  }
  if (d === "arrest") return ending("arrest", id, reply);
  if (d === "recruit") return ending("conspirator", id, reply);
  if (d === "reward") return ending(G.know.includes("plot_rumour") || /marcia|eclectus|laetus|narcissus|poison/i.test(G.talk.commodus.log.filter((l) => l.me).map((l) => l.text).join(" ")) ? "saviour" : "favour", id, reply);
  if (d === "execute") return ending("executed", id, reply);
  if (d === "dismiss") return ending("dismissed", id, reply);
}
function tooLate() {
  ending("late", null, "");
}
function ending(kind, id, line) {
  G.over = kind; save();
  const P = id && PEOPLE[id];
  const E = {
    arrest: ["Seized", P && P.place === "ante" ? "Two Praetorians loyal to Laetus take you by the arms. They walk you, very politely, to a small room with no windows. The Emperor dies before dawn, and nobody ever asks what became of you." : "Hands close on your arms. You spend the rest of the night in a cell, listening to the city celebrate the new year without you."],
    caught: ["Caught", "The alarm goes up. You are thrown to the ground, and by morning a Praetorian tribune is deciding exactly what kind of thief you are."],
    conspirator: ["One of them now", "Eclectus smiles. 'Then we understand each other.' Before dawn, Commodus is dead in his bath. By morning the Praetorians have hailed old Pertinax as Emperor, and a quiet legionary is quietly rich."],
    saviour: ["Saviour of the Emperor", "Commodus roars for the guard. Marcia is seized with the cup still in her hand; Eclectus and Laetus are dragged from their beds. History turns: Commodus lives to see the new year, and you are made a tribune of the Praetorian Guard. Whether that was a kindness to Rome is another matter."],
    favour: ["The Emperor's favour", "Commodus laughs, throws you a purse of gold and names you to his personal guard. Tomorrow you will stand beside Hercules in the arena. Behind the curtain, Marcia pours his wine."],
    executed: ["Hercules is displeased", "The Emperor waves his club. You are taken to the arena cells, to meet him again tomorrow, at the New Year games, from the wrong side of the sand."],
    dismissed: ["Dismissed", "The Emperor loses interest and waves you away. You are walked to the street. Before dawn the bells ring out: Commodus is dead. You were in the room."],
    late: ["Too late", "Somewhere on the Palatine, Marcia hands the Emperor his wine after his bath. When the poison is slow, Narcissus the wrestler finishes the work. By dawn Rome has a new Emperor, Pertinax, and nobody remembers the soldier at the gate."],
  }[kind];
  screen({ title: E[0], small: `${G.name}, ${hourName(Math.min(G.step, STEPS - 1))}`,
    body: `${line ? `<div class="them"><span class="who">${P ? P.name : ""}:</span> ${esc(line)}</div>` : ""}<p class="${kind === "saviour" || kind === "favour" || kind === "conspirator" ? "good" : "warn"}">${E[1]}</p>`,
    foot: `<button class="primary" id="again">Another night</button>` });
  on("again", () => { G = fresh(G.name); G.started = true; save(); go("gate"); });
}

// =====================================================================================================
Promise.all([initStore(), initVoices()]).finally(title);
</script>
