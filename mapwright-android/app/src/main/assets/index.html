<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Mapwright</title>
<style>
@font-face { font-family: "IM Fell English"; font-style: normal; font-weight: 400; src: url(fonts/fell.woff) format("woff"); }
@font-face { font-family: "IM Fell English"; font-style: italic; font-weight: 400; src: url(fonts/fell-italic.woff) format("woff"); }
@font-face { font-family: "IM Fell English SC"; font-style: normal; font-weight: 400; src: url(fonts/fell-sc.woff) format("woff"); }
@font-face { font-family: "Manrope"; font-style: normal; font-weight: 400; src: url(fonts/manrope-400.woff) format("woff"); }
@font-face { font-family: "Manrope"; font-style: normal; font-weight: 500; src: url(fonts/manrope-400.woff) format("woff"); }
@font-face { font-family: "Manrope"; font-style: normal; font-weight: 600; src: url(fonts/manrope-600.woff) format("woff"); }
@font-face { font-family: "Manrope"; font-style: normal; font-weight: 700; src: url(fonts/manrope-700.woff) format("woff"); }
body { margin: 0; -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; }
input { -webkit-user-select: text; user-select: text; }
[hidden] { display: none !important; }
</style>
<style>
/* Layout: a cartographer's desk. Tool rail on the left, the sheet in the middle, a properties drawer on the right.
   On phones the rail moves to the bottom and the drawer becomes a sheet above it.
   Deliberately single-theme: dark green-black chrome so the parchment is the brightest thing on screen. */
:root {
  --desk: #171c19;      /* page ground */
  --panel: #1f2622;     /* rails and drawer */
  --raise: #2a332e;     /* inputs, hover */
  --line: #38433c;
  --fg: #ebe5d4;
  --muted: #9da496;
  --brass: #d4ab5c;     /* the one accent */
  --brass-ink: #251a05;
  --danger: #e2876b;
  --ui: "Manrope", system-ui, -apple-system, sans-serif;
  --map: "IM Fell English", "Iowan Old Style", Georgia, serif;
  --map-sc: "IM Fell English SC", "Iowan Old Style", Georgia, serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { background: var(--desk); color: var(--fg); font-family: var(--ui); font-size: 13px; overflow: hidden; }
button, input, select { font: inherit; color: inherit; }
button { background: none; border: 0; cursor: pointer; }
button:focus-visible, input:focus-visible, select:focus-visible { outline: 2px solid var(--brass); outline-offset: 2px; border-radius: 6px; }
svg { display: block; }

.app { height: 100%; display: grid; grid-template-columns: 56px minmax(0, 1fr) 272px; grid-template-rows: 52px minmax(0, 1fr); }
.top { grid-column: 1 / -1; display: flex; align-items: center; gap: 8px; background: var(--panel); border-bottom: 1px solid var(--line);
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); min-width: 0; }
.brand { font-family: var(--map-sc); font-size: 21px; letter-spacing: .06em; color: var(--brass); margin-right: 8px; white-space: nowrap; }
.mapsel { display: flex; align-items: center; gap: 4px; min-width: 110px; flex: 0 1 280px; }
.mapsel select, .mapsel input { background: var(--raise); border: 1px solid var(--line); border-radius: 8px; padding: 6px 8px; min-width: 0; width: 100%; }
.spacer { flex: 1; }
.tb { display: inline-flex; align-items: center; gap: 6px; padding: 7px 10px; border-radius: 8px; color: var(--muted); font-weight: 600; white-space: nowrap; }
.tb:hover { color: var(--fg); background: var(--raise); }
.tb:disabled { opacity: .35; cursor: default; background: none; }
.tb.primary { background: var(--brass); color: var(--brass-ink); }
.tb.primary:hover { filter: brightness(1.07); }
.status { color: var(--muted); font-size: 12px; white-space: nowrap; }
.status.warn { color: var(--danger); }

.rail { background: var(--panel); border-right: 1px solid var(--line); display: flex; flex-direction: column; align-items: center; gap: 4px; padding-block: 10px; }
.rail button { width: 40px; height: 40px; border-radius: 10px; display: grid; place-items: center; color: var(--muted); position: relative; }
.rail button:hover { color: var(--fg); background: var(--raise); }
.rail button[aria-pressed="true"] { color: var(--brass-ink); background: var(--brass); }
.rail .sep { width: 24px; height: 1px; background: var(--line); margin: 4px 0; }

.stage { position: relative; min-width: 0; min-height: 0; overflow: hidden; background: radial-gradient(ellipse at center, #222a25 0%, var(--desk) 70%); touch-action: none; }
#cv { position: absolute; inset: 0; width: 100%; height: 100%; }
.hint { position: absolute; left: 12px; bottom: 12px; background: #171c19d9; border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px; color: var(--muted); font-size: 12px; pointer-events: none; max-width: calc(100% - 24px); }
.zoom { position: absolute; right: 12px; bottom: 12px; display: flex; gap: 2px; background: #171c19d9; border: 1px solid var(--line); border-radius: 8px; padding: 2px; }
.zoom button { width: 32px; height: 30px; border-radius: 6px; color: var(--muted); font-weight: 700; }
.zoom button:hover { color: var(--fg); background: var(--raise); }
.banner { position: absolute; left: 50%; top: 12px; transform: translateX(-50%); background: var(--panel); border: 1px solid var(--brass); color: var(--fg); border-radius: 999px; padding: 6px 14px; font-size: 12px; white-space: nowrap; max-width: calc(100% - 24px); overflow: hidden; text-overflow: ellipsis; }

.drawer { background: var(--panel); border-left: 1px solid var(--line); overflow-y: auto; min-height: 0; padding: 14px 14px 24px; display: flex; flex-direction: column; gap: 18px; }
.drawer h3 { margin: 0 0 8px; font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); font-weight: 700; }
.drawer section { display: flex; flex-direction: column; gap: 8px; }
.drawer .tname { font-family: var(--map); font-size: 20px; color: var(--fg); margin: 0; }
.drawer p { margin: 0; color: var(--muted); line-height: 1.45; }
.row { display: flex; align-items: center; gap: 8px; }
.row label { flex: 0 0 64px; color: var(--muted); }
.row input[type=range] { flex: 1; accent-color: var(--brass); min-width: 0; }
.row .val { width: 36px; text-align: right; color: var(--muted); font-variant-numeric: tabular-nums; }
.field { background: var(--raise); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; width: 100%; }
.seg { display: flex; background: var(--raise); border: 1px solid var(--line); border-radius: 9px; padding: 2px; gap: 2px; }
.seg button { flex: 1; padding: 6px 4px; border-radius: 7px; color: var(--muted); font-weight: 600; }
.seg button[aria-pressed="true"] { background: var(--brass); color: var(--brass-ink); }
.stamps { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; }
.stamps button { aspect-ratio: 1; border-radius: 8px; background: #efe3c4; border: 2px solid transparent; display: grid; place-items: center; padding: 2px; }
.stamps button[aria-pressed="true"] { border-color: var(--brass); box-shadow: 0 0 0 2px var(--brass); }
.stamps canvas { width: 100%; height: 100%; }
.stampname { color: var(--fg); font-weight: 600; }
.check { display: flex; align-items: center; gap: 8px; color: var(--fg); cursor: pointer; }
.check input { accent-color: var(--brass); width: 16px; height: 16px; }
.btnrow { display: flex; gap: 6px; flex-wrap: wrap; }
.btn { padding: 8px 12px; border-radius: 8px; background: var(--raise); border: 1px solid var(--line); font-weight: 600; }
.btn:hover { border-color: var(--muted); }
.btn.danger { color: var(--danger); }
.btn.armed { background: var(--danger); color: #1b0d07; border-color: var(--danger); }
kbd { font-family: var(--ui); font-size: 11px; background: var(--raise); border: 1px solid var(--line); border-radius: 4px; padding: 0 4px; color: var(--muted); }

.menu { position: fixed; z-index: 50; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 6px; min-width: 220px; box-shadow: 0 18px 40px -12px #000; display: grid; }
.menu button { text-align: left; padding: 9px 10px; border-radius: 6px; }
.menu button:hover { background: var(--raise); }
.menu small { display: block; color: var(--muted); font-size: 11px; }
.menu .sep { height: 1px; background: var(--line); margin: 4px 0; }

@media (max-width: 760px) {
  .app { grid-template-columns: minmax(0, 1fr); grid-template-rows: 50px minmax(0, 1fr) auto calc(56px + env(safe-area-inset-bottom, 0px)); }
  .brand { display: none; }
  .top .tb .lbl { display: none; }
  .rail { grid-row: 4; flex-direction: row; justify-content: space-around; border-right: 0; border-top: 1px solid var(--line); padding: 6px max(8px, env(safe-area-inset-right, 0px)) env(safe-area-inset-bottom, 0px) max(8px, env(safe-area-inset-left, 0px)); overflow-x: auto; }
  .rail .sep { display: none; }
  .stage { grid-row: 2; }
  .drawer { grid-row: 3; border-left: 0; border-top: 1px solid var(--line); max-height: 38vh; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
  .drawer.collapsed { display: none; }
  .stamps { grid-template-columns: repeat(7, 1fr); }
  .hint { display: none; }
  .mapsel { flex: 1 1 auto; }
  .status { max-width: 28vw; overflow: hidden; text-overflow: ellipsis; font-size: 11px; }
  .top .spacer { display: none; }
}
</style>

</head>
<body>
<div class="app" id="app">
  <header class="top">
    <div class="brand">Mapwright</div>
    <div class="mapsel">
      <select id="mapSelect" aria-label="Open map"></select>
      <input id="mapName" type="text" aria-label="Map name" maxlength="80" hidden>
    </div>
    <button class="tb" id="mapMenuBtn" title="New, rename or delete maps"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg><span class="lbl">Map</span></button>
    <div class="spacer"></div>
    <span class="status" id="status"></span>
    <button class="tb" id="undoBtn" title="Undo (Ctrl+Z)"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 14 4 9l5-5"/><path d="M4 9h11a5 5 0 0 1 0 10h-3"/></svg></button>
    <button class="tb" id="redoBtn" title="Redo (Ctrl+Shift+Z)"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m15 14 5-5-5-5"/><path d="M20 9H9a5 5 0 0 0 0 10h3"/></svg></button>
    <button class="tb primary" id="exportBtn" title="Save the map as a PNG image"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M12 4v11M7 10l5 5 5-5M5 20h14"/></svg><span class="lbl">Export PNG</span></button>
  </header>

  <nav class="rail" id="rail" aria-label="Tools">
    <button data-tool="select" title="Select and move (V)"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 3l14 8-6 2-2 6z"/></svg></button>
    <button data-tool="hand" title="Pan (H, or hold Space)"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M8 13V5.5a1.5 1.5 0 0 1 3 0V12M11 11V4.5a1.5 1.5 0 0 1 3 0V12M14 11.5V6a1.5 1.5 0 0 1 3 0v8a6 6 0 0 1-6 6h-1a6 6 0 0 1-5-2.7L3.5 14a1.5 1.5 0 0 1 2.5-1.7L8 15"/></svg></button>
    <div class="sep"></div>
    <button data-tool="land" title="Paint land (B)"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 17c2-5 5-1 7-5s4-6 9-4c-1 5-4 10-9 11s-6 1-7-2z"/></svg></button>
    <button data-tool="sea" title="Paint sea (E)"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9c2-2 4-2 6 0s4 2 6 0 4-2 6 0M3 15c2-2 4-2 6 0s4 2 6 0 4-2 6 0"/></svg></button>
    <button data-tool="stamp" title="Mountains, forests and places (S)"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M2 20 9 7l4 7 2-3 7 9z"/></svg></button>
    <button data-tool="path" title="Rivers, roads and borders (R)"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 20c4-1 3-6 7-7s3-6 9-9"/></svg></button>
    <button data-tool="label" title="Place names (T)"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 6V4h14v2M12 4v16M9 20h6"/></svg></button>
    <button data-tool="decor" title="Compass, scale bar and title"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="m12 5 2.5 7L12 19l-2.5-7z"/></svg></button>
    <button data-tool="erase" title="Erase features (X)"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m7 21-4-4 11-11 7 7-8 8zM10 21h11"/></svg></button>
  </nav>

  <main class="stage" id="stage">
    <canvas id="cv"></canvas>
    <div class="banner" id="banner" hidden></div>
    <div class="hint" id="hint"></div>
    <div class="zoom">
      <button id="zoomOut" title="Zoom out" aria-label="Zoom out">−</button>
      <button id="zoomFit" title="Fit the whole map" aria-label="Fit map"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="margin:auto"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
      <button id="zoomIn" title="Zoom in" aria-label="Zoom in">+</button>
    </div>
  </main>

  <aside class="drawer" id="drawer"></aside>
</div>

<script>
(() => {
"use strict";
// ======================= constants =======================
const W = 2400, H = 1600;            // sheet size in map units (exports at 2x: 4800 x 3200 px)
const GW = 241, GH = 161;            // terrain grid nodes; spacing 10 units
const SX = W / (GW - 1), SY = H / (GH - 1);
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const uid = () => Math.random().toString(36).slice(2, 10);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const SESSION = uid();

const STYLES = {
  parchment: { name: "Parchment", water: "#e6d5ae", land: "#f3e8cb", ink: "#3b2b1b", waterInk: "#5d4a33", river: "#3e5361", road: "#5c4128", border: "#8b3a2a", paper: true, rip: [.42, .28, .16] },
  atlas: { name: "Atlas", water: "#a8c5c0", land: "#ecdcad", ink: "#2e2618", waterInk: "#2c4d55", river: "#2e6b84", road: "#6a4a2a", border: "#9c392d", paper: true, rip: [.5, .32, .18] },
  ink: { name: "Ink", water: "#ffffff", land: "#ffffff", ink: "#141414", waterInk: "#222222", river: "#141414", road: "#141414", border: "#444444", paper: false, rip: [.55, .35, .2] },
};

const LABELS = {
  realm: { name: "Realm", font: "IM Fell English SC", size: 54, spacing: .32, italic: false, sea: false },
  region: { name: "Region", font: "IM Fell English SC", size: 32, spacing: .22, italic: false, sea: false },
  city: { name: "Settlement", font: "IM Fell English", size: 24, spacing: .02, italic: false, sea: false },
  sea: { name: "Sea", font: "IM Fell English", size: 36, spacing: .18, italic: true, sea: true },
  feature: { name: "Feature", font: "IM Fell English", size: 20, spacing: .06, italic: true, sea: false },
};

const STAMPS = [
  ["mountain", "Mountain", 64, true], ["hill", "Hills", 40, true], ["pine", "Pine forest", 34, true], ["tree", "Woodland", 34, true],
  ["marsh", "Marsh", 30, true], ["volcano", "Volcano", 72, false], ["capital", "Capital", 40, false], ["city", "City", 46, false],
  ["town", "Town", 34, false], ["village", "Village", 24, false], ["castle", "Castle", 50, false], ["tower", "Tower", 42, false],
  ["temple", "Temple", 38, false], ["ruin", "Ruins", 34, false], ["port", "Port", 32, false], ["cave", "Cave", 34, false],
  ["camp", "Camp", 28, false], ["battle", "Battlefield", 30, false], ["ship", "Ship", 50, false], ["dot", "Marker", 18, false],
];
const STAMP = Object.fromEntries(STAMPS.map(([k, n, s, sc]) => [k, { name: n, size: s, scatter: sc }]));

const PATHS = { river: "River", road: "Road", border: "Border" };
const TOOLS = {
  select: "Select", hand: "Pan", land: "Paint land", sea: "Paint sea", stamp: "Features", path: "Rivers & roads",
  label: "Place names", decor: "Decorations", erase: "Erase features",
};

// ======================= state =======================
const S = {
  map: null,              // {id, name, terrain: Uint8Array, items: [], settings: {}}
  saved: true, example: false,
  maps: [], docs: {},     // from the store
  db: null, downloads: null,
  tool: "land", brush: 60, stamp: "mountain", stampSize: 1, scatter: true,
  pathKind: "river", labelStyle: "realm", labelText: "", decor: "compass",
  sel: null, view: { x: 0, y: 0, z: .4 }, undo: [], redo: [],
  saving: false, saveAgain: false, storeState: "connecting",
};

function newMap(name) {
  return { id: uid() + uid(), name, terrain: new Uint8Array(GW * GH), items: [], settings: { style: "parchment", frame: true } };
}

// ======================= random & noise =======================
function rng(seed) { let s = (seed >>> 0) || 1; return () => { s ^= s << 13; s ^= s >>> 17; s ^= s << 5; return ((s >>> 0) % 1e6) / 1e6; }; }
function hashStr(t) { let h = 2166136261; for (const c of String(t)) { h ^= c.charCodeAt(0); h = Math.imul(h, 16777619); } return h >>> 0; }
function makeNoise(seed) {
  const r = rng(seed), P = new Float32Array(512 * 512);
  for (let i = 0; i < P.length; i++) P[i] = r();
  const v = (x, y) => P[((y & 511) << 9) | (x & 511)];
  const sm = t => t * t * (3 - 2 * t);
  const n = (x, y) => { const xi = Math.floor(x), yi = Math.floor(y), xf = sm(x - xi), yf = sm(y - yi);
    const a = v(xi, yi), b = v(xi + 1, yi), c = v(xi, yi + 1), d = v(xi + 1, yi + 1);
    return a + (b - a) * xf + (c - a) * yf + (a - b - c + d) * xf * yf; };
  return (x, y, oct = 5) => { let s = 0, amp = .5, f = 1, norm = 0; for (let o = 0; o < oct; o++) { s += amp * n(x * f + o * 17.3, y * f - o * 9.1); norm += amp; amp *= .5; f *= 2; } return s / norm; };
}
const wobble = makeNoise(7);

// ======================= terrain → coastline =======================
let coast = null; // {fill: Path2D, line: Path2D}
function buildCoast() {
  const t = S.map.terrain, f = new Float32Array(GW * GH), g = new Float32Array(GW * GH);
  for (let i = 0; i < t.length; i++) f[i] = t[i];
  // two box blurs round the cell edges into smooth shores
  for (let pass = 0; pass < 2; pass++) {
    const src = pass ? g : f, dst = pass ? f : g;
    for (let y = 0; y < GH; y++) for (let x = 0; x < GW; x++) {
      let s = 0, n = 0;
      for (let dy = -1; dy <= 1; dy++) { const yy = clamp(y + dy, 0, GH - 1); for (let dx = -1; dx <= 1; dx++) { s += src[yy * GW + clamp(x + dx, 0, GW - 1)]; n++; } }
      dst[y * GW + x] = s / n;
    }
  }
  const T = .5, fill = new Path2D(), line = new Path2D();
  const jit = (x, y) => [x + (wobble(x / 60, y / 60, 3) - .5) * 14, y + (wobble(x / 60 + 40, y / 60 + 40, 3) - .5) * 14];
  const lerp = (x1, y1, v1, x2, y2, v2) => { const k = (T - v1) / (v2 - v1); return jit(x1 + (x2 - x1) * k, y1 + (y2 - y1) * k); };
  for (let y = 0; y < GH - 1; y++) {
    let run = -1;
    for (let x = 0; x < GW - 1; x++) {
      const a = f[y * GW + x], b = f[y * GW + x + 1], c = f[(y + 1) * GW + x + 1], d = f[(y + 1) * GW + x];
      const inA = a >= T, inB = b >= T, inC = c >= T, inD = d >= T;
      if (inA && inB && inC && inD) { if (run < 0) run = x; continue; }
      if (run >= 0) { fill.rect(run * SX - .5, y * SY - .5, (x - run) * SX + 1, SY + 1); run = -1; }
      if (!inA && !inB && !inC && !inD) continue;
      const x0 = x * SX, y0 = y * SY, x1 = x0 + SX, y1 = y0 + SY;
      const corners = [[x0, y0, a, inA], [x1, y0, b, inB], [x1, y1, c, inC], [x0, y1, d, inD]];
      const poly = [], cross = [];
      for (let k = 0; k < 4; k++) {
        const p = corners[k], q = corners[(k + 1) % 4];
        if (p[3]) poly.push([p[0], p[1]]);
        if (p[3] !== q[3]) { const m = lerp(p[0], p[1], p[2], q[0], q[1], q[2]); poly.push(m); cross.push(m); }
      }
      fill.moveTo(poly[0][0], poly[0][1]); for (let k = 1; k < poly.length; k++) fill.lineTo(poly[k][0], poly[k][1]); fill.closePath();
      for (let k = 0; k + 1 < cross.length; k += 2) { line.moveTo(cross[k][0], cross[k][1]); line.lineTo(cross[k + 1][0], cross[k + 1][1]); }
    }
    if (run >= 0) fill.rect(run * SX - .5, y * SY - .5, (GW - 1 - run) * SX + 1, SY + 1);
  }
  coast = { fill, line };
}

// ======================= paper texture =======================
let paperTex = null;
function buildPaper() {

// ======================= generator =======================
function generate(kind, features, seed = (Math.random() * 1e9) | 0) {
  const r = rng(seed), noise = makeNoise(seed), ridge = makeNoise(seed + 1), wood = makeNoise(seed + 2);
  const h = new Float32Array(GW * GH);
  for (let y = 0; y < GH; y++) for (let x = 0; x < GW; x++) {
    const nx = x / GW, ny = y / GH, dx = (nx - .5) * 2, dy = (ny - .5) * 2, d = Math.sqrt(dx * dx * .9 + dy * dy * 1.1);
    const e = kind === "archipelago" ? noise(nx * 7, ny * 5, 5) : noise(nx * 3.2, ny * 2.4, 6);
    h[y * GW + x] = kind === "blank" ? -1 : e - d * (kind === "archipelago" ? .32 : .62);
  }
  const m = newMap("Untitled map"), target = kind === "archipelago" ? .27 : .4;
  if (kind !== "blank") { const sorted = Float32Array.from(h).sort(), thr = sorted[Math.floor(sorted.length * (1 - target))]; for (let i = 0; i < h.length; i++) m.terrain[i] = h[i] >= thr ? 1 : 0; }
  // keep the very edge as sea so the landmass sits inside the frame
  for (let y = 0; y < GH; y++) for (let x = 0; x < GW; x++) if (x < 5 || y < 5 || x > GW - 6 || y > GH - 6) m.terrain[y * GW + x] = 0;
  if (!features || kind === "blank") return m;

  const T = m.terrain, idx = (x, y) => y * GW + x;
  // distance (in grid steps) from each cell to the nearest cell of the other kind
  const dist = new Int16Array(GW * GH).fill(-1), q = [];
  for (let y = 0; y < GH; y++) for (let x = 0; x < GW; x++) { const v = T[idx(x, y)];
    if ((x > 0 && T[idx(x - 1, y)] !== v) || (x < GW - 1 && T[idx(x + 1, y)] !== v) || (y > 0 && T[idx(x, y - 1)] !== v) || (y < GH - 1 && T[idx(x, y + 1)] !== v)) { dist[idx(x, y)] = 0; q.push(idx(x, y)); } }
  for (let qi = 0; qi < q.length; qi++) { const i = q[qi], x = i % GW, y = (i / GW) | 0;
    for (const [nx, ny] of [[x - 1, y], [x + 1, y], [x, y - 1], [x, y + 1]]) if (nx >= 0 && ny >= 0 && nx < GW && ny < GH) { const j = idx(nx, ny); if (dist[j] < 0 && T[j] === T[i]) { dist[j] = dist[i] + 1; q.push(j); } } }
  const land = (x, y) => T[idx(clamp(Math.round(x / SX), 0, GW - 1), clamp(Math.round(y / SY), 0, GH - 1))] === 1;
  const inland = (x, y) => dist[idx(clamp(Math.round(x / SX), 0, GW - 1), clamp(Math.round(y / SY), 0, GH - 1))];
  const items = m.items, used = [];
  const free = (x, y, rad) => used.every(u => Math.hypot(u[0] - x, u[1] - y) > rad + u[2]);
  const icon = (kind, x, y, s) => { const it = { id: uid(), type: "icon", kind, x: Math.round(x), y: Math.round(y), s: Math.round(s) }; items.push(it); used.push([x, y - s * .4, s * .45]); return it; };

  // mountains along ridges
  const peaks = [];
  for (let y = 120; y < H - 80; y += 42) for (let x = 80; x < W - 80; x += 50) {
    const jx = x + (r() - .5) * 30, jy = y + (r() - .5) * 24, rv = 1 - Math.abs(ridge(jx / 520, jy / 520, 4) * 2 - 1);
    if (land(jx, jy) && inland(jx, jy) > 3 && rv > .9 && free(jx, jy, 20)) peaks.push(icon("mountain", jx, jy, 50 + r() * 26));
    else if (land(jx, jy) && inland(jx, jy) > 2 && rv > .83 && r() < .4 && free(jx, jy, 16)) icon("hill", jx, jy, 32 + r() * 12);
  }
  // forests
  for (let y = 80; y < H - 60; y += 26) for (let x = 60; x < W - 60; x += 28) {
    const jx = x + (r() - .5) * 18, jy = y + (r() - .5) * 14, wv = wood(jx / 300, jy / 300, 4);
    if (land(jx, jy) && inland(jx, jy) > 1 && wv > .6 && free(jx, jy, 10)) icon(wv > .66 ? "pine" : "tree", jx, jy, 28 + r() * 10);
  }
  // settlements: a capital inland, cities and ports on the coast, towns between
  const spots = [];
  for (let i = 0; i < 4000 && spots.length < 400; i++) { const x = 120 + r() * (W - 240), y = 140 + r() * (H - 260); if (land(x, y)) spots.push([x, y, inland(x, y)]); }
  const names = new Set(), uniq = f => { let n; do n = f(r); while (names.has(n)); names.add(n); return n; };
  const place = (kind, pred, size, label) => { const s = spots.find(p => pred(p) && free(p[0], p[1], 46)); if (!s) return null;
    const it = icon(kind, s[0], s[1], size);
    if (label) items.push({ id: uid(), type: "label", x: Math.round(s[0]), y: Math.round(s[1] + 22), text: uniq(placeName), style: "city", rot: 0, bend: 0, size: kind === "capital" ? 28 : 22 });
    return it; };
  const capital = place("capital", p => p[2] > 8, 40, true);
  const cities = [];
  for (let i = 0; i < 3; i++) { const c = place(i === 0 ? "port" : "city", p => p[2] >= 1 && p[2] <= 3, i === 0 ? 34 : 44, true); if (c) cities.push(c); }
  for (let i = 0; i < 4; i++) { const c = place(i % 2 ? "village" : "town", p => p[2] > 2, i % 2 ? 24 : 34, true); if (c) cities.push(c); }
  place("castle", p => p[2] > 5, 48, false); place("ruin", p => p[2] > 4, 34, false); place("tower", p => p[2] > 3, 42, false);

  // rivers run downhill from the mountains to the sea
  const hval = (x, y) => h[idx(clamp(Math.round(x / SX), 0, GW - 1), clamp(Math.round(y / SY), 0, GH - 1))];
  peaks.filter(pk => inland(pk.x, pk.y) > 8).sort((a, b) => inland(b.x, b.y) - inland(a.x, a.y)).filter((pk, i, arr) => arr.slice(0, i).every(o => Math.hypot(o.x - pk.x, o.y - pk.y) > 300)).slice(0, 5).forEach(pk => {
    let x = pk.x + 20, y = pk.y + 6; const pts = [[x, y]];
    for (let step = 0; step < 220 && land(x, y); step++) {
      let best = null, bv = Infinity;
      for (let a = 0; a < 12; a++) { const ang = a * Math.PI / 6, nx = x + Math.cos(ang) * 18, ny = y + Math.sin(ang) * 18, v = hval(nx, ny) + (r() - .5) * .02 + inland(nx, ny) * .004; if (v < bv) { bv = v; best = [nx, ny]; } }
      x = best[0]; y = best[1]; pts.push([x, y]);
    }
    if (!land(x, y) && pts.length > 8) items.push({ id: uid(), type: "path", kind: "river", pts: simplify(pts, 3), w: 1 });
  });
  // roads from the capital
  if (capital) cities.forEach(c => {
    const pts = [[capital.x, capital.y]], n = 8;
    for (let i = 1; i < n; i++) { const t = i / n; pts.push([capital.x + (c.x - capital.x) * t + (r() - .5) * 50, capital.y + (c.y - capital.y) * t + (r() - .5) * 50]); }
    pts.push([c.x, c.y]);
    if (pts.every(p => land(p[0], p[1]))) items.push({ id: uid(), type: "path", kind: "road", pts, w: 1 });
  });
  // names for the realm and the sea, a compass, a scale and a title
  let cx = 0, cy = 0, n = 0; for (let y = 0; y < GH; y += 2) for (let x = 0; x < GW; x += 2) if (T[idx(x, y)]) { cx += x * SX; cy += y * SY; n++; }
  if (n) { cx /= n; cy /= n; let best = [cx, cy], bd = -1; for (const s of spots) if (s[2] > bd && Math.hypot(s[0] - cx, s[1] - cy) < 400 && free(s[0], s[1] - 30, 60)) { bd = s[2]; best = s; }
    m.name = uniq(realmName); items.push({ id: uid(), type: "label", x: Math.round(best[0]), y: Math.round(best[1] - 40), text: m.name, style: "realm", rot: 0, bend: .12, size: 58 }); }
  const corner = (cands, rad) => cands.find(([x, y]) => !land(x, y) && !land(x - rad, y - rad) && !land(x + rad, y + rad)) || cands[0];
  const [ccx, ccy] = corner([[W - 190, H - 210], [190, H - 210], [W - 190, 230], [190, 230]], 110); items.push({ id: uid(), type: "compass", x: ccx, y: ccy, s: 110 });
  const [scx, scy] = corner([[W - 420, H - 90], [110, H - 90]], 40); items.push({ id: uid(), type: "scale", x: scx, y: scy, s: 300, text: "100 leagues" });
  let sea = null, sd = -1; for (let y = 22; y < GH - 22; y += 3) for (let x = 36; x < GW - 36; x += 3) { const i = idx(x, y), px = x * SX, py = y * SY;
    if (!T[i] && dist[i] > sd && Math.hypot(px - ccx, py - ccy) > 300 && Math.hypot(px - scx - 150, py - scy) > 220) { sd = dist[i]; sea = [px, py]; } }
  if (sea) items.push({ id: uid(), type: "label", x: Math.round(sea[0]), y: Math.round(sea[1]), text: uniq(seaName), style: "sea", rot: 0, bend: -.08, size: 36 });
  m.settings.style = "parchment";
  return m;
}

// ======================= storage =======================
function packTerrain(t) { const b = new Uint8Array(Math.ceil(t.length / 8)); for (let i = 0; i < t.length; i++) if (t[i]) b[i >> 3] |= 1 << (i & 7); let s = ""; for (let i = 0; i < b.length; i++) s += String.fromCharCode(b[i]); return btoa(s); }

const AND = window.MapwrightAndroid || null;
function getDoc(id) { if (AND) { try { return JSON.parse(AND.loadMap(id) || "null"); } catch { return null; } } return S.docs[id]; }
function mapDoc(m) { return { name: m.name, updatedAt: Date.now(), editor: SESSION, v: 1, terrain: packTerrain(m.terrain), items: m.items, settings: m.settings }; }
function docToMap(id, d) { return { id, name: d.name || "Untitled map", terrain: unpackTerrain(d.terrain), items: Array.isArray(d.items) ? d.items : [], settings: Object.assign({ style: "parchment", frame: true }, d.settings || {}) }; }

let saveTimer = 0;
function changed(save = true) {
  render();
  if (!save) return;
  S.saved = false; S.example = false; $("#banner").hidden = true;
  setStatus();
  clearTimeout(saveTimer); saveTimer = setTimeout(saveNow, 1200);
}
async function saveNow() {
  if (AND && S.map) {
    const m = S.map, doc = mapDoc(m), res = AND.saveMap(m.id, JSON.stringify(doc));
    if (res === "ok") { S.saved = true; S.storeState = "ok"; const e = S.maps.find(x => x.id === m.id); if (e) { e.name = m.name; e.updatedAt = doc.updatedAt; } else S.maps.unshift({ id: m.id, name: m.name, updatedAt: doc.updatedAt }); renderMapSelect(); }
    else S.storeState = res === "full" ? "full" : "error";
    return setStatus();
  }
  if (!S.db || !S.map) return setStatus();
  if (S.saving) { S.saveAgain = true; return; }
  S.saving = true; setStatus();
  const m = S.map;
  try {
    await S.db.doc("maps/" + m.id).set(mapDoc(m));
    if (S.map === m && !S.saveAgain) S.saved = true;
    S.storeState = "ok";
  } catch (err) {
    S.storeState = err && err.code === "permission_denied" ? "readonly" : err && err.code === "quota_exceeded" ? "full" : "error";
  }

  if (S.saveAgain) { S.saveAgain = false; saveNow(); }
}
function setStatus() {
  const el = $("#status"); el.classList.remove("warn");
  if (S.storeState === "none") { el.textContent = "Not saved: sign in to claude.ai to keep maps"; el.classList.add("warn"); return; }
  if (S.storeState === "connecting") { el.textContent = "Connecting…"; return; }
  if (S.storeState === "readonly") { el.textContent = "View only: you can't save changes to these maps"; el.classList.add("warn"); return; }
  if (S.storeState === "full") { el.textContent = "Storage full: delete a map to keep saving"; el.classList.add("warn"); return; }
  if (S.storeState === "error") { el.textContent = "Couldn't save. Retrying with your next change"; el.classList.add("warn"); return; }
  el.textContent = S.example ? "Example, not saved yet" : S.saving ? "Saving…" : S.saved ? (AND ? "Saved on this phone" : "Saved") : "Unsaved changes";
}

function openMap(m, example = false) {
  S.map = m; S.example = example; S.saved = !example; S.sel = null; S.undo = []; S.redo = []; dirtyCoast = true;
  updateHistoryButtons(); renderMapSelect(); renderDrawer(); setStatus(); fit();
  const b = $("#banner"); b.hidden = !example; b.textContent = "Example map, made up for you. Change anything to keep it, or start a new map from the Map menu.";

  const sel = $("#mapSelect"), list = S.maps.slice();

  sel.innerHTML = list.map(m => `<option value="${esc(m.id)}" ${S.map && m.id === S.map.id ? "selected" : ""}>${esc(m.id === S.map?.id ? S.map.name : m.name)}</option>`).join("");

$("#mapSelect").addEventListener("change", e => {

let menuEl = null;

  const r = anchor.getBoundingClientRect(), m = menuEl.getBoundingClientRect();

const finishRename = () => {
  const inp = $("#mapName"); if (inp.hidden) return;

};

  }
  if (t === "path") h += `<div class="seg" id="pathKind">${Object.entries(PATHS).map(([k, v]) => `<button data-v="${k}" aria-pressed="${S.pathKind === k}">${v}</button>`).join("")}</div>`;
  if (t === "label") h += `<input class="field" id="labelText" type="text" placeholder="Name, or leave blank for a made-up one" value="${esc(S.labelText)}" maxlength="80">
      <div class="seg" id="labelStyle">${Object.entries(LABELS).map(([k, v]) => `<button data-v="${k}" aria-pressed="${S.labelStyle === k}">${v.name}</button>`).join("")}</div>`;
  if (t === "decor") h += `<div class="seg" id="decorKind"><button data-v="compass" aria-pressed="${S.decor === "compass"}">Compass</button><button data-v="scale" aria-pressed="${S.decor === "scale"}">Scale bar</button><button data-v="cartouche" aria-pressed="${S.decor === "cartouche"}">Title</button></div>`;
  h += `<p>${HINTS[t]}</p></section>`;
  if (m) {
    h += `<section><h3>Map</h3>
      <div class="seg" id="mapStyle">${Object.entries(STYLES).map(([k, v]) => `<button data-v="${k}" aria-pressed="${m.settings.style === k}">${v.name}</button>`).join("")}</div>
      <label class="check"><input type="checkbox" id="mapFrame" ${m.settings.frame ? "checked" : ""}> Border</label>
      <p>${m.items.filter(i => i.type === "label").length} names · ${m.items.filter(i => i.type === "icon").length} features · ${m.items.filter(i => i.type === "path").length} rivers and roads</p>
      <p>Exports as a 4800 × 3200 PNG, enough for a full book page at 300 dpi.</p></section>
      <section><h3>Keys</h3><p><kbd>V</kbd> select · <kbd>B</kbd> land · <kbd>E</kbd> sea · <kbd>S</kbd> features · <kbd>R</kbd> rivers · <kbd>T</kbd> names · <kbd>X</kbd> erase · <kbd>Space</kbd> pan · <kbd>Ctrl Z</kbd> undo</p></section>`;
  }
  d.innerHTML = h;
  // previews are drawn once and reused
  d.querySelectorAll("#stamps button").forEach(b => { const k = b.dataset.k; previews[k] ??= stampPreview(k); const c = document.createElement("canvas"); c.width = 96; c.height = 96; c.getContext("2d").drawImage(previews[k], 0, 0); b.appendChild(c); });
}

// drawer events (delegated so re-renders keep working)
let editPushed = false;
$("#drawer").addEventListener("pointerdown", () => { editPushed = false; });
$("#drawer").addEventListener("input", e => {
  const id = e.target.id, v = e.target.type === "range" ? parseFloat(e.target.value) : e.target.value, sel = selected();
  const vEl = document.getElementById(id + "V");
  if (vEl) vEl.textContent = id === "selBend" ? Math.round(v * 100) : id === "selRot" ? v + "°" : id === "selW" ? v + "×" : id === "stampSize" ? Math.round(v * 100) + "%" : v;
  if (id === "brush") { S.brush = v; render(); return; }
  if (id === "stampSize") { S.stampSize = v; return; }
  if (id === "labelText") { S.labelText = v; return; }
  if (!sel) return;
  if (!editPushed) { pushUndo(); editPushed = true; }
  if (id === "selText") sel.text = v;
  if (id === "selSize") { if (sel.type === "icon" || sel.type === "compass" || sel.type === "scale") sel.s = v; else sel.size = v; }
  if (id === "selBend") sel.bend = v;
  if (id === "selRot") sel.rot = v;
  if (id === "selW") sel.w = v;
  changed();
});
$("#drawer").addEventListener("change", e => {
  if (e.target.id === "scatter") S.scatter = e.target.checked;
  if (e.target.id === "mapFrame") { pushUndo(); S.map.settings.frame = e.target.checked; changed(); }
  if (e.target.id === "selText") editPushed = false;
});
$("#drawer").addEventListener("click", e => {
  const b = e.target.closest("button"); if (!b) return;
  const seg = b.closest(".seg"), sel = selected();
  if (b.dataset.k) { S.stamp = b.dataset.k; renderDrawer(); return; }
  if (b.id === "selDelete") return deleteSelected();
  if (b.id === "selReverse" && sel) { pushUndo(); sel.pts.reverse(); changed(); return; }
  if (!seg) return;
  const v = b.dataset.v;
  if (seg.id === "pathKind") S.pathKind = v;
  if (seg.id === "labelStyle") S.labelStyle = v;
  if (seg.id === "decorKind") S.decor = v;
  if (seg.id === "mapStyle") { pushUndo(); S.map.settings.style = v; changed(); }
  if (seg.id === "selStyle" && sel) { pushUndo(); sel.style = v; sel.size = LABELS[v].size; changed(); }
  if (seg.id === "selKind" && sel) { pushUndo(); sel.kind = v; changed(); }
  renderDrawer();
});
$("#rail").addEventListener("click", e => { const b = e.target.closest("[data-tool]"); if (!b) return;
  if (b.dataset.tool === S.tool && matchMedia("(max-width: 760px)").matches) { $("#drawer").classList.toggle("collapsed"); return; }
  setTool(b.dataset.tool); });
$("#undoBtn").onclick = undo; $("#redoBtn").onclick = redo;
$("#zoomIn").onclick = () => { const r = cv.getBoundingClientRect(); zoomAt(1.3, r.width / 2, r.height / 2); };
$("#zoomOut").onclick = () => { const r = cv.getBoundingClientRect(); zoomAt(1 / 1.3, r.width / 2, r.height / 2); };
$("#zoomFit").onclick = fit;
new ResizeObserver(() => { if (!S.userMoved && S.map) fit(); else render(); }).observe(cv);

// ======================= export =======================
$("#exportBtn").addEventListener("click", async () => {
  const btn = $("#exportBtn"), label = btn.querySelector(".lbl");
  if (AND) {
    label && (label.textContent = "Exporting…"); btn.disabled = true;
    setTimeout(() => {
      try {
        const c = document.createElement("canvas"); c.width = W * 2; c.height = H * 2;
        const x = c.getContext("2d"); x.scale(2, 2); drawMap(x, { clean: true });
        const name = (S.map.name || "map").replace(/[^\w\- ]+/g, "").trim().replace(/\s+/g, "-").toLowerCase() || "map";
        // handed over in 1 MB pieces: one 24 MB string is too much for some phones
        const b64 = c.toDataURL("image/png").split(",")[1]; c.width = c.height = 0;
        const job = AND.beginPng(name + ".png"); let res = job.startsWith("Couldn") ? job : "";
        for (let i = 0; !res && i < b64.length; i += 1 << 20) if (AND.appendPng(job, b64.slice(i, i + (1 << 20))) !== "ok") res = "Export failed: the phone ran out of space";
        if (!res) res = AND.finishPng(job);
        $("#status").textContent = res; $("#status").classList.toggle("warn", !res.startsWith("Saved"));
      } catch (err) { $("#status").textContent = "Export failed: the map is too large for this phone's memory"; $("#status").classList.add("warn"); }
      label && (label.textContent = "Export PNG"); btn.disabled = false;
    }, 30);
    return;
  }
  if (!S.downloads) { $("#status").textContent = "Export isn't available in this view. Open the map on claude.ai while signed in."; $("#status").classList.add("warn"); return; }
  label && (label.textContent = "Exporting…"); btn.disabled = true;
  try {
    const c = document.createElement("canvas"); c.width = W * 2; c.height = H * 2;
    const x = c.getContext("2d"); x.scale(2, 2); drawMap(x, { clean: true });
    const blob = await new Promise(res => c.toBlob(res, "image/png"));
    const name = (S.map.name || "map").replace(/[^\w\- ]+/g, "").trim().replace(/\s+/g, "-").toLowerCase() || "map";
    await S.downloads.save({ filename: name + ".png", data: blob });
  } catch (err) {
    if (err && err.code && err.code !== "cancelled" && err.code !== "declined") { $("#status").textContent = "Export failed: " + (err.message || err.code); $("#status").classList.add("warn"); }
  }
  label && (label.textContent = "Export PNG"); btn.disabled = false;
});

// ======================= start =======================
buildPaper();
setTool("select");
openMap(generate("continent", true, 20481), true);
if (document.fonts) document.fonts.ready.then(() => render());
updateHistoryButtons();

window.__flush = () => { clearTimeout(saveTimer); if (!S.saved && !S.example) saveNow(); };
if (AND) {
  S.storeState = "ok";
  try { S.maps = JSON.parse(AND.listMaps() || "[]"); } catch { S.maps = []; }
  const last = AND.lastMap(), pick = S.maps.find(m => m.id === last) || S.maps[0], d = pick && getDoc(pick.id);
  if (d) openMap(docToMap(pick.id, d)); else renderMapSelect();
  setStatus();
}
(async () => {
  if (AND) return;
  if (!window.claude?.use) { S.storeState = "none"; return setStatus(); }
  const [db, downloads] = await Promise.all([claude.use("db"), claude.use("downloads")]);
  S.downloads = downloads;
  if (!downloads) $("#exportBtn").title = "Export isn't available in this view";
  if (!db) { S.storeState = "none"; return setStatus(); }
  S.db = db;
  let first = true;
  const timer = setTimeout(() => { if (first) { S.storeState = "error"; setStatus(); } }, 10000);
  db.collection("maps").orderBy("updatedAt", "desc").onSnapshot(snap => {
    clearTimeout(timer);
    if (S.storeState === "connecting" || S.storeState === "error") S.storeState = "ok";
    S.docs = {}; S.maps = snap.docs.map(d => { const data = d.data(); S.docs[d.id] = data; return { id: d.id, name: data.name || "Untitled map", updatedAt: data.updatedAt || 0 }; });
    if (first) {
      first = false;
      let last = null; try { last = localStorage.getItem("mapwright:last"); } catch {}
      const pick = S.maps.find(m => m.id === last) || S.maps[0];
      if (pick && (S.example || S.saved)) openMap(docToMap(pick.id, S.docs[pick.id]));
    } else if (S.map && S.saved && !S.saving) {
      // someone else changed the open map: show their version
      const d = S.docs[S.map.id];
      if (d && d.editor !== SESSION && !snap.metadata?.hasPendingWrites) { const keepView = S.view; openMap(docToMap(S.map.id, d)); S.view = keepView; render(); }
    }
    renderMapSelect(); setStatus();
  }, err => { clearTimeout(timer); S.storeState = "error"; setStatus(); });
})();
})();
</script>
